<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kur'an Kelimeleri</title>
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}
/* Layout: tek sütun, telefon ölçüsünde kart; üstte mod sekmeleri, ortada soru, altta seçenekler. Mushaf kâğıdı + lâcivert mürekkep + tezhip altını */
:root{
  --paper:#f6f4ee; --card:#fffdf8; --ink:#1d2a44; --muted:#5e6577; --line:#dcd8cc;
  --lapis:#2747a0; --lapis-soft:#e4e9f7; --gold:#a8781c; --gold-soft:#f5ead3;
  --ok:#1f7a4d; --ok-soft:#dcf0e4; --bad:#b03a2e; --bad-soft:#f7e1de;
  --f-ar:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;
  --f-disp:"Literata",Georgia,serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
h1 span{font-family:var(--f-ar);color:var(--gold);font-weight:700;margin-inline-start:6px}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);
  font:500 .88rem var(--f-ui);padding:6px 10px;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
nav.tabs button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--card)}
.filter{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.filter{flex-wrap:wrap}
.filter select{flex:1 1 200px;min-height:42px;font:500 1rem var(--f-ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line)}
.kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.prompt{font-family:var(--f-disp);font-size:1.18rem;font-weight:500;text-wrap:balance;margin:0}
.big{font-family:var(--f-ar);font-size:clamp(2.4rem,12vw,3.1rem);line-height:1.35;text-align:center;color:var(--lapis);direction:rtl}
.bignum{font-family:var(--f-disp);font-size:clamp(2.6rem,13vw,3.4rem);text-align:center;color:var(--lapis);font-variant-numeric:tabular-nums;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin-top:-8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:76px;min-width:0;border:1.5px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;background:var(--paper);color:var(--ink);border-radius:12px;
  font:500 1rem var(--f-ui);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .ar{font-family:var(--f-ar);font-size:1.5rem;line-height:1.2;direction:rtl}
.opt .tr{font-size:.85rem;color:var(--muted)}
.opt.num{font-family:var(--f-disp);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--lapis)}}
.opt:active:not(:disabled){transform:scale(.98);border-color:var(--lapis)}
.opt:focus-visible,nav.tabs button:focus-visible,.next:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.right .tr{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;background:var(--gold-soft);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.feedback .title{font-weight:600}
.feedback .ar{font-family:var(--f-ar);font-size:1.45rem;line-height:1.3}
.feedback{scroll-margin-bottom:96px}
.feedback .fbhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.next{display:block;width:100%;max-width:520px;margin:0 auto;min-height:56px;border:0;border-radius:14px;background:var(--lapis);color:var(--card);font:600 1.05rem var(--f-ui);padding:14px;cursor:pointer;touch-action:manipulation}
.weak{font-size:.85rem;color:var(--muted)}
.install{align-self:flex-start;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);font:600 .9rem var(--f-ui);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:42px}
.weak b{color:var(--ink);font-weight:600}
/* Liste */
.list{display:flex;flex-direction:column;gap:6px}
.search{font:400 1rem var(--f-ui);min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .no{font-family:var(--f-disp);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center}
.row .mid{min-width:0}
.row .nm{font-weight:600}
.row .mn{font-size:.82rem;color:var(--muted)}
.row .rt{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .rar{font-family:var(--f-ar);font-size:1.3rem;line-height:1.1;color:var(--lapis)}
.pill{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.d{background:var(--gold-soft);color:var(--gold)}
.note{font-size:.78rem;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:14px}
.prog h3{font:600 1rem var(--f-ui);margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.35rem;color:var(--lapis);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:.7rem;color:var(--muted)}
.stk{width:70%;height:70%;display:flex;flex-direction:column;justify-content:flex-end}.stk:empty,.stk.z{border-bottom:2px solid var(--line)}
.bar{width:100%;background:var(--lapis)}
.bar.w{background:var(--bad);border-radius:0}
.mrow{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:.85rem}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .88rem var(--f-ui);padding:10px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s,transform .08s}}
/* Yatay tutuş: başlık küçülür, seçenekler dört sütun */
@media (orientation:landscape) and (max-height:500px){
  body{padding-block:8px 84px}
  .wrap{max-width:760px;gap:10px}
  .card{padding:14px 16px;gap:10px}
  .big{font-size:2.2rem}.bignum{font-size:2.3rem}
  .opts{grid-template-columns:repeat(4,1fr)}.opts.two{grid-template-columns:1fr 1fr}
  .opt{min-height:60px}
  .next{max-width:760px}
}
.ayah{font-family:var(--f-ar);font-size:1.55rem;line-height:2.1;direction:rtl;text-align:center;color:var(--ink);background:var(--paper);border-radius:12px;padding:10px 12px}
.ref{text-align:center;color:var(--muted);font-size:.85rem;margin-top:-8px}
.opt.mean{font-size:.98rem;line-height:1.3}
.opt .arw{font-family:var(--f-ar);font-size:1.7rem;line-height:1.3;direction:rtl}
.feedback .ayah{font-size:1.3rem;background:transparent;padding:4px 0;text-align:right}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wrow .m{font-size:.92rem}.wrow .m small{display:block;color:var(--muted);font-size:.76rem}
.wrow .a{font-family:var(--f-ar);font-size:1.5rem;color:var(--lapis);direction:rtl}
.wrow.ok{border-color:var(--ok)}
.sh{font:600 .95rem var(--f-ui);margin:10px 0 2px;color:var(--gold)}
.applink{font-size:.85rem;color:var(--lapis);text-decoration:none;font-weight:600}
</style>

:3": "وَمَا يُدۡرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ", "80:6": "فَأَنتَ لَهُۥ تَصَدَّىٰ", "80:10": "فَأَنتَ عَنۡهُ تَلَهَّىٰ", "80:13": "فِي صُحُفٖ مُّكَرَّمَةٖ", "80:15": "بِأَيۡدِي سَفَرَةٖ", "80:16": "كِرَامِۭ بَرَرَةٖ", "80:17": "قُتِلَ ٱلۡإِنسَٰنُ مَآ أَكۡفَرَهُۥ", "80:19": "مِن نُّطۡفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ", "80:21": "ثُمَّ أَمَاتَهُۥ فَأَقۡبَرَهُۥ", "80:22": "ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ", "80:26": "ثُمَّ شَقَقۡنَا ٱلۡأَرۡضَ شَقّٗا", "80:27": "فَأَنۢبَتۡنَا فِيهَا حَبّٗا", "80:28": "وَعِنَبٗا وَقَضۡبٗا", "80:29": "وَزَيۡتُونٗا وَنَخۡلٗا", "80:30": "وَحَدَآئِقَ غُلۡبٗا", "80:31": "وَفَٰكِهَةٗ وَأَبّٗا", "80:32": "مَّتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ", "80:33": "فَإِذَا جَآءَتِ ٱلصَّآخَّةُ", "80:34": "يَوۡمَ يَفِرُّ ٱلۡمَرۡءُ مِنۡ أَخِيهِ", "80:38": "وُجُوهٞ يَوۡمَئِذٖ مُّسۡفِرَةٞ", "80:39": "ضَاحِكَةٞ مُّسۡتَبۡشِرَةٞ", "80:40": "وَوُجُوهٞ يَوۡمَئِذٍ عَلَيۡهَا غَبَرَةٞ", "80:41": "تَرۡهَقُهَا قَتَرَةٌ", "80:42": "أُوْلَـٰٓئِكَ هُمُ ٱلۡكَفَرَةُ ٱلۡفَجَرَةُ", "81:1": "إِذَا ٱلشَّمۡسُ كُوِّرَتۡ", "81:2": "وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتۡ", "81:3": "وَإِذَا ٱلۡجِبَالُ سُيِّرَتۡ", "81:4": "وَإِذَا ٱلۡعِشَارُ عُطِّلَتۡ", "81:5": "وَإِذَا ٱلۡوُحُوشُ حُشِرَتۡ", "81:6": "وَإِذَا ٱلۡبِحَارُ سُجِّرَتۡ", "81:7": "وَإِذَا ٱلنُّفُوسُ زُوِّجَتۡ", "81:8": "وَإِذَا ٱلۡمَوۡءُۥدَةُ سُئِلَتۡ", "81:10": "وَإِذَا ٱلصُّحُفُ نُشِرَتۡ", "81:11": "وَإِذَا ٱلسَّمَآءُ كُشِطَتۡ", "81:12": "وَإِذَا ٱلۡجَحِيمُ سُعِّرَتۡ", "81:13": "وَإِذَا ٱلۡجَنَّةُ أُزۡلِفَتۡ", "81:15": "فَلَآ أُقۡسِمُ بِٱلۡخُنَّسِ", "81:16": "ٱلۡجَوَارِ ٱلۡكُنَّسِ", "81:17": "وَٱلَّيۡلِ إِذَا عَسۡعَسَ", "81:18": "وَٱلصُّبۡحِ إِذَا تَنَفَّسَ", "81:20": "ذِي قُوَّةٍ عِندَ ذِي ٱلۡعَرۡشِ مَكِينٖ", "81:21": "مُّطَاعٖ ثَمَّ أَمِينٖ", "81:22": "وَمَا صَاحِبُكُم بِمَجۡنُونٖ", "81:23": "وَلَقَدۡ رَءَاهُ بِٱلۡأُفُقِ ٱلۡمُبِينِ", "81:24": "وَمَا هُوَ عَلَى ٱلۡغَيۡبِ بِضَنِينٖ", "81:25": "وَمَا هُوَ بِقَوۡلِ شَيۡطَٰنٖ رَّجِيمٖ", "82:1": "إِذَا ٱلسَّمَآءُ ٱنفَطَرَتۡ", "82:2": "وَإِذَا ٱلۡكَوَاكِبُ ٱنتَثَرَتۡ", "82:3": "وَإِذَا ٱلۡبِحَارُ فُجِّرَتۡ", "82:4": "وَإِذَا ٱلۡقُبُورُ بُعۡثِرَتۡ", "82:5": "عَلِمَتۡ نَفۡسٞ مَّا قَدَّمَتۡ وَأَخَّرَتۡ", "82:6": "يَـٰٓأَيُّهَا ٱلۡإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلۡكَرِيمِ", "82:7": "ٱلَّذِي خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ", "82:8": "فِيٓ أَيِّ صُورَةٖ مَّا شَآءَ رَكَّبَكَ", "82:10": "وَإِنَّ عَلَيۡكُمۡ لَحَٰفِظِينَ", "82:11": "كِرَامٗا كَٰتِبِينَ", "82:13": "إِنَّ ٱلۡأَبۡرَارَ لَفِي نَعِيمٖ", "82:19": "يَوۡمَ لَا تَمۡلِكُ نَفۡسٞ لِّنَفۡسٖ شَيۡـٔٗاۖ وَٱلۡأَمۡرُ يَوۡمَئِذٖ لِّلَّهِ", "83:1": "وَيۡلٞ لِّلۡمُطَفِّفِينَ", "83:2": "ٱلَّذِينَ إِذَا ٱكۡتَالُواْ عَلَى ٱلنَّاسِ يَسۡتَوۡفُونَ", "83:3": "وَإِذَا كَالُوهُمۡ أَو وَّزَنُوهُمۡ يُخۡسِرُونَ", "83:4": "أَلَا يَظُنُّ أُوْلَـٰٓئِكَ أَنَّهُم مَّبۡعُوثُونَ", "83:7": "كَلَّآ إِنَّ كِتَٰبَ ٱلۡفُجَّارِ لَفِي سِجِّينٖ", "83:9": "كِتَٰبٞ مَّرۡقُومٞ", "83:12": "وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعۡتَدٍ أَثِيمٍ", "83:13": "إِذَا تُتۡلَىٰ عَلَيۡهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلۡأَوَّلِينَ", "83:14": "كَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ", "83:15": "كَلَّآ إِنَّهُمۡ عَن رَّبِّهِمۡ يَوۡمَئِذٖ لَّمَحۡجُوبُونَ", "83:18": "كَلَّآ إِنَّ كِتَٰبَ ٱلۡأَبۡرَارِ لَفِي عِلِّيِّينَ", "83:21": "يَشۡهَدُهُ ٱلۡمُقَرَّبُونَ", "83:23": "عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ", "83:24": "تَعۡرِفُ فِي وُجُوهِهِمۡ نَضۡرَةَ ٱلنَّعِيمِ", "83:25": "يُسۡقَوۡنَ مِن رَّحِيقٖ مَّخۡتُومٍ", "83:26": "خِتَٰمُهُۥ مِسۡكٞۚ وَفِي ذَٰلِكَ فَلۡيَتَنَافَسِ ٱلۡمُتَنَٰفِسُونَ", "83:27": "وَمِزَاجُهُۥ مِن تَسۡنِيمٍ", "83:29": "إِنَّ ٱلَّذِينَ أَجۡرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضۡحَكُونَ", "83:30": "وَإِذَا مَرُّواْ بِهِمۡ يَتَغَامَزُونَ", "83:31": "وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهۡلِهِمُ ٱنقَلَبُواْ فَكِهِينَ", "83:36": "هَلۡ ثُوِّبَ ٱلۡكُفَّارُ مَا كَانُواْ يَفۡعَلُونَ", "84:1": "إِذَا ٱلسَّمَآءُ ٱنشَقَّتۡ", "84:2": "وَأَذِنَتۡ لِرَبِّهَا وَحُقَّتۡ", "84:3": "وَإِذَا ٱلۡأَرۡضُ مُدَّتۡ", "84:4": "وَأَلۡقَتۡ مَا فِيهَا وَتَخَلَّتۡ", "84:6": "يَـٰٓأَيُّهَا ٱلۡإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدۡحٗا فَمُلَٰقِيهِ", "84:7": "فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ", "84:8": "فَسَوۡفَ يُحَاسَبُ حِسَابٗا يَسِيرٗا", "84:10": "وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ", "84:11": "فَسَوۡفَ يَدۡعُواْ ثُبُورٗا", "84:14": "إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ", "84:16": "فَلَآ أُقۡسِمُ بِٱلشَّفَقِ", "84:17": "وَٱلَّيۡلِ وَمَا وَسَقَ", "84:18": "وَٱلۡقَمَرِ إِذَا ٱتَّسَقَ", "84:19": "لَتَرۡكَبُنَّ طَبَقًا عَن طَبَقٖ", "84:23": "وَٱللَّهُ أَعۡلَمُ بِمَا يُوعُونَ", "84:25": "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ لَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونِۭ", "85:1": "وَٱلسَّمَآءِ ذَاتِ ٱلۡبُرُوجِ", "85:2": "وَٱلۡيَوۡمِ ٱلۡمَوۡعُودِ", "85:3": "وَشَاهِدٖ وَمَشۡهُودٖ", "85:4": "قُتِلَ أَصۡحَٰبُ ٱلۡأُخۡدُودِ", "85:5": "ٱلنَّارِ ذَاتِ ٱلۡوَقُودِ", "85:6": "إِذۡ هُمۡ عَلَيۡهَا قُعُودٞ", "85:8": "وَمَا نَقَمُواْ مِنۡهُمۡ إِلَّآ أَن يُؤۡمِنُواْ بِٱللَّهِ ٱلۡعَزِيزِ ٱلۡحَمِيدِ", "85:10": "إِنَّ ٱلَّذِينَ فَتَنُواْ ٱلۡمُؤۡمِنِينَ وَٱلۡمُؤۡمِنَٰتِ ثُمَّ لَمۡ يَتُوبُواْ فَلَهُمۡ عَذَابُ جَهَنَّمَ وَلَهُمۡ عَذَابُ ٱلۡحَرِيقِ", "85:11": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ لَهُمۡ جَنَّـٰتٞ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُۚ ذَٰلِكَ ٱلۡفَوۡزُ ٱلۡكَبِيرُ", "85:12": "إِنَّ بَطۡشَ رَبِّكَ لَشَدِيدٌ", "85:13": "إِنَّهُۥ هُوَ يُبۡدِئُ وَيُعِيدُ", "85:14": "وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ", "85:15": "ذُو ٱلۡعَرۡشِ ٱلۡمَجِيدُ", "85:16": "فَعَّالٞ لِّمَا يُرِيدُ", "85:17": "هَلۡ أَتَىٰكَ حَدِيثُ ٱلۡجُنُودِ", "85:20": "وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطُۢ", "85:22": "فِي لَوۡحٖ مَّحۡفُوظِۭ", "86:1": "وَٱلسَّمَآءِ وَٱلطَّارِقِ", "86:3": "ٱلنَّجۡمُ ٱلثَّاقِبُ", "86:4": "إِن كُلُّ نَفۡسٖ لَّمَّا عَلَيۡهَا حَافِظٞ", "86:6": "خُلِقَ مِن مَّآءٖ دَافِقٖ", "86:7": "يَخۡرُجُ مِنۢ بَيۡنِ ٱلصُّلۡبِ وَٱلتَّرَآئِبِ", "86:9": "يَوۡمَ تُبۡلَى ٱلسَّرَآئِرُ", "86:10": "فَمَا لَهُۥ مِن قُوَّةٖ وَلَا نَاصِرٖ", "86:11": "وَٱلسَّمَآءِ ذَاتِ ٱلرَّجۡعِ", "86:12": "وَٱلۡأَرۡضِ ذَاتِ ٱلصَّدۡعِ", "86:13": "إِنَّهُۥ لَقَوۡلٞ فَصۡلٞ", "86:14": "وَمَا هُوَ بِٱلۡهَزۡلِ", "86:15": "إِنَّهُمۡ يَكِيدُونَ كَيۡدٗا", "86:17": "فَمَهِّلِ ٱلۡكَٰفِرِينَ أَمۡهِلۡهُمۡ رُوَيۡدَۢا", "87:1": "سَبِّحِ ٱسۡمَ رَبِّكَ ٱلۡأَعۡلَى", "87:2": "ٱلَّذِي خَلَقَ فَسَوَّىٰ", "87:3": "وَٱلَّذِي قَدَّرَ فَهَدَىٰ", "87:4": "وَٱلَّذِيٓ أَخۡرَجَ ٱلۡمَرۡعَىٰ", "87:5": "فَجَعَلَهُۥ غُثَآءً أَحۡوَىٰ", "87:6": "سَنُقۡرِئُكَ فَلَا تَنسَىٰٓ", "87:7": "إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعۡلَمُ ٱلۡجَهۡرَ وَمَا يَخۡفَىٰ", "87:8": "وَنُيَسِّرُكَ لِلۡيُسۡرَىٰ", "87:9": "فَذَكِّرۡ إِن نَّفَعَتِ ٱلذِّكۡرَىٰ", "87:11": "وَيَتَجَنَّبُهَا ٱلۡأَشۡقَى", "87:12": "ٱلَّذِي يَصۡلَى ٱلنَّارَ ٱلۡكُبۡرَىٰ", "87:14": "قَدۡ أَفۡلَحَ مَن تَزَكَّىٰ", "87:16": "بَلۡ تُؤۡثِرُونَ ٱلۡحَيَوٰةَ ٱلدُّنۡيَا", "87:17": "وَٱلۡأٓخِرَةُ خَيۡرٞ وَأَبۡقَىٰٓ", "87:18": "إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلۡأُولَىٰ", "88:1": "هَلۡ أَتَىٰكَ حَدِيثُ ٱلۡغَٰشِيَةِ", "88:2": "وُجُوهٞ يَوۡمَئِذٍ خَٰشِعَةٌ", "88:3": "عَامِلَةٞ نَّاصِبَةٞ", "88:4": "تَصۡلَىٰ نَارًا حَامِيَةٗ", "88:5": "تُسۡقَىٰ مِنۡ عَيۡنٍ ءَانِيَةٖ", "88:6": "لَّيۡسَ لَهُمۡ طَعَامٌ إِلَّا مِن ضَرِيعٖ", "88:7": "لَّا يُسۡمِنُ وَلَا يُغۡنِي مِن جُوعٖ", "88:8": "وُجُوهٞ يَوۡمَئِذٖ نَّاعِمَةٞ", "88:10": "فِي جَنَّةٍ عَالِيَةٖ", "88:11": "لَّا تَسۡمَعُ فِيهَا لَٰغِيَةٗ", "88:13": "فِيهَا سُرُرٞ مَّرۡفُوعَةٞ", "88:14": "وَأَكۡوَابٞ مَّوۡضُوعَةٞ", "88:15": "وَنَمَارِقُ مَصۡفُوفَةٞ", "88:16": "وَزَرَابِيُّ مَبۡثُوثَةٌ", "88:17": "أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ", "88:19": "وَإِلَى ٱلۡجِبَالِ كَيۡفَ نُصِبَتۡ", "88:20": "وَإِلَى ٱلۡأَرۡضِ كَيۡفَ سُطِحَتۡ", "88:21": "فَذَكِّرۡ إِنَّمَآ أَنتَ مُذَكِّرٞ", "88:22": "لَّسۡتَ عَلَيۡهِم بِمُصَيۡطِرٍ", "88:25": "إِنَّ إِلَيۡنَآ إِيَابَهُمۡ", "89:1": "وَٱلۡفَجۡرِ", "89:2": "وَلَيَالٍ عَشۡرٖ", "89:3": "وَٱلشَّفۡعِ وَٱلۡوَتۡرِ", "89:4": "وَٱلَّيۡلِ إِذَا يَسۡرِ", "89:5": "هَلۡ فِي ذَٰلِكَ قَسَمٞ لِّذِي حِجۡرٍ", "89:7": "إِرَمَ ذَاتِ ٱلۡعِمَادِ", "89:9": "وَثَمُودَ ٱلَّذِينَ جَابُواْ ٱلصَّخۡرَ بِٱلۡوَادِ", "89:10": "وَفِرۡعَوۡنَ ذِي ٱلۡأَوۡتَادِ", "89:11": "ٱلَّذِينَ طَغَوۡاْ فِي ٱلۡبِلَٰدِ", "89:13": "فَصَبَّ عَلَيۡهِمۡ رَبُّكَ سَوۡطَ عَذَابٍ", "89:14": "إِنَّ رَبَّكَ لَبِٱلۡمِرۡصَادِ", "89:15": "فَأَمَّا ٱلۡإِنسَٰنُ إِذَا مَا ٱبۡتَلَىٰهُ رَبُّهُۥ فَأَكۡرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّيٓ أَكۡرَمَنِ", "89:16": "وَأَمَّآ إِذَا مَا ٱبۡتَلَىٰهُ فَقَدَرَ عَلَيۡهِ رِزۡقَهُۥ فَيَقُولُ رَبِّيٓ أَهَٰنَنِ", "89:17": "كَلَّاۖ بَل لَّا تُكۡرِمُونَ ٱلۡيَتِيمَ", "89:19": "وَتَأۡكُلُونَ ٱلتُّرَاثَ أَكۡلٗا لَّمّٗا", "89:20": "وَتُحِبُّونَ ٱلۡمَالَ حُبّٗا جَمّٗا", "89:21": "كَلَّآۖ إِذَا دُكَّتِ ٱلۡأَرۡضُ دَكّٗا دَكّٗا", "89:22": "وَجَآءَ رَبُّكَ وَٱلۡمَلَكُ صَفّٗا صَفّٗا", "89:26": "وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٞ", "89:27": "يَـٰٓأَيَّتُهَا ٱلنَّفۡسُ ٱلۡمُطۡمَئِنَّةُ", "89:28": "ٱرۡجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرۡضِيَّةٗ", "90:1": "لَآ أُقۡسِمُ بِهَٰذَا ٱلۡبَلَدِ", "90:2": "وَأَنتَ حِلُّۢ بِهَٰذَا ٱلۡبَلَدِ", "90:4": "لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِي كَبَدٍ", "90:6": "يَقُولُ أَهۡلَكۡتُ مَالٗا لُّبَدًا", "90:8": "أَلَمۡ نَجۡعَل لَّهُۥ عَيۡنَيۡنِ", "90:9": "وَلِسَانٗا وَشَفَتَيۡنِ", "90:10": "وَهَدَيۡنَٰهُ ٱلنَّجۡدَيۡنِ", "90:11": "فَلَا ٱقۡتَحَمَ ٱلۡعَقَبَةَ", "90:13": "فَكُّ رَقَبَةٍ", "90:14": "أَوۡ إِطۡعَٰمٞ فِي يَوۡمٖ ذِي مَسۡغَبَةٖ", "90:15": "يَتِيمٗا ذَا مَقۡرَبَةٍ", "90:16": "أَوۡ مِسۡكِينٗا ذَا مَتۡرَبَةٖ", "90:17": "ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ", "90:18": "أُوْلَـٰٓئِكَ أَصۡحَٰبُ ٱلۡمَيۡمَنَةِ", "90:19": "وَٱلَّذِينَ كَفَرُواْ بِـَٔايَٰتِنَا هُمۡ أَصۡحَٰبُ ٱلۡمَشۡـَٔمَةِ", "91:1": "وَٱلشَّمۡسِ وَضُحَىٰهَا", "91:2": "وَٱلۡقَمَرِ إِذَا تَلَىٰهَا", "91:3": "وَٱلنَّهَارِ إِذَا جَلَّىٰهَا", "91:4": "وَٱلَّيۡلِ إِذَا يَغۡشَىٰهَا", "91:5": "وَٱلسَّمَآءِ وَمَا بَنَىٰهَا", "91:6": "وَٱلۡأَرۡضِ وَمَا طَحَىٰهَا", "91:7": "وَنَفۡسٖ وَمَا سَوَّىٰهَا", "91:8": "فَأَلۡهَمَهَا فُجُورَهَا وَتَقۡوَىٰهَا", "91:9": "قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا", "91:10": "وَقَدۡ خَابَ مَن دَسَّىٰهَا", "91:11": "كَذَّبَتۡ ثَمُودُ بِطَغۡوَىٰهَآ", "91:12": "إِذِ ٱنۢبَعَثَ أَشۡقَىٰهَا", "91:13": "فَقَالَ لَهُمۡ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقۡيَٰهَا",   const w=p.map(x=>1+3*(st.miss[x.id]||0)+(st.ok[x.id]?0:1.5)-(learned(x)?0.6:0));

function answer(i){

  const q=cur,w=q.w,k=w.id,ok=q.opts[i].ok;
  q.opts.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(o.ok)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
  const dk=today();st.days[dk]=st.days[dk]||[0,0];st.days[dk][ok?0:1]++;
  st.pm[q.m]=st.pm[q.m]||[0,0];st.pm[q.m][ok?0:1]++;st.first=st.first||dk;st.last=Date.now();
  if(ok){st.right++;st.streak++;st.best=Math.max(st.best||0,st.streak);st.ok[k]=(st.ok[k]||0)+1;if(st.miss[k]){st.miss[k]--;if(!st.miss[k])delete st.miss[k];}}
  else{st.wrong++;st.streak=0;st.miss[k]=Math.min((st.miss[k]||0)+1,5);}

}

  const ss=[];for(let n=114;n>=78;n--){const a=W.filter(w=>w.s===n),l=a.filter(learned).length;if(a.some(w=>st.ok[w.id]||st.miss[w.id]))ss.push(`<div class="mrow"><span>${SN[n][1]}</span><div class="track"><div class="fill" style="width:${100*l/a.length}%"></div></div><span>${l}/${a.length}</span></div>`);}
  $("#progView").innerHTML=`<div class="kpis"><div class="kpi"><b>${ln}</b><span>öğrenilen / ${W.length}</span></div><div class="kpi"><b>%${p}</b><span>başarı</span></div><div class="kpi"><b>${nd}</b><span>çalışılan gün</span></div></div>
   <div class="note">${t} soru · son çalışma: ${lastSeen()||"henüz yok"} · en uzun seri: ${st.best||0}. Bir kelime, yanlışı kalmadan en az iki kez doğru bilinince “öğrenildi” sayılır.</div>
   <div><h3>Son 7 gün</h3><div class="days">${ds.map(([g,v])=>`<div class="day"><span>${v[0]+v[1]||""}</span><div class="stk${v[0]+v[1]?"":" z"}"><div class="bar w" style="height:${100*v[1]/mx}%;border-radius:4px 4px 0 0"></div><div class="bar" style="height:${100*v[0]/mx}%"></div></div><span>${g}</span></div>`).join("")}</div><div class="note">Mavi doğru, kırmızı yanlış cevap.</div></div>
   <div><h3>Sûrelere göre</h3>${ss.join("")||'<div class="note">Henüz çalışılan sûre yok.</div>'}</div>
   <div><h3>Soru türlerine göre</h3>${ms}</div>
   <div><h3>Kayıtlar</h3><div class="note" style="margin-bottom:8px">Çalışmalarınız bu cihazda saklanır. Cihaz değiştirmeden ya da tarayıcı verilerini silmeden önce yedek alın.</div>
   <div class="btns"><button class="btn" id="bk">Yedek al</button><button class="btn" id="rs">Yedekten yükle</button><button class="btn danger" id="clr">Sıfırla</button></div>
   <input type="file" id="fi" accept="application/json,.json" hidden><div class="note" id="pmsg"></div></div>`;
  $("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:"application/json"}));a.download="kuran-kelime-yedek-"+today()+".json";a.click();$("#pmsg").textContent="Yedek dosyası indirildi.";};
  $("#rs").onclick=()=>$("#fi").click();
  $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{const o=JSON.parse(x);if(typeof o.right!=="number"||!o.ok)throw 0;st=Object.assign(st,o);save();renderProg();$("#pmsg").textContent="Yedek yüklendi.";}).catch(()=>{$("#pmsg").textContent="Bu dosya bir Kur'an Kelimeleri yedeği değil.";});};
  let armed=false;$("#clr").onclick=e=>{if(!armed){armed=true;e.target.textContent="Emin misiniz? Tekrar dokunun";setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent="Sıfırla";},4000);return;}
    st={right:0,wrong:0,streak:0,best:0,miss:{},ok:{},mode:st.mode,range:st.range,days:{},pm:{},first:null,last:null};save();renderProg();};
  renderStats();
}
function setMode(m){
  mode=m;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===m));
  const list=m==="liste",prog=m==="ilerleme";
  $("#listView").hidden=!list;$("#progView").hidden=!prog;$("#quiz").hidden=list||prog;$("#weak").hidden=prog;$("#filterBox").hidden=prog;
  if(list)renderList();else if(prog)renderProg();else renderQuiz();
  if(!prog){st.mode=m;save();}
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.mode);});
$("#range").addEventListener("change",e=>{st.range=e.target.value;save();range=e.target.value.split("-").map(Number);if(mode==="liste"){renderList();renderStats();}else renderQuiz();});
$("#search").addEventListener("input",renderList);
$("#range").value=st.range;if(!$("#range").value){$("#range").value="114-114";range=[114,114];}
setMode(["mix",...MODES,"liste"].includes(mode)?mode:"mix");
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body></html>
