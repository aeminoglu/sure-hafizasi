<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sınıf Sınavı</title><meta name="theme-color" content="#f6f4ee"><meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts.css">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}
/* Layout: tek sütun, telefon ölçüsünde kart; üstte mod sekmeleri, ortada soru, altta seçenekler. Mushaf kâğıdı + lâcivert mürekkep + tezhip altını */
:root{
  --paper:#f6f4ee; --card:#fffdf8; --ink:#1d2a44; --muted:#5e6577; --line:#dcd8cc;
  --lapis:#2747a0; --lapis-soft:#e4e9f7; --gold:#a8781c; --gold-soft:#f5ead3;
  --ok:#1f7a4d; --ok-soft:#dcf0e4; --bad:#b03a2e; --bad-soft:#f7e1de;
  --f-ar:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;
  --f-disp:"Literata",Georgia,serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
h1 span{font-family:var(--f-ar);color:var(--gold);font-weight:700;margin-inline-start:6px}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);
  font:500 .88rem var(--f-ui);padding:6px 10px;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
nav.tabs button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--card)}
.filter{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.filter{flex-wrap:wrap}
.filter select{flex:1 1 200px;min-height:42px;font:500 1rem var(--f-ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line)}
.kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.prompt{font-family:var(--f-disp);font-size:1.18rem;font-weight:500;text-wrap:balance;margin:0}
.big{font-family:var(--f-ar);font-size:clamp(2.4rem,12vw,3.1rem);line-height:1.35;text-align:center;color:var(--lapis);direction:rtl}
.bignum{font-family:var(--f-disp);font-size:clamp(2.6rem,13vw,3.4rem);text-align:center;color:var(--lapis);font-variant-numeric:tabular-nums;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin-top:-8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:76px;min-width:0;border:1.5px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;background:var(--paper);color:var(--ink);border-radius:12px;
  font:500 1rem var(--f-ui);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .ar{font-family:var(--f-ar);font-size:1.5rem;line-height:1.2;direction:rtl}
.opt .tr{font-size:.85rem;color:var(--muted)}
.opt.num{font-family:var(--f-disp);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--lapis)}}
.opt:active:not(:disabled){transform:scale(.98);border-color:var(--lapis)}
.opt:focus-visible,nav.tabs button:focus-visible,.next:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.right .tr{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;background:var(--gold-soft);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.feedback .title{font-weight:600}
.feedback .ar{font-family:var(--f-ar);font-size:1.45rem;line-height:1.3}
.feedback{scroll-margin-bottom:96px}
.feedback .fbhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.next{display:block;width:100%;max-width:520px;margin:0 auto;min-height:56px;border:0;border-radius:14px;background:var(--lapis);color:var(--card);font:600 1.05rem var(--f-ui);padding:14px;cursor:pointer;touch-action:manipulation}
.weak{font-size:.85rem;color:var(--muted)}
.install{align-self:flex-start;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);font:600 .9rem var(--f-ui);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:42px}
.weak b{color:var(--ink);font-weight:600}
/* Liste */
.list{display:flex;flex-direction:column;gap:6px}
.search{font:400 1rem var(--f-ui);min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .no{font-family:var(--f-disp);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center}
.row .mid{min-width:0}
.row .nm{font-weight:600}
.row .mn{font-size:.82rem;color:var(--muted)}
.row .rt{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .rar{font-family:var(--f-ar);font-size:1.3rem;line-height:1.1;color:var(--lapis)}
.pill{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.d{background:var(--gold-soft);color:var(--gold)}
.note{font-size:.78rem;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:14px}
.prog h3{font:600 1rem var(--f-ui);margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.35rem;color:var(--lapis);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:.7rem;color:var(--muted)}
.stk{width:70%;height:70%;display:flex;flex-direction:column;justify-content:flex-end}.stk:empty,.stk.z{border-bottom:2px solid var(--line)}
.bar{width:100%;background:var(--lapis)}
.bar.w{background:var(--bad);border-radius:0}
.mrow{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:.85rem}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .88rem var(--f-ui);padding:10px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s,transform .08s}}
/* Yatay tutuş: başlık küçülür, seçenekler dört sütun */
@media (orientation:landscape) and (max-height:500px){
  body{padding-block:8px 84px}
  .wrap{max-width:760px;gap:10px}
  .card{padding:14px 16px;gap:10px}
  .big{font-size:2.2rem}.bignum{font-size:2.3rem}
  .opts{grid-template-columns:repeat(4,1fr)}.opts.two{grid-template-columns:1fr 1fr}
  .opt{min-height:60px}
  .next{max-width:760px}
}
.ayah{font-family:var(--f-ar);font-size:1.55rem;line-height:2.1;direction:rtl;text-align:center;color:var(--ink);background:var(--paper);border-radius:12px;padding:10px 12px}
.ref{text-align:center;color:var(--muted);font-size:.85rem;margin-top:-8px}
.opt.mean{font-size:.98rem;line-height:1.3}
.opt .arw{font-family:var(--f-ar);font-size:1.7rem;line-height:1.3;direction:rtl}
.feedback .ayah{font-size:1.3rem;background:transparent;padding:4px 0;text-align:right}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wrow .m{font-size:.92rem}.wrow .m small{display:block;color:var(--muted);font-size:.76rem}
.wrow .a{font-family:var(--f-ar);font-size:1.5rem;color:var(--lapis);direction:rtl}
.wrow.ok{border-color:var(--ok)}
.sh{font:600 .95rem var(--f-ui);margin:10px 0 2px;color:var(--gold)}
.applink{font-size:.85rem;color:var(--lapis);text-decoration:none;font-weight:600}
.sent{font-size:1.75rem;line-height:2}
.tg{color:var(--lapis);border-bottom:3px solid var(--gold);padding-bottom:2px}
.wrow.col{grid-template-columns:1fr}
.wrow.col .sent{font-size:1.4rem;background:transparent;padding:0;text-align:right}
.opts.two{grid-template-columns:1fr 1fr}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);margin:0 0 12px;flex:1}
.fl input,.fl select{font:500 1rem var(--f-ui);color:var(--ink)}
.fl select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:46px}
.timer{position:fixed;bottom:16px;right:16px;z-index:20;background:var(--lapis);color:#fff;font:700 1.05rem var(--f-ui);padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.opt.sel{border-color:var(--lapis);background:color-mix(in srgb,var(--lapis) 14%,var(--card));color:var(--lapis);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.dot{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 .85rem var(--f-ui);cursor:pointer}
.dot.done{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.dot.cur{outline:3px solid var(--gold);outline-offset:1px}
.row2{display:flex;gap:10px;margin:10px 0}.row2>*{flex:1}
.btn.wide{width:100%;margin-top:6px}
.btn:disabled{opacity:.45}
.next:disabled{opacity:.6}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--card);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:.75rem;color:var(--muted);font-weight:600}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;animation:bl 1.2s infinite}
.bignum small{color:var(--muted)}
.next{width:100%}

.kpis.k4{grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.kpis.k4 .kpi{padding:8px 4px}.kpis.k4 .kpi b{font-size:1.2rem}
#rh{display:block}

#dersSec .btn.on{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.sent2{font-size:1.45rem;line-height:2.05}
.defn{font-size:1rem;line-height:1.5;background:var(--paper);border-radius:12px;padding:12px 14px;text-align:center}
.opts.col1{grid-template-columns:1fr}
.opt.aropt{font-family:var(--f-ar);font-size:1.2rem;line-height:1.8;text-align:right;justify-content:flex-end;padding:10px 14px;min-height:0}
.opt.aropt span{display:block;width:100%}
.kk{font-size:1.3rem;text-align:right;background:transparent;padding:0}</style></head><body>

 "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "وحَقِّكَ إِنَّ الفَراغَ لَمَفْسَدَةٌ.", "tr": "Yemin ederim ki, işsizlik kötü ve zararlıdır.", "a": "inkârî haber", "s": "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "لَأَنْتَ أَحَقُّ بِالإِكْرامِ.", "tr": "Sen, kesinlikle ikrama en layık olansın.", "a": "talebî haber", "s": "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "ها أَنْتُمْ تُحِبُّونَهُمْ ولا يُحِبُّونَكُمْ.", "tr": "İşte siz onları seversiniz, onlar ise sizi sevmezler.", "a": "talebî haber", "s": "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "تاللهِ كَلّا سَوْفَ تَعْلَمُونَ.", "tr": "Allah'a yemin ederim ki, hayır, ileride bileceksiniz.", "a": "inkârî haber", "s": "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "وأَمّا مَنْ آمَنَ وعَمِلَ صالِحًا فَلَهُ جَزاءً الحُسْنَى.", "tr": "Kim iman eder ve sâlih amel işlerse, ona mükâfat olarak daha güzeli vardır. (Kehf 18/88)", "a": "talebî haber", "s": "29"}, {"k": 3, "g": "haberin çeşidi", "ar": "أَصْحابُ الجَنَّةِ هُمُ الفائِزُونَ.", "tr": "Cennetlikler kurtuluşa erenlerin ta kendileridir. (Haşr 59/20)", "a": "talebî haber", "s": "30"}, {"k": 3, "g": "tekit edatı", "ar": "إِنَّ النَّفْسَ لَأَمّارَةٌ بِالسُّوءِ.", "tr": "Gerçekten nefis aşırı derecede kötülüğü emreder.", "a": "inne ve lâmü'l-ibtidâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "لَأَنْتَ أَحَقُّ بِالإِكْرامِ.", "tr": "Sen, kesinlikle ikrama en layık olansın.", "a": "lâmü'l-ibtidâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "ها أَنْتُمْ تُحِبُّونَهُمْ ولا يُحِبُّونَكُمْ.", "tr": "İşte siz onları seversiniz, onlar ise sizi sevmezler.", "a": "tenbîh harfi (hâ)", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "تاللهِ كَلّا سَوْفَ تَعْلَمُونَ.", "tr": "Allah'a yemin ederim ki, hayır, ileride bileceksiniz.", "a": "kasem (tâ) ve kellâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "وأَمّا مَنْ آمَنَ وعَمِلَ صالِحًا فَلَهُ جَزاءً الحُسْنَى.", "tr": "Kim iman eder ve sâlih amel işlerse, ona daha güzeli vardır.", "a": "şartiyye ve tafsîliyye olan emmâ", "s"  "emir lâmlı muzâri", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "عَلَيْكَ بِالاجْتِهادِ.", "tr": "Çalışmaya sarıl!", "a": "emir bildiren ism-i fiil", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "وبِالوالِدَيْنِ إِحْسانًا", "tr": "Ana babaya iyilik ediniz!", "a": "fiilinin yerini tutan masdar", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "يا خَلِيلَيَّ خَلِّيانِي وما بِي * أَوْ أَعِيدا إِلَيَّ عَهْدَ الشَّبابِ", "tr": "İki dostum! Ya beni kendi hâlime bırakın ya da bana gençlik günlerimi iade edin.", "a": "iltimâs", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "أَزِلْ حَسَدَ الحُسّادِ عَنِّي بِكَبْتِهِمْ * فَأَنْتَ الَّذِي صَيَّرْتَهُمْ لِي حُسَّدا", "tr": "Kıskançları susturarak beni kıskanılmaktan kurtar! Onları kıskanır hâle sen getirdin.", "a": "duâ", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "شاوِرْ سِواكَ إِذا نابَتْكَ نائِبَةٌ * يَوْمًا وإِنْ كُنْتَ مِنْ أَهْلِ المَشُوراتِ", "tr": "Kendisine danışılanlardan olsan da başına bir felaket gelince başkalarına danış!", "a": "irşâd", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "أَلا أَيُّها اللَّيْلُ الطَّوِيلُ أَلا انْجَلِي * بِصُبْحٍ وما الإِصْباحُ مِنْكَ بِأَمْثَلِ", "tr": "Uzun gece! Haydi yeni bir sabahla açıl! Senin getireceğin sabah daha iyi değil.", "a": "temennî", "s": "38"}, {"k": 5, "g": "emrin anlamı", "ar": "أَرُونِي بَخِيلًا طالَ عُمْرًا بِبُخْلِهِ * وهاتُوا كَرِيمًا ماتَ مِنْ كَثْرَةِ البَذْلِ", "tr": "Cimriliğiyle ömrü uzamış birini gösterin bana! Cömertlikten ölmüş birini getirin bana!", "a": "ta'cîz", "s": "38"}, {"k": 5, "g": "emrin anlamı", "ar": "إِذا لَمْ تَخْشَ عاقِبَةَ اللَّيالِي * ولَمْ تَسْتَحْيِ فَافْعَلْ ما تَشاءُ", "tr": "Gecelerin sonundan korkmadığın ve utanmadığın zaman dilediğini yap!", "a": "tehdîd", "s": "38"}, {"k": 6, "g": "nehyin anlamı", "ar": "وَلا تَقْرَبُوا مالَ اليَتِيمِ إِلّا بِالَّتِي هِيَ أَحْسَنُ", "tr": "Yetimin malına ancak en güzel şekilde yaklaşın. (En'âm 6/152)", "a": "hakiki nehiy (yasaklama)", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "رَبَّنا لا تُؤاخِذْنا إِنْ نَسِينا أَوْ أَخْطَأْنا", "tr": "Rabbimiz! Unutursak veya hata yaparsak bizi sorumlu tutma. (Bakara 2/286)", "a": "duâ", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "يا أَخِي لا تَذْهَبْ حَتَّى تَنْتَهِيَ مِنْ أَكْلِ الفُطُورِ", "tr": "Kardeşim! Kahvaltını bitirmeden gitme!", "a": "iltimâs", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تَجْلِسْ إِلَى أَهْلِ الدَّنايا * فَإِنَّ خَلائِقَ السُّفَهاءِ تُعْدِي", "tr": "Seviyesiz insanlarla oturma! Düşük insanların ahlakı bulaşır.", "a": "irşâd", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "يا لَيْلُ طُلْ يا نَوْمُ زُلْ * يا صُبْحُ قِفْ لا تَطْلُعْ", "tr": "Gece! Uza! Uyku! Yok ol! Sabah! Dur! Doğma!", "a": "temennî", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تُطِعْ أَمْرِي.", "tr": "Emrime itaat etme.", "a": "tehdîd", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "دَعِ المَكارِمَ لا تَرْحَلْ لِبُغْيَتِها * واقْعُدْ فَإِنَّكَ أَنْتَ الطّاعِمُ الكاسِي", "tr": "İyilikleri bırak, peşlerine düşme! Otur, sen yiyensin, giyensin.", "a": "tahkîr", "s": "43"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تَنْهَ عَنْ خُلُقٍ وتَأْتِيَ مِثْلَهُ * عارٌ عَلَيْكَ إِذا فَعَلْتَ عَظِيمُ", "tr": "Aynısını yapıp da bir huydan başkasını menetme. Bu senin için büyük ayıptır.", "a": "tevbîh", "s": "43"}, {"k": 7, "g": "istenen şey", "ar": "أَخالِدٌ سافَرَ أَمْ سَعِيدٌ؟", "tr": "Halid mi yoksa Said mi gitti?", "a": "tasavvur", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "أَأَنْتَ فَعَلْتَ هَذا بِآلِهَتِنا يا إِبْراهِيمُ؟", "tr": "İbrahim! Bunu ilahlarımıza sen mi yaptın? (Enbiyâ 21/62)", "a": "tasavvur", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "أَيَصْدَأُ الذَّهَبُ؟", "tr": "Altın paslanır mı?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "هَلْ يَعْقِلُ الحَيَوانُ؟", "tr": "Hayvan düşünür mü?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "هَلْ سَعِيدٌ مُسافِرٌ؟", "tr": "Said gidiyor mu?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "هَلْ جَزاءُ الإِحْسانِ إِلّا الإِحْسانُ", "tr": "İyiliğin karşılığı iyilikten başkası mıdır? (Rahmân 55/60)", "a": "nefy", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "هَلْ يَضُرُّ البَحْرَ أَمْسَى زاخِرًا * أَنْ رَمَى فِيهِ غُلامٌ بِحَجَرْ", "tr": "Dopdolu denize bir çocuğun taş atması zarar verir mi?", "a": "inkâr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَلَسْتَ أَكْثَرَهُمْ جُودًا وأَحْسَنَهُمْ خُلُقًا", "tr": "Sen onların en cömerdi, ahlakı en güzel olanı değil misin?", "a": "takrîr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "مَنْ ذا الَّذِي يَقُومُ بِهَذا المَشْرُوعِ العَظِيمِ غَيْرُكَ؟", "tr": "Bu büyük projeyi senden başka kim yapabilir?", "a": "ta'zîm", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَهَذا الَّذِي أَطْنَبْتَ في مَدْحِهِ؟", "tr": "Uzun uzun medhettiğin kimse bu mu?", "a": "tahkîr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَتَأْمُرُونَ النّاسَ بِالبِرِّ وتَنْسَوْنَ أَنْفُسَكُمْ؟", "tr": "Kendinizi unutup başkalarına iyiliği mi emrediyorsunuz? (Bakara 2/44)", "a": "tevbîh", "s": "46"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَبِنْتَ الدَّهْرِ عِنْدِي كُلُّ بِنْتٍ * فَكَيْفَ وَصَلْتِ أَنْتِ مِنَ الزِّحامِ", "tr": "Ey musibet! Bende her türlü musibet varken sen kalabalıktan nasıl geldin?", "a": "taaccüb", "s": "46"}, {"k": 8, "g": "temennî edatı", "ar": "فَلَيْتَ اللَّيْلَ فِيهِ كانَ شَهْرًا * ومَرَّ نَهارُهُ مَرَّ السَّحابِ", "tr": "Keşke ondaki gece bir ay olsa, gündüzü bulut gibi geçse!", "a": "لَيْتَ (asıl temennî edatı)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "يا لَيْتَ لَنا مِثْلَ ما أُوتِيَ قارُونُ", "tr": "Keşke Kârûn'a verilen mal gibi bizim de olsa. (Kasas 28/79)", "a": "لَيْتَ (asıl temennî edatı)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "فَهَلْ لَنا مِنْ شُفَعاءَ فَيَشْفَعُوا لَنا", "tr": "Şimdi şefaatçilerden hiçbiri var mı ki bize şefaat etsinler? (A'râf 7/53)", "a": "هَلْ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "يا هامانُ ابْنِ لِي صَرْحًا لَعَلِّي أَبْلُغُ الأَسْبابَ أَسْبابَ السَّماواتِ", "tr": "Hâmân! Bana yüksek bir kule yap, belki göklerin yollarına ulaşırım. (Mü'min 40/36-37)", "a": "لَعَلَّ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "وَلَّى الشَّبابُ حَمِيدَةً أَيّامُهُ * لَوْ كانَ ذَلِكَ يُشْتَرَى أَوْ يُرْجِعُ", "tr": "Gençlik geçti gitti. Keşke satın alınabilse veya geri döndürülebilse.", "a": "لَوْ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "لَعَلَّ اللهَ يَأْتِي بِالفَرَجِ.", "tr": "Umulur ki Allah ferahlık getirir.", "a": "لَعَلَّ (teraccî)", "s": "51"}, {"k": 8, "g": "temennî edatı", "ar": "عَسَى الغائِبُ يَعُودُ.", "tr": "Belki kayıp döner.", "a": "عَسَى (teraccî)", "s": "51"}, {"k": 8, "g": "temennî edatı", "ar": "لَيْتَ المُلُوكَ عَلَى الأَقْدارِ مُعْطِيَةٌ * فَلَمْ يَكُنْ لِدَنِيءٍ عِنْدَهُ طَمَعُ", "tr": "Keşke krallar derecelere göre verseler de alçağın onlardan bir arzusu olmasa!", "a": "لَيْتَ (لعل yerine, teraccî)", "s": "51"}, {"k": 9, "g": "nidânın amacı", "ar": "أَيْ عَلِيُّ!", "tr": "Ali! (Ali yakındadır.)", "a": "yakındakine yakın edatıyla hitap", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا خالِدُ!", "tr": "Halit! (Halit uzaktadır.)", "a": "uzaktakine uzak edatıyla hitap", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا غافِلُ!", "tr": "Hey gafil!", "a": "yakındakinin gafil olduğunu ima", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "أَيْ بُنَيَّ!", "tr": "Yavrucuğum! (Muhatap uzaktadır.)", "a": "uzaktakinin gönle yakın olduğunu gösterme", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا رَبِّ إِنْ عَظُمَتْ ذُنُوبِي كَثْرَةً * فَلَقَدْ عَلِمْتُ بِأَنَّ عَفْوَكَ أَعْظَمُ", "tr": "Rabbim! Günahlarım sayıca büyüse de, biliyorum ki senin affın daha büyüktür.", "a": "münadanın yüceliğini ifade", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "أُولَئِكَ آبائِي فَجِئْنِي بِمِثْلِهِمْ * إِذا جَمَعَتْنا يا جَرِيرُ المَجامِعُ", "tr": "İşte bunlar benim atalarım. Toplantılar bizi bir araya // Belâgat soru üretici: aynı kod hem alıştırmada hem sınavda kullanılır
const BEL=(function(){
  const D=BEL_DATA;
  const groupLabels={};D.S.forEach(s=>{(groupLabels[s.g]=groupLabels[s.g]||new Set()).add(s.a);});
  const tok=a=>a.split(/ ve |\(|\)|,/).map(x=>x.trim()).filter(x=>x.length>1);
  const clash=(a,b)=>{const A=tok(a),B=tok(b);return A.some(x=>B.includes(x));};
  const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  // 1) Cümleyi göster, türünü/amacını sor
  function tani(s,r){const pool=[...groupLabels[s.g]].filter(x=>x!==s.a&&!clash(x,s.a));
    return {kind:"tani",prompt:D.P[s.g],ar:s.ar,tr:s.tr,opts:shuf([s.a,...shuf(pool,r).slice(0,3)],r).map(t=>({t,ok:t===s.a})),item:s};}
  // 2) Etiketi göster, hangi cümlede olduğunu sor (sınav kâğıdındaki biçim)
  function hangi(s,r){const others=shuf(D.S.filter(x=>x.g===s.g&&x.a!==s.a&&!clash(x.a,s.a)),r);const used=new Set([s.a]),pick=[];
    for(const o of others){if(pick.length>=3)break;if(!used.has(o.a)){used.add(o.a);pick.push(o);}}
    if(pick.length<1)return null;
    return {kind:"hangi",prompt:D.R[s.g].replace("{}",s.a),opts:shuf([s,...pick],r).map(x=>({t:x.ar,ar:true,ok:x===s,tr:x.tr})),item:s};}
  // 3) Tanımı göster, terimi sor
  function tanim(t,r){const same=D.T.filter(x=>x.t!==t.t&&x.k===t.k),rest=D.T.filter(x=>x.t!==t.t&&x.k!==t.k);
    const opts=[t.t];for(const x of [...shuf(same,r),...shuf(rest,r)]){if(opts.length>=4)break;if(!opts.includes(x.t))opts.push(x.t);}
    return {kind:"tanim",prompt:"Bu tanım hangi terime aittir?",def:t.d,defAr:/[؀-ۿ]/.test(t.d),opts:shuf(opts,r).map(x=>({t:x,ok:x===t.t,ar:/[؀-ۿ]/.test(x)&&!/[a-zçğıöşüâîû]/i.test(x)})),item:t};}
  return {D,tani,hangi,tanim,shuf};
})();

const BK=BEL.D.K;
const konuAdi=k=>k>=100?("Belâgat · "+(k===100?"bütün konular":BK[k-100])):("İ'râb · "+(k?KN[k]:"bütün konular"));
function buildBel(s,r){const k=s.konu-100;const S=BEL.D.S.filter(x=>!k||x.k===k),T=BEL.D.T.filter(x=>!k||x.k===k);
  const cand=[];S.forEach(x=>{cand.push(["tani",x]);cand.push(["hangi",x]);});T.forEach(x=>cand.push(["tanim",x]));
  shuf(cand,r);const used=new Set(),out=[];
  const usedP=new Set();
  for(const [m,x] of cand){if(out.length>=s.n)break;if(used.has(x))continue;const q=m==="tani"?BEL.tani(x,r):m==="hangi"?BEL.hangi(x,r):BEL.tanim(x,r);if(!q)continue;if(m==="hangi"&&usedP.has(q.prompt))continue;usedP.add(q.prompt);used.add(x);out.push(q);}
  for(const [m,x] of cand){if(out.length>=s.n)break;if(out.some(o=>o.item===x&&o.kind===m))continue;const q=m==="tani"?BEL.tani(x,r):m==="hangi"?BEL.hangi(x,r):BEL.tanim(x,r);if(q)out.push(q);}
  return out.map((q,i)=>{const it=q.item;let head="",key="";
    if(q.kind==="tani"){head=`<div class="ayah sent2">${q.ar}</div><div class="ref">${esc(q.tr)}</div>`;key=`<div class="ayah sent2 kk">${it.ar}</div>`;}
    if(q.kind==="tanim"){head=`<div class="${q.defAr?"ayah sent2":"defn"}">${q.defAr?q.def:esc(q.def)}</div>`;key=`<div class="m">${esc(it.d)}</div>`;}
    if(q.kind==="hangi"){key=`<div class="ayah sent2 kk">${it.ar}</div>`;}
    return {id:i,kat:BK[it.k],prompt:esc(q.prompt),head,key,opts:q.opts.map(o=>({t:o.t,ok:o.ok,ar:!!o.ar,ln:q.kind==="hangi"}))};});}

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const CS={R:"merfû",N:"mansûb",C:"mecrûr",Z:"meczûm"};
const VERB=["merfû muzâri","mansûb muzâri","meczûm muzâri"];
const BYCASE={R:["mübtedâ","haber","fâil","nâib-i fâil","kâne ve kardeşlerinin ismi","inne ve kardeşlerinin haberi","sıfat","ma'tûf","bedel","te'kîd"],

// Oturum için soru seti: herkes aynı soruları aynı şıklarla alır, sıra öğrenciye göre karışır
function buildExam(s,studentKey){
  const r=rng(hashStr(s.oturum));
  if(s.konu>=100)return shuf(buildBel(s,r),rng(hashStr(s.oturum+"|"+studentKey)));
  const pool=Q.filter(q=>!s.konu||q.k===s.konu);
  const types=["gorev","alamet","hareke"];
  const cand=[];pool.forEach((q,i)=>types.forEach(t=>cand.push([i,t])));
  shuf(cand,r);
  const used=new Set(),pick=[];
  for(const [i,t] of cand){if(pick.length>=s.n)break;if(used.has(i)&&pick.length<pool.length)continue;used.add(i);pick.push([i,t]);}
  for(const [i,t] of cand){if(pick.length>=s.n)break;if(!pick.some(p=>p[0]===i&&p[1]===t))pick.push([i,t]);}
  const items=pick.map(([i,t],x)=>{const q=pool[i];let opts,prompt,head;
    if(t==="gorev"){prompt="Renkli kelimenin cümledeki görevi nedir?";head=sent(q);
      if(VERB.includes(q.role))opts=shuf([...VERB,"mâzî fiil"],r);
      else{const bad=new Set([q.role,...(EXCL[q.role]||[])]);const same=shuf(BYCASE[q.cs].filter(z=>!bad.has(z)),r).slice(0,2);same.forEach(z=>bad.add(z));
        opts=shuf([q.role,...same,...shuf(ALL.filter(z=>!bad.has(z)),r).slice(0,3-same.length)],r);}
      opts=opts.map(o=>({t:o,ok:o===q.role}));}
    if(t==="alamet"){prompt=`Renkli kelime ${CS[q.cs]}dur. İ'râb alameti nedir?`;head=sent(q);
      opts=shuf([q.al,...(NEAR[q.al]||shuf(SIGNS.filter(z=>z!==q.al),r).slice(0,3))],r).map(o=>({t:o,ok:o===q.al}));}
    if(t==="hareke"){prompt="Boşluğa hangisi gelmelidir?";head=sent(q,true);
      opts=shuf(q.f.slice(),r).map(o=>({t:o,ok:o===q.tg,ar:true}));}
    return {id:x,kat:KN[q.k],prompt,head:head+`<div class="ref">${esc(q.tr)}</div>`,key:`<div class="ayah sent kk">${q.pre+q.tg+q.post}</div>`,opts};});
  return shuf(items,rng(hashStr(s.oturum+"|"+studentKey)));
}

// ---------------- ÖĞRENCİ ----------------
let S=null, exam=null, st=null, tick=null, poll=null;
function studentStart(){
  const me=LS.get("sinav-ogrenci",{ad:"",no:""});
  $("#app").innerHTML=`<section class="card">
    <p class="prompt">Sınava giriş</p>
    <label class="fl">Ad Soyad<input id="ad" class="search" autocomplete="name" value="${esc(me.ad)}"></label>
    <label class="fl">Öğrenci numarası<input id="no" class="search" inputmode="numeric" value="${esc(me.no)}"></label>
    <button class="next" id="gir">Sınava gir</button>
    <div class="note" id="msg"></div></section>
    <div class="note">Sınav öğretmeniniz başlatınca açılır ve süre bitince kendiliğinden kapanır. Süre içinde cevaplarınızı değiştirebilirsiniz.</div>
    <div class="note"><a class="applink" href="#ogretmen">Öğretmen paneli</a></div>`;
  $("#gir").onclick=()=>{const ad=$("#ad").value.trim(),no=$("#no").value.trim();
    if(ad.length<3||!no){$("#msg").textContent="Ad soyad ve numaranızı yazın.";return;}
    LS.set("sinav-ogrenci",{ad,no});waitOpen(ad,no);};
}
async function waitOpen(ad,no){
  $("#app").innerHTML=`<section class="card"><p class="prompt">Hoş geldiniz, ${esc(ad)}.</p><div class="note" id="w">Sınav durumu kontrol ediliyor…</div></section>`;
  clearInterval(poll);
  const check=async()=>{try{S=await get({a:"durum"});}catch(e){$("#w").textContent="Bağlantı kurulamadı, tekrar deneniyor…";return;}
    if(S.acik){
      if(LS.get("sinav-bitti-"+S.oturum,null)){clearInterval(poll);return showDone(LS.get("sinav-bitti-"+S.oturum));}
      clearInterval(poll);beginExam(ad,no);}
    else $("#w").innerHTML=`<span class="pulse"></span> Öğretmeninizin sınavı başlatması bekleniyor. Bu sayfayı kapatmayın.`;};
  await check();poll=setInterval(check,3000);
}
function beginExam(ad,no){
  exam=buildExam(S,no);
  st=LS.get("sinav-durum-"+S.oturum,null)||{ans:{},cur:0,sekme:0,t0:now()};
  st.ad=ad;st.no=no;save();
  document.addEventListener("visibilitychange",onVis);
  $("#timer").hidden=false;
  clearInterval(tick);tick=setInterval(()=>{const left=S.bit-now();$("#timer").textContent="⏱ "+fmt(left);$("#timer").classList.toggle("low",left<60000);if(left<=0)finish(true);},250);
  // öğretmen erken kapatırsa
  clearInterval(poll);poll=setInterval(async()=>{try{const d=await get({a:"durum"});if(d.oturum===S.oturum&&!d.acik){S.bit=Math.min(S.bit,d.bit);if(now()>=S.bit)finish(true);}}catch(e){}},10000);
  renderQ();
}
const save=()=>LS.set("sinav-durum-"+S.oturum,st);
function onVis(){if(document.hidden&&exam){st.sekme++;save();}}
function renderQ(){
  const it=exam[st.cur],a=st.ans[it.id];
  $("#top").innerHTML=`${esc(st.ad)} · soru <b>${st.cur+1}</b>/${exam.length} · cevaplanan <b>${Object.keys(st.ans).length}</b>`;
  $("#app").innerHTML=`<section class="card"><div class="kind">${it.kat}</div><p class="prompt">${it.prompt}</p>${it.head}
    <div class="opts${it.opts.length===2?" two":""}${it.opts[0].ln?" col1":""}">${it.opts.map((o,i)=>`<button class="opt ${o.ln?"aropt":o.ar?"":"mean"}${a===i?" sel":""}" data-i="${i}">${o.ln?`<span dir="rtl">${o.t}</span>`:o.ar?`<span class="arw">${o.t}</span>`:esc(o.t)}</button>`).join("")}</div></section>
    <div class="dots">${exam.map((e,i)=>`<button class="dot${st.ans[e.id]!==undefined?" done":""}${i===st.cur?" cur":""}" data-j="${i}">${i+1}</button>`).join("")}</div>
    <div class="row2"><button class="btn" id="prev"${st.cur?"":" disabled"}>← Önceki</button><button class="btn" id="nxt">${st.cur<exam.length-1?"Sonraki →":"Başa dön"}</button></div>
    <button class="btn danger wide" id="fin">Sınavı bitir ve gönder</button>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ans[it.id]=+b.dataset.i;save();
    const nx=exam.findIndex((e,i)=>i>st.cur&&st.ans[e.id]===undefined);
    setTimeout(()=>{st.cur=nx>=0?nx:Math.min(st.cur+1,exam.length-1);save();renderQ();},180);
    b.classList.add("sel");});
  document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.j;save();renderQ();});
  $("#prev").onclick=()=>{st.cur--;save();renderQ();};
  $("#nxt").onclick=()=>{st.cur=st.cur<exam.length-1?st.cur+1:0;save();renderQ();};
  let armed=false;$("#fin").onclick=e=>{const bos=exam.length-Object.keys(st.ans).length;
    if(!armed){armed=true;e.target.textContent=bos?`${bos} boş soru var. Yine de göndermek için tekrar dokunun`:"Göndermek için tekrar dokunun";setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent="Sınavı bitir ve gönder";},4000);return;}
    finish(false);};
  window.scrollTo({top:0});
}
let finishing=false;
async function finish(auto){
  if(finishing)return;finishing=true;clearInterval(tick);clearInterval(poll);$("#timer").hidden=true;
  document.removeEventListener("visibilitychange",onVis);
  let d=0,y=0,b=0;const cev=[];
  exam.forEach(it=>{const a=st.ans[it.id];if(a===undefined){b++;cev[it.id]="-";}else if(it.opts[a].ok){d++;cev[it.id]="D";}else{y++;cev[it.id]="Y";}});
  const puan=Math.round(100*d/exam.length);
  const res={oturum:S.oturum,ad:st.ad,numara:st.no,puan,dogru:d,yanlis:y,bos:b,sn:Math.round((Math.min(now(),S.bit)-st.t0)/1000),sekme:st.sekme,cevaplar:cev.join("")};
  $("#app").innerHTML=`<section class="card"><p class="prompt">${auto?"Süre doldu.":"Sınav bitti."} Cevaplarınız gönderiliyor…</p></section>`;
  let ok=false;for(let k=0;k<4&&!ok;k++){try{const r=await post(Object.assign({a:"gonder"},res));ok=!!r.ok;}catch(e){await new Promise(z=>setTimeout(z,1500*(k+1)));}}
  const done=Object.assign(res,{gonderildi:ok,detay:exam.map(it=>({s:it.key,soru:it.prompt,dogru:it.opts.find(o=>o.ok).t,ar:!!it.opts[0].ar,ver:st.ans[it.id]===undefined?null:it.opts[st.ans[it.id]].t,ok:st.ans[it.id]!==undefined&&it.opts[st.ans[it.id]].ok}))});
  LS.set("sinav-bitti-"+S.oturum,done);LS.del("sinav-durum-"+S.oturum);
  showDone(done);
}
const fmt1=n=>String(Math.round(10*n)/10).replace(".",",");
function statBox(x,title){return `<h3 class="sh">${title}</h3><div class="kpis k4"><div class="kpi"><b>${x.katilimci}</b><span>katılımcı</span></div><div class="kpi"><b>${fmt1(x.ortalama)}</b><span>ortalama</span></div><div class="kpi"><b>${x.enYuksek}</b><span>en yüksek</span></div><div class="kpi"><b>${x.enDusuk}</b><span>en düşük</span></div></div>`;}
function showDone(r){
  $("#timer").hidden=true;
  $("#top").innerHTML=`${esc(r.ad)} · ${esc(r.numara)}`;
  $("#app").innerHTML=`<section class="card"><div class="kind">Sonucunuz</div>
    <div class="bignum">${r.puan}<small style="font-size:1rem"> puan</small></div>
    <div class="ref">${r.dogru} doğru · ${r.yanlis} yanlış · ${r.bos} boş</div>
    <div class="note" style="text-align:center">${r.gonderildi===false?'<b style="color:var(--bad)">Sonuç gönderilemedi.</b> Bu ekranı öğretmeninize gösterin. <button class="btn" id="tekrar">Tekrar gönder</button>':"Sonucunuz öğretmeninize iletildi."}</div></section>
    <div id="sinif"></div>
    <h3 class="sh">Cevap anahtarı</h3>
    <div class="list" id="key">${!S||S.acik&&S.oturum===r.oturum&&now()<S.bit?'<div class="note">Cevap anahtarı, sınav herkes için kapanınca burada görünecek.</div>':(r.detay||[]).map((x,i)=>`<div class="wrow col${x.ok?" ok":""}">${x.s.startsWith("<")?x.s:`<div class="ayah sent">${x.s}</div>`}<div class="m">${i+1}. ${esc(x.soru)}<small>Doğru: <b ${x.ar?'dir="rtl" class="arw"':""}>${x.dogru}</b>${x.ok?"":" · Sizin cevabınız: "+(x.ver===null?"boş":`<span ${x.ar?'dir="rtl" class="arw"':""}>${x.ver}</span>`)}</small></div></div>`).join("")}</div>`;
  if(S&&S.acik&&S.oturum===r.oturum&&now()<S.bit){clearInterval(poll);poll=setInterval(async()=>{try{const d=await get({a:"durum"});if(d.oturum!==r.oturum||!d.acik){S=d;clearInterval(poll);showDone(r);}}catch(e){}},5000);}
  if(!(S&&S.acik&&S.oturum===r.oturum&&now()<S.bit)){
    $("#sinif").innerHTML='<div class="note">Sınıfın sonuçları hesaplanıyor…</div>';
    const yukle=async(k)=>{try{const x=await get({a:"istatistik",oturum:r.oturum});if(x.bekle||x.katilimci===undefined){if(k<6)setTimeout(()=>yukle(k+1),5000);return;}
      if(!$("#sinif"))return;$("#sinif").innerHTML=x.katilimci?statBox(x,"Sınıfın sonuçları"):"";}catch(e){if(k<6)setTimeout(()=>yukle(k+1),5000);}};
    setTimeout(()=>yukle(0),2500);}
  const t=$("#tekrar");if(t)t.onclick=async()=>{t.disabled=true;try{const q=await post(Object.assign({a:"gonder"},r,{detay:undefined}));if(q.ok){r.gonderildi=true;LS.set("sinav-bitti-"+r.oturum,r);showDone(r);}else t.disabled=false;}catch(e){t.disabled=false;}};
}

// ---------------- ÖĞRETMEN ----------------
let PIN=null, rpoll=null;
function teacher(){
  clearInterval(poll);clearInterval(tick);$("#timer").hidden=true;
  PIN=sessionStorage.getItem("sinav-pin");
  if(!PIN){$("#top").textContent="Öğretmen paneli";
    $("#app").innerHTML=`<section class="card"><p class="prompt">Öğretmen girişi</p><label class="fl">Şifre<input id="pin" type="password" class="search"></label><button class="next" id="pg">Giriş</button><div class="note" id="msg"></div></section>
    <div class="note"><a class="applink" href="#">← Öğrenci ekranı</a></div>`;
    $("#pg").onclick=async()=>{const p=$("#pin").value.trim();try{const r=await get({a:"sonuclar",pin:p});if(r.hata){$("#msg").textContent="Şifre yanlış.";return;}PIN=p;sessionStorage.setItem("sinav-pin",p);panel(r);}catch(e){$("#msg").textContent="Bağlantı kurulamadı.";}};
    return;}
  get({a:"sonuclar",pin:PIN}).then(r=>{if(r.hata){sessionStorage.removeItem("sinav-pin");return teacher();}panel(r);}).catch(()=>{$("#app").innerHTML='<div class="note">Bağlantı kurulamadı.</div>';});
}
function renderAnaliz(r,L){
  const el=$("#analiz");if(!el)return;
  const C=L.filter(x=>x.durum!=="tekrar"&&x.cevaplar);
  if(!r.oturum||!C.length){el.innerHTML="";return;}
  let ex;try{ex=buildExam(r,"analiz").slice().sort((a,b)=>a.id-b.id);}catch(e){el.innerHTML="";return;}
  const rows=ex.map(it=>{let d=0,y=0,bo=0;C.forEach(x=>{const c=String(x.cevaplar)[it.id];if(c==="D")d++;else if(c==="Y")y++;else bo++;});
    return {it,d,y,bo,p:Math.round(100*d/C.length)};}).sort((a,b)=>a.p-b.p);
  const acik=el.dataset.acik==="1";
  el.innerHTML=`<h3 class="sh" style="display:flex;justify-content:space-between;align-items:center">Soru analizi <button class="btn" id="anBtn" style="min-height:36px;padding:6px 12px">${acik?"Gizle":"Göster"}</button></h3>
   ${acik?`<div class="note">En çok yanlış yapılan sorular en üstte. ${C.length} öğrencinin cevabına göre.</div><div class="list">${rows.map(x=>{const ok=x.it.opts.find(o=>o.ok);
     return `<div class="wrow col"><div class="m"><b style="color:${x.p<50?"var(--bad)":x.p<75?"var(--gold)":"var(--ok)"}">%${x.p} doğru</b> · ${x.d} D / ${x.y} Y / ${x.bo} B<small>${x.it.prompt}</small></div>${x.it.key.startsWith("<")&&!ok.ln?x.it.key:""}<div class="m"><small>Doğru cevap: <b ${ok.ar||ok.ln?'dir="rtl" class="arw"':""}>${ok.t}</b></small></div></div>`;}).join("")}</div>`:""}`;
  $("#anBtn").onclick=()=>{el.dataset.acik=acik?"0":"1";renderAnaliz(r,L);};
}
function panel(r){
  const lastKonu=LS.get("sinav-ayar-2",{konu:109,n:20,sure:10});
  $("#top").innerHTML=`Öğretmen paneli · <a class="applink" href="#" id="cik">çıkış</a>`;
  $("#app").innerHTML=`<section class="card" id="ctl"></section><div id="rh" class="sh"></div><div id="res"></div>
    <div id="analiz"></div>
    <div class="row2"><button class="btn" id="csv">Excel'e aktar (CSV)</button><a class="btn" href="#" id="ogr" style="text-align:center;text-decoration:none">Öğrenci ekranı</a></div>`;
  $("#cik").onclick=e=>{e.preventDefault();sessionStorage.removeItem("sinav-pin");clearInterval(rpoll);location.hash="";};
  const ctl=()=>{
    if(r.acik){$("#ctl").innerHTML=`<div class="kind">Sınav açık · oturum ${esc(r.oturum)}</div><p class="prompt">${esc(konuAdi(r.konu))} · ${r.n} soru · ${r.sure} dk</p>
      <div class="bignum" id="kalan">${fmt(r.bit-now())}</div><div class="ref">kalan süre</div><button class="btn danger wide" id="kapat">Sınavı şimdi kapat</button>`;
      let armed=false;$("#kapat").onclick=async e=>{if(!armed){armed=true;e.target.textContent="Kapatmak için tekrar dokunun";return;}e.target.disabled=true;r=Object.assign(r,await post({a:"kapat",pin:PIN}));ctl();};}
    else{$("#ctl").innerHTML=`<div class="kind">Yeni sınav</div>
      <div class="fl">Ders<div class="row2" style="margin:0" id="dersSec"><button class="btn${(lastKonu.konu||0)<100?" on":""}" data-d="0">İ'râb</button><button class="btn${(lastKonu.konu||0)>=100?" on":""}" data-d="100">Belâgat</button></div></div>
      <label class="fl">Konu<select id="konu"></select></label>
      <div class="row2"><label class="fl">Soru sayısı<select id="n">${[10,15,20,25,30].map(x=>`<option${x==lastKonu.n?" selected":""}>${x}</option>`).join("")}</select></label>
      <label class="fl">Süre (dk)<select id="sure">${[3,5,7,10,15,20,30].map(x=>`<option${x==lastKonu.sure?" selected":""}>${x}</option>`).join("")}</select></label></div>
      <button class="next" id="bas">Sınavı başlat</button><div class="note" id="secim" style="text-align:center;font-weight:600"></div><div class="note">Öğrenciler giriş yapıp bekleme ekranında olmalı. Başlatınca hepsinde aynı anda açılır, süre bitince kapanır.</div>`;
      const fillKonu=(d,sel)=>{const opts=d>=100?["Bütün konular",...Object.values(BK)].map((k,i)=>[100+i,`${i?i+". ":""}${k} (${BEL.D.S.filter(x=>!i||x.k===i).length+BEL.D.T.filter(x=>!i||x.k===i).length} soru)`]):["Bütün konular",...Object.values(KN)].map((k,i)=>[i,`${i?i+". ":""}${k} (${Q.filter(q=>!i||q.k===i).length} cümle)`]);
        $("#konu").innerHTML=opts.map(([v,t])=>`<option value="${v}"${v==sel?" selected":""}>${t}</option>`).join("");if(!opts.some(o=>o[0]==sel))$("#konu").value=String(opts[0][0]);showSel();};
      const showSel=()=>{$("#secim").textContent="Seçilen: "+konuAdi(+$("#konu").value)+" · "+$("#n").value+" soru · "+$("#sure").value+" dk";};
      document.querySelectorAll("#dersSec button").forEach(bt=>bt.onclick=()=>{document.querySelectorAll("#dersSec button").forEach(x=>x.classList.toggle("on",x===bt));fillKonu(+bt.dataset.d,-1);});
      fillKonu((lastKonu.konu||0)>=100?100:0,lastKonu.konu||0);["#konu","#n","#sure"].forEach(s=>$(s).onchange=showSel);
      $("#bas").onclick=async e=>{e.target.disabled=true;const a={konu:+$("#konu").value,n:+$("#n").value,sure:+$("#sure").value};LS.set("sinav-ayar-2",a);
        const x=await post(Object.assign({a:"baslat",pin:PIN},a));if(x.hata){alert("Başlatılamadı");e.target.disabled=false;return;}r=Object.assign(x,{sonuclar:[]});ctl();res();};}
  };
  const res=()=>{const L=(r.sonuclar||[]).slice().sort((a,b)=>b.puan-a.puan||a.sn-b.sn);
    const P=L.filter(x=>x.durum!=="tekrar").map(x=>Number(x.puan)||0);
    const ist=P.length?{katilimci:P.length,ortalama:P.reduce((a,b)=>a+b,0)/P.length,enYuksek:Math.max(...P),enDusuk:Math.min(...P)}:null;
    $("#rh").innerHTML=r.oturum?(ist?statBox(ist,`Sonuçlar · ${esc(konuAdi(r.konu))} · oturum ${esc(r.oturum)}${r.acik?" · sınav sürüyor":""}`):`<h3 class="sh">Sonuçlar · oturum ${esc(r.oturum)}</h3>`):`<h3 class="sh">Henüz sınav yapılmadı</h3>`;
    $("#res").innerHTML=L.length?`<table class="tbl"><thead><tr><th>#</th><th>Ad Soyad</th><th>No</th><th>Puan</th><th>D/Y/B</th><th>Süre</th><th>Not</th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.ad)}</td><td>${esc(x.no)}</td><td><b>${x.puan}</b></td><td>${x.dogru}/${x.yanlis}/${x.bos}</td><td>${fmt(x.sn*1000)}</td><td>${x.durum!=="zamanında"?esc(x.durum):""}${x.sekme?` sekme:${x.sekme}`:""}</td></tr>`).join("")}</tbody></table>`:`<div class="note">${r.acik?"Gönderen öğrenci olunca burada görünecek.":""}</div>`;
    renderAnaliz(r,L);
    $("#csv").onclick=()=>{const rows=[...(ist?[["Katılımcı",ist.katilimci,"Ortalama",fmt1(ist.ortalama),"En yüksek",ist.enYuksek,"En düşük",ist.enDusuk],[]]:[]),["Sıra","Ad Soyad","Numara","Puan","Doğru","Yanlış","Boş","Süre (sn)","Sekme değiştirme","Durum"],...L.map((x,i)=>[i+1,x.ad,x.no,x.puan,x.dogru,x.yanlis,x.bos,x.sn,x.sekme,x.durum])];
      const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`irab-sinavi-${r.oturum||"sonuc"}.csv`;a.click();};};
  ctl();res();
  clearInterval(rpoll);rpoll=setInterval(async()=>{
    if(r.acik){const k=$("#kalan");if(k)k.textContent=fmt(r.bit-now());if(r.bit-now()<=0){r.acik=false;ctl();}}
  },500);
  let busy=false;setInterval(async()=>{if(busy||location.hash!=="#ogretmen")return;busy=true;try{const x=await get({a:"sonuclar",pin:PIN});if(!x.hata){const was=r.acik;r=x;if(was!==r.acik)ctl();res();}}catch(e){}busy=false;},5000);
}

function route(){if(location.hash==="#ogretmen")teacher();else{clearInterval(rpoll);studentStart();}}
window.addEventListener("hashchange",()=>location.reload());
if(API.startsWith("__")){$("#app").innerHTML='<div class="note">Sınav bağlantısı henüz kurulmadı.</div>';}else route();
</script>
