<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sınıf Sınavı</title><meta name="theme-color" content="#f6f4ee"><meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts.css">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}
/* Layout: tek sütun, telefon ölçüsünde kart; üstte mod sekmeleri, ortada soru, altta seçenekler. Mushaf kâğıdı + lâcivert mürekkep + tezhip altını */
:root{
  --paper:#f6f4ee; --card:#fffdf8; --ink:#1d2a44; --muted:#5e6577; --line:#dcd8cc;
  --lapis:#2747a0; --lapis-soft:#e4e9f7; --gold:#a8781c; --gold-soft:#f5ead3;
  --ok:#1f7a4d; --ok-soft:#dcf0e4; --bad:#b03a2e; --bad-soft:#f7e1de;
  --f-ar:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;
  --f-disp:"Literata",Georgia,serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --card:#1a2030; --ink:#e8e4d8; --muted:#a3a8b6; --line:#2d3446;
  --lapis:#8fa8ec; --lapis-soft:#25305a; --gold:#d8aa52; --gold-soft:#3a3020;
  --ok:#6fcf9c; --ok-soft:#173a2a; --bad:#ec8a7e; --bad-soft:#41211e; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
h1 span{font-family:var(--f-ar);color:var(--gold);font-weight:700;margin-inline-start:6px}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);
  font:500 .88rem var(--f-ui);padding:6px 10px;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
nav.tabs button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--card)}
.filter{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.filter{flex-wrap:wrap}
.filter select{flex:1 1 200px;min-height:42px;font:500 1rem var(--f-ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line)}
.kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.prompt{font-family:var(--f-disp);font-size:1.18rem;font-weight:500;text-wrap:balance;margin:0}
.big{font-family:var(--f-ar);font-size:clamp(2.4rem,12vw,3.1rem);line-height:1.35;text-align:center;color:var(--lapis);direction:rtl}
.bignum{font-family:var(--f-disp);font-size:clamp(2.6rem,13vw,3.4rem);text-align:center;color:var(--lapis);font-variant-numeric:tabular-nums;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin-top:-8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:76px;min-width:0;border:1.5px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;background:var(--paper);color:var(--ink);border-radius:12px;
  font:500 1rem var(--f-ui);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .ar{font-family:var(--f-ar);font-size:1.5rem;line-height:1.2;direction:rtl}
.opt .tr{font-size:.85rem;color:var(--muted)}
.opt.num{font-family:var(--f-disp);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--lapis)}}
.opt:active:not(:disabled){transform:scale(.98);border-color:var(--lapis)}
.opt:focus-visible,nav.tabs button:focus-visible,.next:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.right .tr{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;background:var(--gold-soft);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.feedback .title{font-weight:600}
.feedback .ar{font-family:var(--f-ar);font-size:1.45rem;line-height:1.3}
.feedback{scroll-margin-bottom:96px}
.feedback .fbhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.next{display:block;width:100%;max-width:520px;margin:0 auto;min-height:56px;border:0;border-radius:14px;background:var(--lapis);color:var(--card);font:600 1.05rem var(--f-ui);padding:14px;cursor:pointer;touch-action:manipulation}
.weak{font-size:.85rem;color:var(--muted)}
.install{align-self:flex-start;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);font:600 .9rem var(--f-ui);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:42px}
.weak b{color:var(--ink);font-weight:600}
/* Liste */
.list{display:flex;flex-direction:column;gap:6px}
.search{font:400 1rem var(--f-ui);min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .no{font-family:var(--f-disp);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center}
.row .mid{min-width:0}
.row .nm{font-weight:600}
.row .mn{font-size:.82rem;color:var(--muted)}
.row .rt{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .rar{font-family:var(--f-ar);font-size:1.3rem;line-height:1.1;color:var(--lapis)}
.pill{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.d{background:var(--gold-soft);color:var(--gold)}
.note{font-size:.78rem;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:14px}
.prog h3{font:600 1rem var(--f-ui);margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.35rem;color:var(--lapis);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:.7rem;color:var(--muted)}
.stk{width:70%;height:70%;display:flex;flex-direction:column;justify-content:flex-end}.stk:empty,.stk.z{border-bottom:2px solid var(--line)}
.bar{width:100%;background:var(--lapis)}
.bar.w{background:var(--bad);border-radius:0}
.mrow{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:.85rem}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .88rem var(--f-ui);padding:10px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s,transform .08s}}
/* Yatay tutuş: başlık küçülür, seçenekler dört sütun */
@media (orientation:landscape) and (max-height:500px){
  body{padding-block:8px 84px}
  .wrap{max-width:760px;gap:10px}
  .card{padding:14px 16px;gap:10px}
  .big{font-size:2.2rem}.bignum{font-size:2.3rem}
  .opts{grid-template-columns:repeat(4,1fr)}.opts.two{grid-template-columns:1fr 1fr}
  .opt{min-height:60px}
  .next{max-width:760px}
}
.ayah{font-family:var(--f-ar);font-size:1.55rem;line-height:2.1;direction:rtl;text-align:center;color:var(--ink);background:var(--paper);border-radius:12px;padding:10px 12px}
.ref{text-align:center;color:var(--muted);font-size:.85rem;margin-top:-8px}
.opt.mean{font-size:.98rem;line-height:1.3}
.opt .arw{font-family:var(--f-ar);font-size:1.7rem;line-height:1.3;direction:rtl}
.feedback .ayah{font-size:1.3rem;background:transparent;padding:4px 0;text-align:right}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wrow .m{font-size:.92rem}.wrow .m small{display:block;color:var(--muted);font-size:.76rem}
.wrow .a{font-family:var(--f-ar);font-size:1.5rem;color:var(--lapis);direction:rtl}
.wrow.ok{border-color:var(--ok)}
.sh{font:600 .95rem var(--f-ui);margin:10px 0 2px;color:var(--gold)}
.applink{font-size:.85rem;color:var(--lapis);text-decoration:none;font-weight:600}
.sent{font-size:1.75rem;line-height:2}
.tg{color:var(--lapis);border-bottom:3px solid var(--gold);padding-bottom:2px}
.wrow.col{grid-template-columns:1fr}
.wrow.col .sent{font-size:1.4rem;background:transparent;padding:0;text-align:right}
.opts.two{grid-template-columns:1fr 1fr}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);margin:0 0 12px;flex:1}
.fl input,.fl select{font:500 1rem var(--f-ui);color:var(--ink)}
.fl select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:46px}
.timer{position:fixed;bottom:16px;right:16px;z-index:20;background:var(--lapis);color:#fff;font:700 1.05rem var(--f-ui);padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.opt.sel{border-color:var(--lapis);background:color-mix(in srgb,var(--lapis) 14%,var(--card));color:var(--lapis);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.dot{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 .85rem var(--f-ui);cursor:pointer}
.dot.done{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.dot.cur{outline:3px solid var(--gold);outline-offset:1px}
.row2{display:flex;gap:10px;margin:10px 0}.row2>*{flex:1}
.btn.wide{width:100%;margin-top:6px}
.btn:disabled{opacity:.45}
.next:disabled{opacity:.6}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--card);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:.75rem;color:var(--muted);font-weight:600}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;animation:bl 1.2s infinite}
.bignum small{color:var(--muted)}
.next{width:100%}

.kpis.k4{grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.kpis.k4 .kpi{padding:8px 4px}.kpis.k4 .kpi b{font-size:1.2rem}
#rh{display:block}

#dersSec .btn.on{background:var(--lapis);color:#fff;border-color:var(--lapis)}

.del{border:0;background:none;color:var(--bad);font:inherit;font-size:.8rem;cursor:pointer;padding:.35rem .3rem;text-decoration:underline}
.del:disabled{opacity:.5}
.sent2{font-size:1.45rem;line-height:2.05}
.defn{font-size:1rem;line-height:1.5;background:var(--paper);border-radius:12px;padding:12px 14px;text-align:center}
.opts.col1{grid-template-columns:1fr}
.opt.aropt{font-family:var(--f-ar);font-size:1.2rem;line-height:1.8;text-align:right;justify-content:flex-end;padding:10px 14px;min-height:0}
.opt.aropt span{display:block;width:100%}

.gate{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}.gate .card{width:100%;max-width:420px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);margin:0 0 12px}.fl input{font:500 1rem var(--f-ui);color:var(--ink)}
select{max-width:100%}.hd{color:var(--gold,#a5730f);border-bottom:2px solid currentColor}.kk{font-size:1.3rem;text-align:right;background:transparent;padding:0}</style></head><body>

</div>

"lâmü'l-ibtidâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "ها أَنْتُمْ تُحِبُّونَهُمْ ولا يُحِبُّونَكُمْ.", "tr": "İşte siz onları seversiniz, onlar ise sizi sevmezler.", "a": "tenbîh harfi (hâ)", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "تاللهِ كَلّا سَوْفَ تَعْلَمُونَ.", "tr": "Allah'a yemin ederim ki, hayır, ileride bileceksiniz.", "a": "kasem (tâ) ve kellâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "وأَمّا مَنْ آمَنَ وعَمِلَ صالِحًا فَلَهُ جَزاءً الحُسْنَى.", "tr": "Kim iman eder ve sâlih amel işlerse, ona daha güzeli vardır.", "a": "şartiyye ve tafsîliyye olan emmâ", "s": "29"}, {"k": 3, "g": "tekit edatı", "ar": "أَصْحابُ الجَنَّةِ هُمُ الفائِزُونَ.", "tr": "Cennetlikler kurtuluşa erenlerin ta kendileridir.", "a": "zamîru'l-fasl", "s": "30"}, {"k": 4, "g": "inşâ türü", "ar": "اِسْمَعِ النَّصِيحَةَ!", "tr": "Öğüdü dinle!", "a": "talebî inşâ – emir", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "لا تُؤَجِّلْ عَمَلَكَ!", "tr": "İşini erteleme!", "a": "talebî inşâ – nehiy", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "أَمُجْتَهِدٌ أَنْتَ؟", "tr": "Sen çalışkan mısın?", "a": "talebî inşâ – istifhâm", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "لَيْتَ الشَّبابَ يَعُودُ!", "tr": "Keşke gençlik geri gelse!", "a": "talebî inşâ – temennî", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "يا غافِلُ انْتَبِهْ!", "tr": "Gafil! Dikkat et!", "a": "talebî inşâ – nidâ", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "ما أَصْدَقَكَ!", "tr": "Ne kadar doğrusun!", "a": "gayr-i talebî inşâ – taaccüb", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "واللهِ لَأَجْتَهِدَنَّ.", "tr": "Vallahi, mutlaka çalışacağım.", "a": "gayr-i talebî inşâ – kasem", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "نِعْمَ الخَلَّةُ الشَّجاعَةُ.", "tr": "Cesaret ne iyi özelliktir.", "a": "gayr-i talebî inşâ – medih", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "بِئْسَ رَجُلًا الجَبانُ.", "tr": "Korkak ne kötü insandır.", "a": "gayr-i talebî inşâ – zem", "s": "33"}, {"k": 4, "g": "inşâ türü", "ar": "لَعَلَّ المَرِيضَ يُشْفَى.", "tr": "Belki hasta iyileşir.", "a": "gayr-i talebî inşâ – recâ", "s": "33"}, {"k": 5, "g": "emrin kalıbı", "ar": "وأَوْفُوا بِعَهْدِ اللهِ إِذا عاهَدْتُمْ", "tr": "Anlaşma yaptığınız zaman Allah'a verdiğiniz sözü yerine getirin! (Nahl 16/91)", "a": "emir fiili", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "خُذِ الكِتابَ بِقُوَّةٍ", "tr": "Kitabı kuvvetle tut! (Meryem 19/12)", "a": "emir fiili", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ", "tr": "Eli geniş olan genişliğine göre nafaka versin! (Talak 65/7)", "a": "emir lâmlı muzâri", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "عَلَيْكَ بِالاجْتِهادِ.", "tr": "Çalışmaya sarıl!", "a": "emir bildiren ism-i fiil", "s": "37"}, {"k": 5, "g": "emrin kalıbı", "ar": "وبِالوالِدَيْنِ إِحْسانًا", "tr": "Ana babaya iyilik ediniz!", "a": "fiilinin yerini tutan masdar", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "يا خَلِيلَيَّ خَلِّيانِي وما بِي * أَوْ أَعِيدا إِلَيَّ عَهْدَ الشَّبابِ", "tr": "İki dostum! Ya beni kendi hâlime bırakın ya da bana gençlik günlerimi iade edin.", "a": "iltimâs", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "أَزِلْ حَسَدَ الحُسّادِ عَنِّي بِكَبْتِهِمْ * فَأَنْتَ الَّذِي صَيَّرْتَهُمْ لِي حُسَّدا", "tr": "Kıskançları susturarak beni kıskanılmaktan kurtar! Onları kıskanır hâle sen getirdin.", "a": "duâ", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "شاوِرْ سِواكَ إِذا نابَتْكَ نائِبَةٌ * يَوْمًا وإِنْ كُنْتَ مِنْ أَهْلِ المَشُوراتِ", "tr": "Kendisine danışılanlardan olsan da başına bir felaket gelince başkalarına danış!", "a": "irşâd", "s": "37"}, {"k": 5, "g": "emrin anlamı", "ar": "أَلا أَيُّها اللَّيْلُ الطَّوِيلُ أَلا انْجَلِي * بِصُبْحٍ وما الإِصْباحُ مِنْكَ بِأَمْثَلِ", "tr": "Uzun gece! Haydi yeni bir sabahla açıl! Senin getireceğin sabah daha iyi değil.", "a": "temennî", "s": "38"}, {"k": 5, "g": "emrin anlamı", "ar": "أَرُونِي بَخِيلًا طالَ عُمْرًا بِبُخْلِهِ * وهاتُوا كَرِيمًا ماتَ مِنْ كَثْرَةِ البَذْلِ", "tr": "Cimriliğiyle ömrü uzamış birini gösterin bana! Cömertlikten ölmüş birini getirin bana!", "a": "ta'cîz", "s": "38"}, {"k": 5, "g": "emrin anlamı", "ar": "إِذا لَمْ تَخْشَ عاقِبَةَ اللَّيالِي * ولَمْ تَسْتَحْيِ فَافْعَلْ ما تَشاءُ", "tr": "Gecelerin sonundan korkmadığın ve utanmadığın zaman dilediğini yap!", "a": "tehdîd", "s": "38"}, {"k": 6, "g": "nehyin anlamı", "ar": "وَلا تَقْرَبُوا مالَ اليَتِيمِ إِلّا بِالَّتِي هِيَ أَحْسَنُ", "tr": "Yetimin malına ancak en güzel şekilde yaklaşın. (En'âm 6/152)", "a": "hakiki nehiy (yasaklama)", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "رَبَّنا لا تُؤاخِذْنا إِنْ نَسِينا أَوْ أَخْطَأْنا", "tr": "Rabbimiz! Unutursak veya hata yaparsak bizi sorumlu tutma. (Bakara 2/286)", "a": "duâ", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "يا أَخِي لا تَذْهَبْ حَتَّى تَنْتَهِيَ مِنْ أَكْلِ الفُطُورِ", "tr": "Kardeşim! Kahvaltını bitirmeden gitme!", "a": "iltimâs", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تَجْلِسْ إِلَى أَهْلِ الدَّنايا * فَإِنَّ خَلائِقَ السُّفَهاءِ تُعْدِي", "tr": "Seviyesiz insanlarla oturma! Düşük insanların ahlakı bulaşır.", "a": "irşâd", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "يا لَيْلُ طُلْ يا نَوْمُ زُلْ * يا صُبْحُ قِفْ لا تَطْلُعْ", "tr": "Gece! Uza! Uyku! Yok ol! Sabah! Dur! Doğma!", "a": "temennî", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تُطِعْ أَمْرِي.", "tr": "Emrime itaat etme.", "a": "tehdîd", "s": "42"}, {"k": 6, "g": "nehyin anlamı", "ar": "دَعِ المَكارِمَ لا تَرْحَلْ لِبُغْيَتِها * واقْعُدْ فَإِنَّكَ أَنْتَ الطّاعِمُ الكاسِي", "tr": "İyilikleri bırak, peşlerine düşme! Otur, sen yiyensin, giyensin.", "a": "tahkîr", "s": "43"}, {"k": 6, "g": "nehyin anlamı", "ar": "لا تَنْهَ عَنْ خُلُقٍ وتَأْتِيَ مِثْلَهُ * عارٌ عَلَيْكَ إِذا فَعَلْتَ عَظِيمُ", "tr": "Aynısını yapıp da bir huydan başkasını menetme. Bu senin için büyük ayıptır.", "a": "tevbîh", "s": "43"}, {"k": 7, "g": "istenen şey", "ar": "أَخالِدٌ سافَرَ أَمْ سَعِيدٌ؟", "tr": "Halid mi yoksa Said mi gitti?", "a": "tasavvur", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "أَأَنْتَ فَعَلْتَ هَذا بِآلِهَتِنا يا إِبْراهِيمُ؟", "tr": "İbrahim! Bunu ilahlarımıza sen mi yaptın? (Enbiyâ 21/62)", "a": "tasavvur", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "أَيَصْدَأُ الذَّهَبُ؟", "tr": "Altın paslanır mı?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "هَلْ يَعْقِلُ الحَيَوانُ؟", "tr": "Hayvan düşünür mü?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istenen şey", "ar": "هَلْ سَعِيدٌ مُسافِرٌ؟", "tr": "Said gidiyor mu?", "a": "tasdîk", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "هَلْ جَزاءُ الإِحْسانِ إِلّا الإِحْسانُ", "tr": "İyiliğin karşılığı iyilikten başkası mıdır? (Rahmân 55/60)", "a": "nefy", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "هَلْ يَضُرُّ البَحْرَ أَمْسَى زاخِرًا * أَنْ رَمَى فِيهِ غُلامٌ بِحَجَرْ", "tr": "Dopdolu denize bir çocuğun taş atması zarar verir mi?", "a": "inkâr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَلَسْتَ أَكْثَرَهُمْ جُودًا وأَحْسَنَهُمْ خُلُقًا", "tr": "Sen onların en cömerdi, ahlakı en güzel olanı değil misin?", "a": "takrîr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "مَنْ ذا الَّذِي يَقُومُ بِهَذا المَشْرُوعِ العَظِيمِ غَيْرُكَ؟", "tr": "Bu büyük projeyi senden başka kim yapabilir?", "a": "ta'zîm", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَهَذا الَّذِي أَطْنَبْتَ في مَدْحِهِ؟", "tr": "Uzun uzun medhettiğin kimse bu mu?", "a": "tahkîr", "s": "45"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَتَأْمُرُونَ النّاسَ بِالبِرِّ وتَنْسَوْنَ أَنْفُسَكُمْ؟", "tr": "Kendinizi unutup başkalarına iyiliği mi emrediyorsunuz? (Bakara 2/44)", "a": "tevbîh", "s": "46"}, {"k": 7, "g": "istifhâmın anlamı", "ar": "أَبِنْتَ الدَّهْرِ عِنْدِي كُلُّ بِنْتٍ * فَكَيْفَ وَصَلْتِ أَنْتِ مِنَ الزِّحامِ", "tr": "Ey musibet! Bende her türlü musibet varken sen kalabalıktan nasıl geldin?", "a": "taaccüb", "s": "46"}, {"k": 8, "g": "temennî edatı", "ar": "فَلَيْتَ اللَّيْلَ فِيهِ كانَ شَهْرًا * ومَرَّ نَهارُهُ مَرَّ السَّحابِ", "tr": "Keşke ondaki gece bir ay olsa, gündüzü bulut gibi geçse!", "a": "لَيْتَ (asıl temennî edatı)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "يا لَيْتَ لَنا مِثْلَ ما أُوتِيَ قارُونُ", "tr": "Keşke Kârûn'a verilen mal gibi bizim de olsa. (Kasas 28/79)", "a": "لَيْتَ (asıl temennî edatı)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "فَهَلْ لَنا مِنْ شُفَعاءَ فَيَشْفَعُوا لَنا", "tr": "Şimdi şefaatçilerden hiçbiri var mı ki bize şefaat etsinler? (A'râf 7/53)", "a": "هَلْ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "يا هامانُ ابْنِ لِي صَرْحًا لَعَلِّي أَبْلُغُ الأَسْبابَ أَسْبابَ السَّماواتِ", "tr": "Hâmân! Bana yüksek bir kule yap, belki göklerin yollarına ulaşırım. (Mü'min 40/36-37)", "a": "لَعَلَّ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "وَلَّى الشَّبابُ حَمِيدَةً أَيّامُهُ * لَوْ كانَ ذَلِكَ يُشْتَرَى أَوْ يُرْجِعُ", "tr": "Gençlik geçti gitti. Keşke satın alınabilse veya geri döndürülebilse.", "a": "لَوْ (ليت yerine)", "s": "50"}, {"k": 8, "g": "temennî edatı", "ar": "لَعَلَّ اللهَ يَأْتِي بِالفَرَجِ.", "tr": "Umulur ki Allah ferahlık getirir.", "a": "لَعَلَّ (teraccî)", "s": "51"}, {"k": 8, "g": "temennî edatı", "ar": "عَسَى الغائِبُ يَعُودُ.", "tr": "Belki kayıp döner.", "a": "عَسَى (teraccî)", "s": "51"}, {"k": 8, "g": "temennî edatı", "ar": "لَيْتَ المُلُوكَ عَلَى الأَقْدارِ مُعْطِيَةٌ * فَلَمْ يَكُنْ لِدَنِيءٍ عِنْدَهُ طَمَعُ", "tr": "Keşke krallar derecelere göre verseler de alçağın onlardan bir arzusu olmasa!", "a": "لَيْتَ (لعل yerine, teraccî)", "s": "51"}, {"k": 9, "g": "nidânın amacı", "ar": "أَيْ عَلِيُّ!", "tr": "Ali! (Ali yakındadır.)", "a": "yakındakine yakın edatıyla hitap", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا خالِدُ!", "tr": "Halit! (Halit uzaktadır.)", "a": "uzaktakine uzak edatıyla hitap", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا غافِلُ!", "tr": "Hey gafil!", "a": "yakındakinin gafil olduğunu ima", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "أَيْ بُنَيَّ!", "tr": "Yavrucuğum! (Muhatap uzaktadır.)", "a": "uzaktakinin gönle yakın olduğunu gösterme", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا رَبِّ إِنْ عَظُمَتْ ذُنُوبِي كَثْرَةً * فَلَقَدْ عَلِمْتُ بِأَنَّ عَفْوَكَ أَعْظَمُ", "tr": "Rabbim! Günahlarım sayıca büyüse de, biliyorum ki senin affın daha büyüktür.", "a": "münadanın yüceliğini ifade", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "أُولَئِكَ آبائِي فَجِئْنِي بِمِثْلِهِمْ * إِذا جَمَعَتْنا يا جَرِيرُ المَجامِعُ", "tr": "İşte bunlar benim atalarım. Toplantılar bizi bir araya getirince onların benzerini getir, Cerir!", "a": "münadanın değersizliğini ima", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "يا أَيُّها السّادِرُ المَزْوَرُّ مِنْ صَلَفٍ * مَهْلًا فَإِنَّكَ بِالأَيّامِ مُنْخَدِعُ", "tr": "Ey gururundan eğlenceye dalan kişi! Yavaş ol, günler geçtikçe aldanırsın.", "a": "münadanın değersizliğini ima", "s": "55"}, {"k": 9, "g": "nidânın amacı", "ar": "إِلامَ يا قَلْبُ وحَتَّى مَتَى * يَكْفِيكَ مِنْ أَمْرِكَ ما قَدْ جَرَى", "tr": "Ey kalp! Nereye kadar ve ne zamana kadar? Başına gelenler sana yetecek.", "a": "zecr ve melâmet (kınama)", "s": "56"}, {"k": 9, "g": "nidânın amacı", "ar": "يا دُرَّةً نُزِعَتْ مِنْ تاجِ والِدِها * فَأَصْبَحَتْ مِنْ تاجِ رِضْوانِ", "tr": "Ey babasının tacından çıkarılıp Rıdvan'ın tacında süs olan inci!", "a": "tahassür ve tevaccu' (hayıflanma)", "s": "56"}, {"k": 9, "g": "nidânın amacı", "ar": "يا شُجاعُ تَقَدَّمْ!", "tr": "Hey yiğit! İlerle!", "a": "iğrâ (teşvik)", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "أَيْ", "tr": "nidâ edatı", "a": "yakındakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "أَ (hemze)", "tr": "nidâ edatı", "a": "yakındakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "يا", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "أَيا", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "آ", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "آيْ", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "هَيا", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın hitap ettiği", "ar": "وا", "tr": "nidâ edatı", "a": "uzaktakine", "s": "56"}, {"k": 9, "g": "edatın kullanımı", "ar": "أَيْ عَلِيُّ!", "tr": "Ali! (Ali yakındadır.)", "a": "asıl kullanım (edat mesafeye uygun)", "s": "56"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا خالِدُ!", "tr": "Halit! (Halit uzaktadır.)", "a": "asıl kullanım (edat mesafeye uygun)", "s": "56"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا غافِلُ!", "tr": "Hey gafil! (Muhatap yakındadır.)", "a": "yakındaki uzak kabul edilmiş", "s": "57"}, {"k": 9, "g": "edatın kullanımı", "ar": "أَيْ بُنَيَّ!", "tr": "Yavrucuğum! (Muhatap uzaktadır.)", "a": "uzaktaki yakın kabul edilmiş", "s": "57"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا رَبِّ إِنْ عَظُمَتْ ذُنُوبِي كَثْرَةً * فَلَقَدْ عَلِمْتُ بِأَنَّ عَفْوَكَ أَعْظَمُ", "tr": "Rabbim! Günahlarım sayıca büyüse de, biliyorum ki senin affın daha büyüktür.", "a": "yakındaki uzak kabul edilmiş", "s": "57"}, {"k": 9, "g": "edatın kullanımı", "ar": "أُولَئِكَ آبائِي فَجِئْنِي بِمِثْلِهِمْ * إِذا جَمَعَتْنا يا جَرِيرُ المَجامِعُ", "tr": "İşte bunlar benim atalarım. Onların benzerini getir, Cerir!", "a": "yakındaki uzak kabul edilmiş", "s": "57"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا أَيُّها السّادِرُ المَزْوَرُّ مِنْ صَلَفٍ * مَهْلًا فَإِنَّكَ بِالأَيّامِ مُنْخَدِعُ", "tr": "Ey gururundan eğlenceye dalan kişi! Yavaş ol, günler geçtikçe aldanırsın.", "a": "yakındaki uzak kabul edilmiş", "s": "57"}, {"k": 9, "g": "edatın kullanımı", "ar": "إِلامَ يا قَلْبُ وحَتَّى مَتَى * يَكْفِيكَ مِنْ أَمْرِكَ ما قَدْ جَرَى", "tr": "Ey kalp! Nereye kadar ve ne zamana kadar?", "a": "nidâ asıl anlamının dışına çıkmış", "s": "58"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا دُرَّةً نُزِعَتْ مِنْ تاجِ والِدِها * فَأَصْبَحَتْ مِنْ تاجِ رِضْوانِ", "tr": "Ey babasının tacından çıkarılıp Rıdvan'ın tacında süs olan inci!", "a": "nidâ asıl anlamının dışına çıkmış", "s": "58"}, {"k": 9, "g": "edatın kullanımı", "ar": "يا شُجاعُ تَقَدَّمْ!", "tr": "Hey yiğit! İlerle!", "a": "nidâ asıl anlamının dışına çıkmış", "s": "58"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "قالَ لي كَيْفَ أَنْتَ قُلْتُ عَلِيلُ * سَهَرٌ دائِمٌ وحُزْنٌ طَوِيلُ", "tr": "(Sevdiğim) bana \"Nasılsın?\" dedi. \"Hastayım\" dedim. Devamlı uykusuzluk ve uzun süren hüzün.", "a": "fasl", "s": "61"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "يا صاحِبَ الدُّنْيا والمُحِبَّ لَها * أَنْتَ الَّذِي لا يَنْقَضِي تَعَبُهْ", "tr": "Ey dünya sahibi ve dünyayı seven kişi! Sen, yorgunluğu bitip tükenmeyen kimsesin.", "a": "fasl", "s": "61"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "وما الدَّهْرُ إِلّا مِنْ رُواةِ قَصائِدِي * إِذا قُلْتُ شِعْرًا أَصْبَحَ الدَّهْرُ مُنْشِدا", "tr": "Felek yalnızca kasidelerimi rivayet edenlerdendir. Ben bir şiir söylesem felek onu okur.", "a": "fasl", "s": "61"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "وحُبُّ العَيْشِ أَعْبَدَ كُلَّ حُرٍّ * وعَلَّمَ ساغِبًا أَكْلَ المُرارِ", "tr": "Yaşama sevgisi bütün hürleri köle etmiş, bolluk içinde yaşayana acı lokma yemeyi öğretmiştir.", "a": "vasl", "s": "61"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "الصِّدْقُ أَمانَةٌ والكَذِبُ خِيانَةٌ.", "tr": "Doğruluk emanetin hakkını vermektir, yalansa ihanettir.", "a": "vasl", "s": "61"}, {"k": 10, "g": "fasl mı, vasl mı", "ar": "بِمَوْتِكَ ماتَتِ اللَّذّاتُ مِنِّي * وكانَتْ حَيَّةً ما دُمْتَ حَيّا", "tr": "Senin ölümünle bütün lezzetler benden uzaklaştı. Sen hayattayken onlar da hayattaydı.", "a": "vasl", "s": "62"}, {"k": 10, "g": "faslın sebebi", "ar": "يَشْرَحُ المُعَلِّمُ الدَّرْسَ، يُوَضِّحُ غامِضَهُ.", "tr": "Hoca dersi anlatıyor, kapalılıklarını açıklıyor.", "a": "kemâl-i ittisâl", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "وما يَنْطِقُ عَنِ الهَوَى، إِنْ هُوَ إِلّا وَحْيٌ يُوحَى", "tr": "O, arzusuna göre konuşmaz. Onun konuşması ancak bildirilen bir vahiydir. (Necm 53/3-4)", "a": "kemâl-i ittisâl", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "عَلِيٌّ يُساعِدُ المُحْتاجِينَ، يُطْعِمُهُمْ إِذا جاعُوا.", "tr": "Ali muhtaçlara yardım eder, acıktıklarında onları doyurur.", "a": "kemâl-i ittisâl", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "لا تَكْذِبْ، إِنَّ الكاذِبَ مُحْتَقَرٌ.", "tr": "Yalan söyleme, çünkü yalancı rezil ve aşağılık biridir.", "a": "kemâl-i inkıta'", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "كَفَى بِالمَوْتِ واعِظًا. فَلاحُ الإِنْسانِ في حِفْظِ لِسانِهِ.", "tr": "Ölüm öğüt verici olarak yeter. İnsanın kurtuluşu dilini korumasındadır.", "a": "kemâl-i inkıta'", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "فَأَوْجَسَ مِنْهُمْ خِيفَةً قالُوا لا تَخَفْ", "tr": "Derken onlardan korkmaya başladı. \"Korkma\" dediler. (Zâriyât 51/28)", "a": "şibh-i kemâl-i ittisâl (isti'nâf)", "s": "65"}, {"k": 10, "g": "faslın sebebi", "ar": "وتَظُنُّ سَلْمَى أَنَّنِي أَبْغِي بِها * بَدَلًا أُراها في الضَّلالِ تَهِيمُ", "tr": "Selma, onun yerine başka bir sevgili istediğimi sanıyor. Bana kalırsa yanlışlık yapıyor.", "a": "şibh-i kemâl-i inkıta' (fasl-ı kat'î)", "s": "65"}, {"k": 10, "g": "ikinci cümlenin görevi", "ar": "يَشْرَحُ المُعَلِّمُ الدَّرْسَ، يُوَضِّحُ غامِضَهُ.", "tr": "Hoca dersi anlatıyor, kapalılıklarını açıklıyor.", "a": "birinci cümlenin tekidi", "s": "66"}, {"k": 10, "g": "ikinci cümlenin görevi", "ar": "وما يَنْطِقُ عَنِ الهَوَى، إِنْ هُوَ إِلّا وَحْيٌ يُوحَى", "tr": "O, arzusuna göre konuşmaz. Onun konuşması ancak bildirilen bir vahiydir.", "a": "birinci cümlenin beyânı (açıklaması)", "s": "66"}, {"k": 10, "g": "ikinci cümlenin görevi", "ar": "عَلِيٌّ يُساعِدُ المُحْتاجِينَ، يُطْعِمُهُمْ إِذا جاعُوا.", "tr": "Ali muhtaçlara yardım eder, acıktıklarında onları doyurur.", "a": "birinci cümleden bedel", "s": "66"}, {"k": 10, "g": "vaslın sebebi", "ar": "نَظَرْتُ إِلَى رَجُلٍ وَجْهُهُ حَسَنٌ وخُلُقُهُ جَمِيلٌ.", "tr": "Hem yüzü hem huyu güzel olan bir adam gördüm.", "a": "i'rab hükmünde ortaklık", "s": "71"}, {"k": 10, "g": "vaslın sebebi", "ar": "الشَّمْسُ مُشْرِقَةٌ والسَّماءُ صافِيَةٌ.", "tr": "Güneş parıldamaktadır ve gökyüzü berraktır.", "a": "iki cümlenin de haberî olup uyumlu olması", "s": "71"}, {"k": 10, "g": "vaslın sebebi", "ar": "اِجْتَهِدْ ولا تَتَكاسَلْ.", "tr": "Çalış, tembellik etme!", "a": "iki cümlenin de inşâî olup uyumlu olması", "s": "71"}, {"k": 10, "g": "vaslın sebebi", "ar": "لا وشَفاهُ اللهُ.", "tr": "(\"Hasta iyileşti mi?\" diye sorana:) Hayır, Allah ona şifa versin!", "a": "fasl kastedilenin zıddı bir anlam verir", "s": "71"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "أُولَئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ وأُولَئِكَ هُمُ المُفْلِحُونَ", "tr": "Onlar Rablerinden bir hidayet üzeredirler ve kurtuluşa erenler ancak onlardır. (Bakara 2/5)", "a": "zikir: zihne iyice yerleştirmek ve açıklamak", "s": "76"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "وما تِلْكَ بِيَمِينِكَ يا مُوسَى؟ قالَ: هِيَ عَصايَ", "tr": "Musa! Sağ elindeki ne? Dedi ki: O benim asamdır. (Tâhâ 20/18)", "a": "zikir: dinlenmek istenen yerde sözü uzatmak", "s": "76"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "قالَ لي كَيْفَ أَنْتَ قُلْتُ عَلِيلُ * سَهَرٌ دائِمٌ وحُزْنٌ طَوِيلُ", "tr": "\"Nasılsın?\" dedi. \"Hastayım\" dedim. (أنا zamiri söylenmemiş)", "a": "hazif: acı ve üzüntüden söz uzatılamaması", "s": "77"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ والَّذِينَ لا يَعْلَمُونَ", "tr": "Hiç bilenlerle bilmeyenler bir olur mu? (Zümer 39/9)", "a": "hazif: müteaddî fiilin lâzım yerine konması", "s": "77"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "قَدْ كانَ مِنْكَ ما يُؤْلِمُ.", "tr": "Acı veren şey senden gelmişti.", "a": "hazif: sözü kısaltarak genelleştirme", "s": "77"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "سُرِقَ المَتاعُ.", "tr": "Mal çalındı.", "a": "hazif: fâilden korkulması veya ona acınması", "s": "78"}, {"k": 11, "g": "zikir mi, hazif mi", "ar": "فَإِذا قُضِيَتِ الصَّلاةُ فَانْتَشِرُوا في الأَرْضِ", "tr": "Namaz kılındığı zaman yeryüzüne dağılın. (Cuma 62/10)", "a": "hazif: fâilin bilinmesi", "s": "78"}, {"k": 12, "g": "takdîmin sebebi", "ar": "والَّذِي حارَتِ البَرِيَّةُ فِيهِ * حَيَوانٌ مُسْتَحْدَثٌ مِنْ جَمادِ", "tr": "İnsanların hakkında hayrete düştüğü şey, cansız varlıktan ortaya konmuş bir canlıdır.", "a": "dinleyiciye haberi merak ettirmek", "s": "83"}, {"k": 12, "g": "takdîmin sebebi", "ar": "الجائِزَةُ فُزْتُ بِها.", "tr": "Ödülü ben kazandım.", "a": "hemen sevindirmek veya üzmek", "s": "83"}, {"k": 12, "g": "takdîmin sebebi", "ar": "القِصاصُ حَكَمَ بِهِ القاضِي.", "tr": "Kısas cezasıyla hükmetti kadı.", "a": "hemen sevindirmek veya üzmek", "s": "83"}, {"k": 12, "g": "takdîmin sebebi", "ar": "ما أَنا فَعَلْتُ هَذا.", "tr": "Bunu ben yapmadım.", "a": "haberin müsnedün ileyhe mahsus olduğunu bildirmek", "s": "84"}, {"k": 12, "g": "takdîmin sebebi", "ar": "أَنا سَعَيْتُ في حاجَتِكَ.", "tr": "Senin işine ben koştum.", "a": "haberin müsnedün ileyhe mahsus olduğunu bildirmek", "s": "84"}, {"k": 12, "g": "takdîmin sebebi", "ar": "أَنْتَ لا تَبْخَلُ.", "tr": "Sen cimrilik yapmazsın.", "a": "hükmü güçlendirmek", "s": "84"}, {"k": 12, "g": "takdîmin sebebi", "ar": "رَجُلٌ فاضِلٌ في الدّارِ.", "tr": "Erdemli bir adam evde.", "a": "saygıyı veya aşağılamayı belirtmek", "s": "84"}, {"k": 12, "g": "takdîmin sebebi", "ar": "رَجُلٌ جاهِلٌ في الدّارِ.", "tr": "Cahil bir adam evde.", "a": "saygıyı veya aşağılamayı belirtmek", "s": "84"}, {"k": 12, "g": "öne alınan unsur", "ar": "للهِ مُلْكُ السَّماواتِ والأَرْضِ", "tr": "Göklerin ve yerin hükümdarlığı yalnız Allah'ındır. (Âl-i İmrân 3/189)", "a": "müsned: müsnedün ileyhin ona mahsus olduğunu bildirmek için", "s": "84"}, {"k": 12, "g": "öne alınan unsur", "ar": "في المَدِينَةِ تاجِرٌ عُرِفَ بِالأَمانَةِ.", "tr": "Şehirde dürüstlüğüyle bilinen bir tacir var.", "a": "müsned: sıfat değil haber olduğuna dikkat çekmek için", "s": "84"}, {"k": 12, "g": "öne alınan unsur", "ar": "إِنَّ في خَلْقِ السَّماواتِ والأَرْضِ واخْتِلافِ اللَّيْلِ والنَّهارِ لَآياتٍ لِأُولِي الأَلْبابِ", "tr": "Göklerin ve yerin yaratılışında, gece ile gündüzün ardarda gelişinde akıl sahipleri için ibretler vardır. (Âl-i İmrân 3/190)", "a": "müsned: müsnedün ileyhi merak ettirmek için", "s": "84"}, {"k": 12, "g": "öne alınan unsur", "ar": "أَنا سَعَيْتُ في حاجَتِكَ.", "tr": "Senin işine ben koştum.", "a": "müsnedün ileyh", "s": "84"}, {"k": 12, "g": "mef'ûl, câr-mecrûr ve hâlin takdîmi", "ar": "إِيّاكَ نَعْبُدُ وإِيّاكَ نَسْتَعِينُ", "tr": "Yalnız sana ibadet ediyoruz ve yalnız senden yardım diliyoruz. (Fâtiha 1/5)", "a": "tahsis kastıyla mef'ûlün öne alınması", "s": "85"}, {"k": 12, "g": "mef'ûl, câr-mecrûr ve hâlin takdîmi", "ar": "خالِدًا زُرْتُ.", "tr": "Halid'i ziyaret ettim.", "a": "belirlemedeki hatayı düzeltmek için mef'ûlün fiilden önce gelmesi", "s": "85"}, {"k": 12, "g": "mef'ûl, câr-mecrûr ve hâlin takdîmi", "ar": "قَتَلَ الذِّئْبَ الصَّيّادُ.", "tr": "Avcı, kurdu öldürdü.", "a": "fiilin kime yapıldığını bildirmek için mef'ûlün fâilden önce gelmesi", "s": "85"}, {"k": 12, "g": "mef'ûl, câr-mecrûr ve hâlin takdîmi", "ar": "وجاءَ مِنْ أَقْصَى المَدِينَةِ رَجُلٌ يَسْعَى", "tr": "Bir adam şehrin öbür ucundan koşarak geldi. (Yâsîn 36/20)", "a": "yanlış anlamı önlemek için câr-mecrûrun öne alınması", "s": "85"}, {"k": 12, "g": "mef'ûl, câr-mecrûr ve hâlin takdîmi", "ar": "مَرَرْتُ راكِبًا بِزَيْدٍ.", "tr": "Binekliyken Zeyd'e rastladım.", "a": "mecrûrun hâli sanılmasın diye hâlin câr-mecrûrdan önce gelmesi", "s": "85"}, {"k": 13, "g": "kasrın yolu", "ar": "لا يَفُوزُ إِلّا المُجِدُّ.", "tr": "Ancak ciddi çalışan kazanır.", "a": "nefy ve istisnâ", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "إِنَّما الحَياةُ تَعَبٌ.", "tr": "Hayat ancak yorgunluktur.", "a": "إِنَّما", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "الأَرْضُ مُتَحَرِّكَةٌ لا ثابِتَةٌ.", "tr": "Yer hareketlidir, sabit değildir.", "a": "لا ile atıf", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "ما الأَرْضُ ثابِتَةً بَلْ مُتَحَرِّكَةٌ.", "tr": "Yer sabit değildir, aksine hareketlidir.", "a": "بَلْ ile atıf", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "ما الأَرْضُ ثابِتَةً لَكِنْ مُتَحَرِّكَةٌ.", "tr": "Yer sabit değildir, fakat hareketlidir.", "a": "لَكِنْ ile atıf", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "عَلَى الرِّجالِ العامِلِينَ نُثْنِي.", "tr": "Sadece çalışan kişileri överiz.", "a": "sonra gelmesi gerekenin öne alınması (takdîm)", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "لا جَوادَ إِلّا مُحَمَّدٌ.", "tr": "Cömert sadece Muhammed'dir.", "a": "nefy ve istisnâ", "s": "89"}, {"k": 13, "g": "kasrın yolu", "ar": "إِنَّما الرّازِقُ اللهُ.", "tr": "Rızık veren yalnız Allah'tır.", "a": "إِنَّما", "s": "89"}, {"k": 13, "g": "kasrın çeşidi (taraflara göre)", "ar": "لا يَفُوزُ إِلّا المُجِدُّ.", "tr": "Ancak ciddi çalışan kazanır.", "a": "sıfatın mevsûfa kasrı", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (taraflara göre)", "ar": "إِنَّما الحَياةُ تَعَبٌ.", "tr": "Hayat ancak yorgunluktur.", "a": "mevsûfun sıfata kasrı", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (taraflara göre)", "ar": "لا جَوادَ إِلّا مُحَمَّدٌ.", "tr": "Cömert sadece Muhammed'dir.", "a": "sıfatın mevsûfa kasrı", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (taraflara göre)", "ar": "إِنَّما حَسَنٌ شاعِرٌ.", "tr": "Hasan sadece şairdir.", "a": "mevsûfun sıfata kasrı", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (gerçeğe göre)", "ar": "لا يَرْوِي مِصْرَ مِنَ الأَنْهارِ إِلّا النِّيلُ.", "tr": "Mısır'ı nehirlerden sadece Nil sular.", "a": "hakîkî kasır", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (gerçeğe göre)", "ar": "إِنَّما الرّازِقُ اللهُ.", "tr": "Rızık veren yalnız Allah'tır.", "a": "hakîkî kasır", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (gerçeğe göre)", "ar": "لا جَوادَ إِلّا مُحَمَّدٌ.", "tr": "Cömert sadece Muhammed'dir.", "a": "izâfî kasır", "s": "91"}, {"k": 13, "g": "kasrın çeşidi (gerçeğe göre)", "ar": "إِنَّما حَسَنٌ شاعِرٌ.", "tr": "Hasan sadece şairdir.", "a": "izâfî kasır", "s": "91"}, {"k": 14, "g": "ifade türü", "ar": "ولا يَحِيقُ المَكْرُ السَّيِّئُ إِلّا بِأَهْلِهِ", "tr": "Kötü tuzak ancak sahibine dolanır. (Fâtır 35/43)", "a": "müsâvât", "s": "95"}, {"k": 14, "g": "ifade türü", "ar": "سَتُبْدِي لَكَ الأَيّامُ ما كُنْتَ جاهِلًا * ويَأْتِيكَ بِالأَخْبارِ مَنْ لَمْ تُزَوِّدِ", "tr": "Günler sana bilmediğin şeyleri gösterecek, azık vermediğin kimseler sana haberler getirecektir.", "a": "müsâvât", "s": "95"}, {"k": 14, "g": "ifade türü", "ar": "ولَكُمْ في القِصاصِ حَياةٌ", "tr": "Kısasta sizin için hayat vardır. (Bakara 2/179)", "a": "îcâz-ı kısar", "s": "95"}, {"k": 14, "g": "ifade türü", "ar": "أَتَى الزَّمانَ بَنُوهُ في شَبِيبَتِهِ * فَسَرَّهُمْ وأَتَيْناهُ عَلَى الهَرَمِ", "tr": "Öncekiler zamanın gençliğinde geldiler, zaman onları sevindirdi. Biz ise yaşlılığında geldik.", "a": "îcâz-ı hazf", "s": "95"}, {"k": 14, "g": "ifade türü", "ar": "وأَعْلَمُ عِلْمَ اليَوْمِ والأَمْسِ قَبْلَهُ * ولَكِنَّنِي عَنْ عِلْمِ ما في غَدٍ عَمِ", "tr": "Bugünün ve ondan önceki dünün bilgisini bilirim, ama yarını bilmekten âcizim.", "a": "haşv", "s": "95"}, {"k": 14, "g": "ifade türü", "ar": "وقَدَّدَتِ الأَدِيمَ لِراهِشَيْهِ * وأَلْفَى قَوْلَها كَذِبًا ومَيْنا", "tr": "(Zebbâ) onun bilek damarlarını kesti. O da onun sözlerini yalan ve asılsız buldu.", "a": "tatvîl", "s": "96"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "أَمَدَّكُمْ بِما تَعْلَمُونَ، أَمَدَّكُمْ بِأَنْعامٍ وبَنِينَ", "tr": "Bildiğiniz şeylerle size yardım etmiştir, size hayvanlar ve oğullarla yardım etti. (Şuarâ 26/132-133)", "a": "îzâh ba'de'l-ibhâm (kapalılıktan sonra açıklama)", "s": "99"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "ولْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الخَيْرِ ويَأْمُرُونَ بِالمَعْرُوفِ", "tr": "İçinizde hayra çağıran, iyiliği emreden bir topluluk bulunsun. (Âl-i İmrân 3/104)", "a": "genelden sonra özeli zikretme", "s": "100"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "رَبِّ اغْفِرْ لي ولِوالِدَيَّ ولِمَنْ دَخَلَ بَيْتِيَ مُؤْمِنًا ولِلْمُؤْمِنِينَ والمُؤْمِناتِ", "tr": "Rabbim! Beni, annemi, babamı, evime mümin olarak gireni, mümin erkekleri ve kadınları bağışla. (Nûh 71/28)", "a": "özelden sonra geneli zikretme", "s": "100"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "وقُلْ جاءَ الحَقُّ وزَهَقَ الباطِلُ إِنَّ الباطِلَ كانَ زَهُوقًا", "tr": "De ki: Hak geldi, bâtıl yok oldu. Şüphesiz bâtıl yok olmaya mahkûmdur. (İsrâ 17/81)", "a": "tezyîl", "s": "100"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "تَزُورُ امْرَأً يُؤْتِي عَلَى الحَمْدِ مالَهُ * ومَنْ يُؤْتِ أَثْمانَ المَحامِدِ يُحْمَدِ", "tr": "Övüldüğü için malını veren birini ziyaret ediyorsun. Övgülerin bedelini veren övülür.", "a": "darb-ı mesel şeklindeki tezyîl", "s": "100"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "لَمْ يُبْقِ جُودُكَ لي شَيْئًا أُؤَمِّلُهُ * تَرَكْتَنِي أَصْحَبُ الدُّنْيا بِلا أَمَلِ", "tr": "Cömertliğin bana ümit edeceğim bir şey bırakmadı. Beni dünyada beklentisiz yaşar hâle getirdin.", "a": "darb-ı mesel şeklinde olmayan tezyîl", "s": "100"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "لَوْ أَنَّ الباخِلِينَ وأَنْتَ مِنْهُمْ * رَأَوْكَ تَعَلَّمُوا مِنْكَ المِطالا", "tr": "Cimriler -ki sen de onlardansın- seni görselerdi oyalamayı senden öğrenirlerdi.", "a": "i'tirâz (ara cümle)", "s": "101"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "فَإِنَّ مَعَ العُسْرِ يُسْرًا إِنَّ مَعَ العُسْرِ يُسْرًا", "tr": "Elbette güçlükle beraber bir kolaylık vardır. Gerçekten güçlükle beraber bir kolaylık vardır. (İnşirâh 94/5-6)", "a": "manayı pekiştirmek için tekrar", "s": "101"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "يا أَبَتِ إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا والشَّمْسَ والقَمَرَ رَأَيْتُهُمْ لي ساجِدِينَ", "tr": "Babacığım! Ben on bir yıldızı, güneşi ve ayı gördüm. Onları bana secde ederken gördüm. (Yûsuf 12/4)", "a": "araya uzun söz girdiği için tekrar", "s": "101"}, {"k": 14, "g": "itnâbın çeşidi", "ar": "فَسَقَى دِيارَكِ غَيْرَ مُفْسِدِها * صَوْبُ الرَّبِيعِ ودِيمَةٌ تَهْمِي", "tr": "Bahar yağmuru ve devamlı yağan yağmur, senin diyarını zarar vermeden sulasın.", "a": "ihtirâs", "s": "101"}, {"k": 15, "g": "teşbîh edatı", "ar": "أَنْتَ كَاللَّيْثِ في الشَّجاعَةِ والإِقْدامِ * والسَّيْفِ في قِراعِ الخُطُوبِ", "tr": "Sen cesaret ve atılganlıkta aslan, sıkıntıları göğüslemede kılıç gibisin.", "a": "كَ", "s": "107"}, {"k": 15, "g": "teşbîh edatı", "ar": "هُوَ مِثْلُ السَّيْفِ مَضاءً.", "tr": "O, keskinlikte kılıç gibidir.", "a": "مِثْل", "s": "107"}, {"k": 15, "g": "teşbîh edatı", "ar": "هُوَ يُحاكِي الماءَ رِقَّةً.", "tr": "O, berraklıkta suya benzer.", "a": "يُحاكِي (fiil)", "s": "107"}, {"k": 15, "g": "teşbîh edatı", "ar": "كَأَنَّ البَحْرَ مِرْآةٌ.", "tr": "Sanki deniz bir aynadır.", "a": "كَأَنَّ", "s": "107"}, {"k": 15, "g": "teşbîh edatı", "ar": "إِذا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَنْثُورًا", "tr": "Onları gördüğünde saçılmış inci sanırsın. (İnsân 76/19)", "a": "حَسِبَ (fiil)", "s": "107"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "هُوَ كَالبَحْرِ كَرَمًا.", "tr": "O, cömertlikte deniz gibidir.", "a": "teşbîh-i mürsel", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "هُوَ بَحْرٌ في الجُودِ.", "tr": "O, cömertlikte bir denizdir.", "a": "teşbîh-i müekked", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "فَكَأَنَّ لَذَّةَ صَوْتِهِ ودَبِيبَها * سِنَةٌ تَمَشَّى في مَفاصِلِ نُعَّسِ", "tr": "Sanki sesinin güzelliği, uyuklayanların mafsallarında yürüyen rehavettir.", "a": "teşbîh-i mücmel", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "زَيْدٌ كَالأَسَدِ في الشَّجاعَةِ.", "tr": "Zeyd, cesarette aslan gibidir.", "a": "teşbîh-i mufassal", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "زَيْدٌ أَسَدٌ.", "tr": "Zeyd bir aslandır.", "a": "teşbîh-i belîğ", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "وَثَبَ وُثُوبَ النَّمِرِ.", "tr": "O, panter gibi sıçradı.", "a": "teşbîh-i belîğ", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "شاهَدْتُ لُجَيْنَ الماءِ.", "tr": "Gümüş (gibi parlak) suyu gördüm.", "a": "teşbîh-i belîğ", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "والبَدْرُ في كَبِدِ السَّماءِ كَدِرْهَمٍ * مُلْقًى عَلَى دِيباجَةٍ زَرْقاءِ", "tr": "Göğün ortasındaki dolunay, mavi ipek kumaşın üstüne konmuş dirhem gibidir.", "a": "teşbîh-i temsîl", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "مَنْ يَهُنْ يَسْهُلِ الهَوانُ عَلَيْهِ * ما لِجُرْحٍ بِمَيِّتٍ إِيلامُ", "tr": "Hakirliğe alışana zillet kolay gelir. Ölüye yara acı vermez.", "a": "teşbîh-i zımnî", "s": "111"}, {"k": 15, "g": "teşbîhin çeşidi", "ar": "وبَدا الصَّباحُ كَأَنَّ غُرَّتَهُ * وَجْهُ الخَلِيفَةِ حِينَ يُمْتَدَحُ", "tr": "Sabah, aydınlığı halifenin övüldüğü andaki yüzü gibi belirdi.", "a": "teşbîh-i maklûb", "s": "111"}, {"k": 15, "g": "teşbîhin gayesi", "ar": "كَأَنَّكَ شَمْسٌ والمُلُوكُ كَواكِبُ * إِذا طَلَعَتْ لَمْ يَبْدُ مِنْهُنَّ كَوْكَبُ", "tr": "Sen güneş gibisin, krallar yıldız. Güneş doğunca yıldızların hiçbiri görünmez.", "a": "müşebbehin hâlini belirtmek", "s": "116"}, {"k": 15, "g": "teşbîhin gayesi", "ar": "دَنَوْتَ تَواضُعًا وعَلَوْتَ مَجْدًا * فَشَأْناكَ انْحِدارٌ وارْتِفاعُ * كَذاكَ الشَّمْسُ تَبْعُدُ أَنْ تُسامَى * ويَدْنُو الضَّوْءُ مِنْها والشُّعاعُ", "tr": "Tevazuundan yaklaştın, şerefçe yükseldin. Güneş de öyledir: kendisi uzaktır, ışığı yakındır.", "a": "müşebbehin mümkün olduğunu belirtmek", "s": "116"}, {"k": 15, "g": "teşbîhin gayesi", "ar": "أَسْوَدُ زِنْجِيٌّ ... كَأَنَّهُ جُزْءٌ لا يَتَجَزَّأُ مِنْ لَيْلٍ، أَوْ نُقْطَةُ مِدادٍ، أَوْ سُوَيْداءُ قَلْبِ فُؤادٍ.", "tr": "(O) simsiyahtır. Sanki gecenin ayrılmaz bir parçası, bir mürekkep noktası veya kalbin kara noktasıdır.", "a": "müşebbehin özelliğinin derecesini belirtmek", "s": "116"}, {"k": 15, "g": "teşbîhin gayesi", "ar": "سَوْداءُ واضِحَةُ الجَبِينِ * كَمُقْلَةِ الظَّبْيِ الغَرِيرِ", "tr": "(O) siyah, parlak alınlıdır. Ürkek ceylanın gözü gibidir.", "a": "müşebbehi güzel göstermek", "s": "116"}, {"k": 15, "g": "teşbîhin gayesi", "ar": "وإِذا أَشارَ مُحَدِّثًا فَكَأَنَّهُ * قِرْدٌ يُقَهْقِهُ أَوْ عَجُوزٌ تَلْطِمُ", "tr": "Konuşurken işaret ettiğinde, sanki kahkaha atan bir maymun ya da yüzünü tokatlayan bir kocakarıdır.", "a": "müşebbehi çirkin göstermek", "s": "116"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "يُخْرِجُ الغَوّاصُ مِنَ البَحْرِ دُرَرًا.", "tr": "Dalgıç denizden inciler çıkarıyor.", "a": "hakikat", "s": "120"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "طَلَعَ البَدْرُ بَيْنَ السَّحابِ.", "tr": "Dolunay bulutların arasından çıktı.", "a": "hakikat", "s": "120"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "مَشَيْتُ عَلَى شاطِئِ البَحْرِ.", "tr": "Deniz kıyısında yürüdüm.", "a": "hakikat", "s": "120"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "رَأَيْتُ بَحْرًا يُعْطِي المُحْتاجِينَ.", "tr": "Muhtaçlara veren bir deniz gördüm.", "a": "mecaz", "s": "120"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "الخَطِيبُ يَتَكَلَّمُ بِالدُّرَرِ.", "tr": "Hatip incilerle konuşuyor.", "a": "mecaz", "s": "120"}, {"k": 16, "g": "hakikat mi, mecaz mı", "ar": "طَلَعَ البَدْرُ مَعَ صَدِيقاتِها مِنَ البَيْتِ.", "tr": "Dolunay, arkadaşlarıyla birlikte evden çıktı.", "a": "mecaz", "s": "120"}, {"k": 17, "g": "istiârenin çeşidi (taraflara göre)", "ar": "يُؤَدُّونَ التَّحِيَّةَ مِنْ بَعِيدٍ * إِلَى قَمَرٍ مِنَ الإِيوانِ بادِ", "tr": "Onlar eyvandan görünen aya uzaktan selam veriyorlar.", "a": "tasrîhî istiâre", "s": "125"}, {"k": 17, "g": "istiârenin çeşidi (taraflara göre)", "ar": "وإِذا السَّعادَةُ لاحَظَتْكَ عُيُونُها * نَمْ فَالمَخاوِفُ كُلُّهُنَّ أَمانُ", "tr": "Mutluluğun gözleri seni gözettiğinde uyu! O zaman bütün korkular güvenliktir.", "a": "meknî istiâre", "s": "125"}, {"k": 17, "g": "istiârenin çeşidi (taraflara göre)", "ar": "رَأَيْتُ بَحْرًا يَخْطُبُ.", "tr": "Konuşan bir deniz gördüm.", "a": "tasrîhî istiâre", "s": "124"}, {"k": 17, "g": "istiârenin çeşidi (lafza göre)", "ar": "رَأَيْتُ الأَسَدَ شاكِيَ السِّلاحِ.", "tr": "Silah kuşanmış aslanı gördüm.", "a": "aslî istiâre", "s": "125"}, {"k": 17, "g": "istiârenin çeşidi (lafza göre)", "ar": "يَقْتُلُ الكَسْلانُ الوَقْتَ.", "tr": "Tembel vakti öldürür.", "a": "tebeî istiâre", "s": "125"}, {"k": 17, "g": "istiârenin çeşidi (mülâime göre)", "ar": "رَأَيْتُ بَحْرًا خِضَمًّا عَلَى فَرَسٍ.", "tr": "At üzerinde engin bir deniz gördüm.", "a": "müraşşah istiâre", "s": "126"}, {"k": 17, "g": "istiârenin çeşidi (mülâime göre)", "ar": "رَأَيْتُ بَحْرًا عَلَى فَرَسٍ يُعْطِي.", "tr": "At üzerinde bağış yapan bir deniz gördüm.", "a": "mücerred istiâre", "s": "126"}, {"k": 17, "g": "istiârenin çeşidi (mülâime göre)", "ar": "رَأَيْتُ بَحْرًا عَلَى فَرَسٍ.", "tr": "At üzerinde bir deniz gördüm.", "a": "mutlak istiâre", "s": "126"}, {"k": 17, "g": "tek kelimede mi, terkipte mi", "ar": "إِنَّكَ لا تَجْنِي مِنَ الشَّوْكِ العِنَبَ.", "tr": "Dikenden üzüm devşiremezsin.", "a": "temsîlî istiâre (terkipte)", "s": "126"}, {"k": 17, "g": "tek kelimede mi, terkipte mi", "ar": "رَأَيْتُ الأَسَدَ شاكِيَ السِّلاحِ.", "tr": "Silah kuşanmış aslanı gördüm.", "a": "tek kelimede istiâre", "s": "125"}, {"k": 17, "g": "tek kelimede mi, terkipte mi", "ar": "يَقْتُلُ الكَسْلانُ الوَقْتَ.", "tr": "Tembel vakti öldürür.", "a": "tek kelimede istiâre", "s": "125"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "عَظُمَتْ يَدُ عَلِيٍّ عِنْدِي.", "tr": "Ali'nin bana uzattığı el (nimet) büyüktür.", "a": "sebebiyyet", "s": "131"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "أَمْطَرَتِ السَّماءُ نَباتًا.", "tr": "Gök bitki yağdırdı.", "a": "müsebbebiyyet", "s": "131"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "أُرْسِلَتِ العُيُونُ لِتَطَّلِعَ عَلَى أَحْوالِ العَدُوِّ.", "tr": "Düşmanın durumunu öğrenmeleri için gözler gönderildi.", "a": "cüz'iyyet", "s": "131"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "يَجْعَلُونَ أَصابِعَهُمْ في آذانِهِمْ", "tr": "Onlar parmaklarını kulaklarına tıkarlar. (Bakara 2/19)", "a": "külliyyet", "s": "132"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "وآتُوا اليَتامَى أَمْوالَهُمْ", "tr": "Yetimlere mallarını verin. (Nisâ 4/2)", "a": "kevniyyet (eski hâliyle anma)", "s": "132"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "إِنِّي أَرانِي أَعْصِرُ خَمْرًا", "tr": "Rüyamda kendimi şarap sıkarken gördüm. (Yûsuf 12/36)", "a": "evveliyyet (gelecekteki hâliyle anma)", "s": "132"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "قَرَّرَ المَجْلِسُ ذَلِكَ.", "tr": "Meclis buna karar verdi.", "a": "mahalliyyet", "s": "132"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "نَزَلْتُ بِالقَوْمِ فَأَكْرَمُونِي.", "tr": "Kavme konuk oldum, bana ikram ettiler.", "a": "hâlliyyet", "s": "132"}, {"k": 18, "g": "mürsel mecazın alâkası", "ar": "وما أَرْسَلْنا مِنْ رَسُولٍ إِلّا بِلِسانِ قَوْمِهِ", "tr": "Her peygamberi yalnızca kavminin diliyle gönderdik. (İbrâhîm 14/4)", "a": "âliyyet", "s": "132"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "طَبَعَ المُؤَلِّفُ الكِتابَ.", "tr": "Yazar kitabı bastı.", "a": "fiilin sebebine isnad", "s": "136"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "شَقَّ مُحافِظُ المَدِينَةِ الطُّرُقَ.", "tr": "Yolları şehrin valisi açtı.", "a": "fiilin sebebine isnad", "s": "135"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "نَهارُ الزّاهِدِ صائِمٌ.", "tr": "Zâhidin gündüzü oruçludur.", "a": "fiilin zamanına isnad", "s": "136"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "اِزْدَحَمَ الشّارِعُ.", "tr": "Cadde kalabalıklaştı.", "a": "fiilin mekânına isnad", "s": "136"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "جَدَّ جِدُّهُ.", "tr": "O sıkı çalıştı (çalışması çalıştı).", "a": "fiilin masdarına isnad", "s": "136"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "عِيشَةٌ راضِيَةٌ", "tr": "Hoşnut (olunan) bir hayat", "a": "ism-i mef'ûl yerine ism-i fâil kullanılması", "s": "136"}, {"k": 19, "g": "aklî mecazda isnad", "ar": "سَيْلٌ مُفْعَمٌ", "tr": "Taşkın bir sel", "a": "ism-i fâil yerine ism-i mef'ûl kullanılması", "s": "136"}, {"k": 20, "g": "kinayenin çeşidi", "ar": "خالِدٌ طَوِيلُ النِّجادِ.", "tr": "Halid'in kılıç bağı uzundur. (Boyu uzundur.)", "a": "sıfattan kinaye", "s": "138"}, {"k": 20, "g": "kinayenin çeşidi", "ar": "عَلِيٌّ كَثِيرُ الرَّمادِ.", "tr": "Ali'nin külü çoktur. (Cömerttir.)", "a": "sıfattan kinaye", "s": "139"}, {"k": 20, "g": "kinayenin çeşidi", "ar": "قَتَلَ الصَّيّادُ مَلِكَ الوُحُوشِ.", "tr": "Avcı, vahşi hayvanların kralını öldürdü.", "a": "mevsûftan kinaye", "s": "139"}, {"k": 20, "g": "kinayenin çeşidi", "ar": "المَجْدُ بَيْنَ ثَوْبَيْهِ، والكَرَمُ مِلْءُ بُرْدَيْهِ.", "tr": "Şeref onun iki elbisesinin arasındadır, cömertlik de hırkasını doldurur.", "a": "nisbetten kinaye", "s": "139"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "ويَوْمَ تَقُومُ السّاعَةُ يُقْسِمُ المُجْرِمُونَ ما لَبِثُوا غَيْرَ ساعَةٍ", "tr": "Kıyametin kopacağı gün suçlular, bir andan fazla kalmadıklarına yemin ederler. (Rûm 30/55)", "a": "tam cinâs", "s": "143"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "وسَمَّيْتُهُ يَحْيَى لِيَحْيا فَلَمْ يَكُنْ * إِلَى رَدِّ أَمْرِ اللهِ فِيهِ سَبِيلُ", "tr": "Yaşasın diye ona Yahyâ adını verdim, ama Allah'ın onun hakkındaki emrini geri çevirmenin yolu yoktu.", "a": "tam cinâs", "s": "143"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "فَأَمَّا اليَتِيمَ فَلا تَقْهَرْ، وأَمَّا السّائِلَ فَلا تَنْهَرْ", "tr": "Öyleyse sakın yetimi ezme, sakın isteyeni azarlama. (Duhâ 93/9-10)", "a": "nâkıs cinâs", "s": "143"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "هَلّا نَهاكَ نُهاكَ عَنْ لَوْمِ امْرِئٍ * لَمْ يُلْفَ غَيْرَ مُنَعَّمٍ بِشَقاءِ", "tr": "Aklın seni, mutsuzluktan başka nimeti olmayan birini kınamaktan alıkoysaydı ya!", "a": "nâkıs cinâs", "s": "144"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "إِنَّ البُكاءَ هُوَ الشِّفاءُ * مِنَ الجَوَى بَيْنَ الجَوانِحِ", "tr": "Göğüsteki yanıklığın şifası ancak ağlamaktır.", "a": "nâkıs cinâs", "s": "144"}, {"k": 21, "g": "cinâsın çeşidi", "ar": "إِنِّي خَشِيتُ أَنْ تَقُولَ فَرَّقْتَ بَيْنَ بَنِي إِسْرائِيلَ ولَمْ تَرْقُبْ قَوْلِي", "tr": "Senin \"İsrâiloğulları arasına ayrılık soktun, sözümü tutmadın\" demenden korktum. (Tâhâ 20/94)", "a": "nâkıs cinâs", "s": "144"}, {"k": 21, "g": "nâkıs cinâsta farklılık", "ar": "فَأَمَّا اليَتِيمَ فَلا تَقْهَرْ، وأَمَّا السّائِلَ فَلا تَنْهَرْ", "tr": "(تَقْهَرْ ile تَنْهَرْ arasında)", "a": "harflerin çeşidi", "s": "145"}, {"k": 21, "g": "nâkıs cinâsta farklılık", "ar": "هَلّا نَهاكَ نُهاكَ عَنْ لَوْمِ امْرِئٍ", "tr": "(نَهاكَ ile نُهاكَ arasında)", "a": "harflerin harekesi", "s": "145"}, {"k": 21, "g": "nâkıs cinâsta farklılık", "ar": "مِنَ الجَوَى بَيْنَ الجَوانِحِ", "tr": "(الجَوَى ile الجَوانِحِ arasında)", "a": "harflerin sayısı", "s": "146"}, {"k": 21, "g": "nâkıs cinâsta farklılık", "ar": "فَرَّقْتَ بَيْنَ بَنِي إِسْرائِيلَ", "tr": "(بَيْنَ ile بَنِي arasında)", "a": "harflerin sıralanışı", "s": "146"}, {"k": 22, "g": "bedî' sanatı", "ar": "ويَوْمَ تَقُومُ السّاعَةُ يُقْسِمُ المُجْرِمُونَ ما لَبِثُوا غَيْرَ ساعَةٍ", "tr": "Kıyametin kopacağı gün suçlular, bir andan fazla kalmadıklarına yemin ederler.", "a": "cinâs", "s": "143"}, {"k": 22, "g": "bedî' sanatı", "ar": "الإِنْسانُ بِآدابِهِ، لا بِزِيِّهِ وثِيابِهِ.", "tr": "İnsan, terbiye ve edebiyle insandır, kıyafet ve elbisesiyle değil.", "a": "secî'", "s": "148"}, {"k": 22, "g": "bedî' sanatı", "ar": "أَيُّها النّاسُ اسْمَعُوا وعُوا، وإِذا وَعَيْتُمْ شَيْئًا فَانْتَفِعُوا.", "tr": "Ey insanlar! Dinleyin ve belleyin. Bir şey bellediğinizde ondan yararlanın.", "a": "secî'", "s": "148"}, {"k": 22, "g": "bedî' sanatı", "ar": "لا تَغُرَّنَّكَ مِنَ الظَّلَمَةِ كَثْرَةُ الجُيُوشِ والأَنْصارِ، إِنَّما نُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ الأَبْصارُ.", "tr": "Zalimlerin ordularının çokluğu seni aldatmasın. \"Biz onları ancak gözlerin dehşetle bakakalacağı bir güne erteliyoruz.\"", "a": "iktibâs", "s": "150"}, {"k": 22, "g": "bedî' sanatı", "ar": "رَحَلُوا فَلَسْتُ مُسائِلًا عَنْ دارِهِمْ * أَنا باخِعٌ نَفْسِي عَلَى آثارِهِمْ", "tr": "Onlar göçtüler. Yurtlarını soracak değilim. Arkalarından üzüntüyle kendimi tüketeceğim.", "a": "iktibâs", "s": "150"}, {"k": 22, "g": "bedî' sanatı", "ar": "وإِذا ما شِئْتَ عَيْشًا بَيْنَهُمْ * خالِقِ النّاسَ بِخُلُقٍ حَسَنِ", "tr": "Aralarında yaşamak istersen \"insanlara güzel ahlakla davran\".", "a": "iktibâs", "s": "150"}, {"k": 22, "g": "bedî' sanatı", "ar": "ورُبَّ الشِّعْرِ عِنْدَهُمُ بَغِيضٌ * ولَوْ وافَى بِهِ لَهُمُ حَبِيبُ", "tr": "Nice şiir onların yanında sevimsizdir, onu kendilerine \"Habîb\" getirse bile.", "a": "tevriye", "s": "153"}, {"k": 22, "g": "bedî' sanatı", "ar": "ومِنَ العَجائِبِ لَفْظُها * حُرٌّ ومَعْناها رَقِيقُ", "tr": "Sözlerinin hür, manasının \"rakîk\" olması şaşılacak şeydir.", "a": "tevriye", "s": "153"}, {"k": 22, "g": "bedî' sanatı", "ar": "وتَحْسَبُهُمْ أَيْقاظًا وهُمْ رُقُودٌ", "tr": "Uykuda oldukları hâlde sen onları uyanık sanırdın. (Kehf 18/18)", "a": "tıbâk", "s": "156"}, {"k": 22, "g": "bedî' sanatı", "ar": "وأَنَّهُ هُوَ أَضْحَكَ وأَبْكَى وأَنَّهُ هُوَ أَماتَ وأَحْيا", "tr": "Güldüren de ağlatan da O'dur. Öldüren de dirilten de O'dur. (Necm 53/43-44)", "a": "tıbâk", "s": "156"}, {"k": 22, "g": "bedî' sanatı", "ar": "إِنَّكُمْ لَتَكْثُرُونَ عِنْدَ الفَزَعِ، وتَقِلُّونَ عِنْدَ الطَّمَعِ.", "tr": "Siz, savaşta korku anında çoğalıyor, ganimet isteme anında azalıyorsunuz.", "a": "mukâbele", "s": "159"}, {"k": 22, "g": "bedî' sanatı", "ar": "لَيْسَ لَهُ صَدِيقٌ في السِّرِّ، ولا عَدُوٌّ في العَلانِيَةِ.", "tr": "Onun ne gizli bir dostu ne de görünürde bir düşmanı vardır.", "a": "mukâbele", "s": "159"}, {"k": 22, "g": "bedî' sanatı", "ar": "مَنْ أَقْعَدَتْهُ نِكايَةُ اللِّئامِ، أَقامَتْهُ إِعانَةُ الكِرامِ.", "tr": "Alçakların verdiği zarar kimi oturtursa, şerefli insanların yardımı onu ayağa kaldırır.", "a": "mukâbele", "s": "159"}, {"k": 22, "g": "bedî' sanatı", "ar": "ما حَمِدْتُ نَفْسِي عَلَى مَحْبُوبٍ ابْتَدَأْتُهُ بِعَجْزٍ، ولا لُمْتُها عَلَى مَكْرُوهٍ ابْتَدَأْتُهُ بِحَزْمٍ.", "tr": "Acziyetle başladığım iyi bir şeyden dolayı kendimi övmedim, kararlılıkla başladığım kötü bir şeyden dolayı da kendimi kınamadım.", "a": "mukâbele", "s": "159"}, {"k": 22, "g": "bedî' sanatı", "ar": "وما كُلْفَةُ البَدْرِ المُنِيرِ قَدِيمَةً * ولَكِنَّها في وَجْهِهِ أَثَرُ اللَّطْمِ", "tr": "Ayın yüzündeki leke eski değildir. O, yüzüne inen bir tokadın izidir.", "a": "hüsn-i ta'lîl", "s": "162"}, {"k": 22, "g": "bedî' sanatı", "ar": "ما قَصَّرَ الغَيْثُ عَنْ مِصْرَ وتُرْبَتِها * طَبْعًا ولَكِنْ تَعَدّاكُمْ مِنَ الخَجَلِ", "tr": "Yağmur Mısır'ı kendiliğinden ihmal etmedi, (cömertliğinizden) utandığı için sizi atlayıp geçti.", "a": "hüsn-i ta'lîl", "s": "162"}, {"k": 22, "g": "bedî' sanatı", "ar": "ولا عَيْبَ فِيهِمْ غَيْرَ أَنَّ سُيُوفَهُمْ * بِهِنَّ فُلُولٌ مِنْ قِراعِ الكَتائِبِ", "tr": "Onlarda hiçbir kusur yoktur. Ancak kılıçlarında düşmanla vuruşmaktan çentikler vardır.", "a": "te'kîdü'l-medh bimâ yüşbihü'z-zemm", "s": "164"}, {"k": 22, "g": "bedî' sanatı", "ar": "فَتًى كَمُلَتْ أَخْلاقُهُ غَيْرَ أَنَّهُ * جَوادٌ فَما يُبْقِي مِنَ المالِ باقِيا", "tr": "O, ahlakı tam bir gençtir. Ancak çok cömerttir, maldan geriye bir şey bırakmaz.", "a": "te'kîdü'l-medh bimâ yüşbihü'z-zemm", "s": "164"}, {"k": 22, "g": "bedî' sanatı", "ar": "ولا خَيْرَ فِيهِمْ غَيْرَ أَنَّ عَظِيمَهُمْ * إِذا ما دَعا الدّاعِي إِلَيْهِ يَغِيبُ", "tr": "Onlarda hiçbir hayır yoktur. Ancak büyükleri, biri kendisini çağırdığında ortadan kaybolur.", "a": "te'kîdü'z-zemm bimâ yüşbihü'l-medh", "s": "166"}, {"k": 22, "g": "bedî' sanatı", "ar": "هُمْ يَرْكُضُونَ القَهْقَرَى غَيْرَ أَنَّهُمْ * يَزِيدُونَ طُولَ الخَطْوِ وَقْتَ الشَّدائِدِ", "tr": "Onlar gerisin geriye kaçarlar. Ancak zor zamanlarda adımlarını daha da uzatırlar.", "a": "te'kîdü'z-zemm bimâ yüşbihü'l-medh", "s": "166"}, {"k": 22, "g": "bedî' sanatı", "ar": "يَسْأَلُونَكَ عَنِ الأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنّاسِ والحَجِّ", "tr": "Sana hilalleri sorarlar. De ki: Onlar insanlar ve hac için vakit ölçüleridir. (Bakara 2/189)", "a": "üslûb-i hakîm", "s": "168"}, {"k": 22, "g": "bedî' sanatı", "ar": "قِيلَ لِتاجِرٍ: كَمْ رَأْسُ مالِكَ؟ فَقالَ: إِنِّي رَجُلٌ أَمِينٌ وثِقَةُ النّاسِ بِي عَظِيمَةٌ.", "tr": "Bir tacire \"Sermayen ne kadar?\" denildi. \"Ben güvenilir biriyim, insanların bana güveni büyüktür\" dedi.", "a": "üslûb-i hakîm", "s": "168"}, {"k": 22, "g": "bedî' sanatı", "ar": "سُئِلَ أَحَدُ العُمّالِ: ما ادَّخَرْتَ مِنَ المالِ؟ فَقالَ: لا شَيْءَ يُعادِلُ الصِّحَّةَ.", "tr": "Bir memura \"Ne kadar para biriktirdin?\" diye soruldu. \"Hiçbir şey sağlığa denk değildir\" dedi.", "a": "üslûb-i hakîm", "s": "168"}, {"k": 22, "g": "bedî' sanatı", "ar": "سُئِلَ غَرِيبٌ عَنْ دِينِهِ واعْتِقادِهِ، فَقالَ: أُحِبُّ لِلنّاسِ ما أُحِبُّ لِنَفْسِي.", "tr": "Bir yabancıya dini ve inancı soruldu. \"Kendim için sevdiğimi insanlar için de severim\" dedi.", "a": "üslûb-i hakîm", "s": "168"}, {"k": 23, "g": "iktibasın kaynağı", "ar": "لا تَغُرَّنَّكَ مِنَ الظَّلَمَةِ كَثْرَةُ الجُيُوشِ والأَنْصارِ، إِنَّما نُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ الأَبْصارُ.", "tr": "Zalimlerin ordularının çokluğu seni aldatmasın. \"Biz onları ancak gözlerin bakakalacağı bir güne erteliyoruz.\"", "a": "âyetten: değiştirilmeden", "s": "151"}, {"k": 23, "g": "iktibasın kaynağı", "ar": "رَحَلُوا فَلَسْتُ مُسائِلًا عَنْ دارِهِمْ * أَنا باخِعٌ نَفْسِي عَلَى آثارِهِمْ", "tr": "Onlar göçtüler. Arkalarından üzüntüyle kendimi tüketeceğim.", "a": "âyetten: biraz değiştirilerek", "s": "151"}, {"k": 23, "g": "iktibasın kaynağı", "ar": "وإِذا ما شِئْتَ عَيْشًا بَيْنَهُمْ * خالِقِ النّاسَ بِخُلُقٍ حَسَنِ", "tr": "Aralarında yaşamak istersen \"insanlara güzel ahlakla davran\".", "a": "hadisten", "s": "150"}, {"k": 23, "g": "tevriyeli kelimenin kastedilen (uzak) anlamı", "ar": "ورُبَّ الشِّعْرِ عِنْدَهُمُ بَغِيضٌ * ولَوْ وافَى بِهِ لَهُمُ حَبِيبُ", "tr": "(حَبِيب kelimesinde)", "a": "şair Habîb b. Evs", "s": "154"}, {"k": 23, "g": "tevriyeli kelimenin kastedilen (uzak) anlamı", "ar": "ومِنَ العَجائِبِ لَفْظُها * حُرٌّ ومَعْناها رَقِيقُ", "tr": "(رَقِيق kelimesinde)", "a": "ince ve kolay", "s": "154"}, {"k": 23, "g": "tevriyeli kelimenin kastedilen (uzak) anlamı", "ar": "كانَ يَحُوكُ الشِّمالَ بِاليَمِينِ.", "tr": "(الشِّمال kelimesinde)", "a": "şemle'nin çoğulu: örtüler, ihramlar", "s": "154"}, {"k": 23, "g": "tıbâkın çeşidi", "ar": "وتَحْسَبُهُمْ أَيْقاظًا وهُمْ رُقُودٌ", "tr": "Uykuda oldukları hâlde sen onları uyanık sanırdın. (Kehf 18/18)", "a": "îcâbî tıbâk", "s": "156"}, {"k": 23, "g": "tıbâkın çeşidi", "ar": "فَأُولَئِكَ يُبَدِّلُ اللهُ سَيِّئاتِهِمْ حَسَناتٍ", "tr": "Allah onların kötülüklerini iyiliklere çevirir. (Furkân 25/70)", "a": "îcâbî tıbâk", "s": "156"}, {"k": 23, "g": "tıbâkın çeşidi", "ar": "لَها ما كَسَبَتْ وعَلَيْها ما اكْتَسَبَتْ", "tr": "Herkesin kazandığı hayır kendine, yaptığı şer de kendinedir. (Bakara 2/286)", "a": "îcâbî tıbâk", "s": "156"}, {"k": 23, "g": "tıbâkın çeşidi", "ar": "يُرِيدُ اللهُ بِكُمُ اليُسْرَ ولا يُرِيدُ بِكُمُ العُسْرَ", "tr": "(يُرِيدُ ile لا يُرِيدُ arasında) Allah sizin için kolaylık ister, zorluk istemez. (Bakara 2/185)", "a": "selbî tıbâk", "s": "157"}, {"k": 23, "g": "tıbâkın çeşidi", "ar": "ثُمَّ لا يَمُوتُ فِيها ولا يَحْيا", "tr": "Sonra o, ateşte ne ölür ne de yaşar. (A'lâ 87/13)", "a": "îcâbî tıbâk", "s": "157"}, {"k": 23, "g": "karşıtlığın kurulduğu kelimeler", "ar": "وتَحْسَبُهُمْ أَيْقاظًا وهُمْ رُقُودٌ", "tr": "Uykuda oldukları hâlde sen onları uyanık sanırdın.", "a": "iki isim", "s": "157"}, {"k": 23, "g": "karşıtlığın kurulduğu kelimeler", "ar": "لَها ما كَسَبَتْ وعَلَيْها ما اكْتَسَبَتْ", "tr": "Kazandığı hayır lehine, yaptığı şer aleyhinedir.", "a": "iki harf (harf-i cer)", "s": "157"}, {"k": 23, "g": "karşıtlığın kurulduğu kelimeler", "ar": "وأَنَّهُ هُوَ أَضْحَكَ وأَبْكَى", "tr": "Güldüren de ağlatan da O'dur.", "a": "iki fiil", "s": "157"}, {"k": 24, "g": "te'kîdin çeşidi", "ar": "ولا عَيْبَ فِيهِمْ غَيْرَ أَنَّ سُيُوفَهُمْ * بِهِنَّ فُلُولٌ مِنْ قِراعِ الكَتائِبِ", "tr": "Onlarda hiçbir kusur yoktur. Ancak kılıçlarında düşmanla vuruşmaktan çentikler vardır.", "a": "olumsuzlanan yergi sıfatından bir övgü sıfatının istisna edilmesi", "s": "164"}, {"k": 24, "g": "te'kîdin çeşidi", "ar": "فَتًى كَمُلَتْ أَخْلاقُهُ غَيْرَ أَنَّهُ * جَوادٌ فَما يُبْقِي مِنَ المالِ باقِيا", "tr": "O, ahlakı tam bir gençtir. Ancak çok cömerttir, maldan geriye bir şey bırakmaz.", "a": "övgü sıfatından sonra istisna edatıyla başka bir övgü sıfatı getirilmesi", "s": "164"}, {"k": 24, "g": "te'kîdin çeşidi", "ar": "ولا خَيْرَ فِيهِمْ غَيْرَ أَنَّ عَظِيمَهُمْ * إِذا ما دَعا الدّاعِي إِلَيْهِ يَغِيبُ", "tr": "Onlarda hiçbir hayır yoktur. Ancak büyükleri, çağrıldığında ortadan kaybolur.", "a": "olumsuzlanan övgü sıfatından bir yergi sıfatının istisna edilmesi", "s": "166"}, {"k": 24, "g": "te'kîdin çeşidi", "ar": "هُمْ يَرْكُضُونَ القَهْقَرَى غَيْرَ أَنَّهُمْ * يَزِيدُونَ طُولَ الخَطْوِ وَقْتَ الشَّدائِدِ", "tr": "Onlar gerisin geriye kaçarlar. Ancak zor zamanlarda adımlarını daha da uzatırlar.", "a": "yergi sıfatından sonra istisna edatıyla başka bir yergi sıfatı getirilmesi", "s": "166"}], "T": [{"k": 1, "d": "مُطابَقَةُ الكَلامِ لِمُقْتَضَى الحالِ مَعَ فَصاحَتِهِ", "t": "belâgat (kelâmda)", "s": "vize"}, {"k": 1, "d": "سَلامَتُها مِنْ تَنافُرِ الحُرُوفِ ومُخالَفَةِ القِياسِ والغَرابَةِ", "t": "kelimenin fesâhatı", "s": "vize"}, {"k": 1, "d": "İçeriğinde doğru ve yalan olma ihtimali bulunan ve sahibine \"doğru söylüyor\" veya \"yalan söylüyor\" denilebilen söz", "t": "haberî cümle", "s": "24"}, {"k": 1, "d": "Manasında doğru veya yalan olma ihtimali bulunmayan ve sahibine \"doğru/yalan söylüyor\" denilemeyen söz", "t": "inşâî cümle", "s": "24"}, {"k": 2, "d": "Cümlenin içerdiği hükmü, onu bilmeyen muhataba bildirmek", "t": "fâidetü'l-haber", "s": "27"}, {"k": 2, "d": "Hükmü bilen muhataba, konuşanın da onu bildiğini bildirmek", "t": "lâzimü'l-fâide", "s": "27"}, {"k": 3, "d": "Muhatabın zihni boştur; haber tekit edatı olmadan verilir", "t": "ibtidâî haber", "s": "31"}, {"k": 3, "d": "Muhatap hükmü kabulde tereddüt eder; haber bir tekit edatıyla verilir", "t": "talebî haber", "s": "31"}, {"k": 3, "d": "Muhatap hükmü inkâr eder; haber inkârın derecesine göre iki veya daha fazla tekit edatıyla verilir", "t": "inkârî haber", "s": "32"}, {"k": 4, "d": "Söylendiği anda bulunmayan bir şeyin yapılmasını isteme anlamı taşıyan inşâ (emir, nehiy, istifhâm, temennî, nidâ)", "t": "talebî inşâ", "s": "36"}, {"k": 4, "d": "Bir şeyin talep edilmediği inşâ (taaccüb, kasem, medih, zem, recâ)", "t": "gayr-i talebî inşâ", "s": "36"}, {"k": 5, "d": "Söylendiği anda henüz yapılmamış bir şeyin, üstün konumdakinin bağlayıcı biçimde yapılmasını istemesi", "t": "emir", "s": "39"}, {"k": 5, "d": "Birbirine denk iki arkadaştan birinin diğerinden emir yapısıyla istemesi", "t": "iltimâs", "s": "39"}, {"k": 5, "d": "Alt mertebedekinin üst mertebedekinden emir kipiyle istemesi", "t": "duâ", "s": "39"}, {"k": 5, "d": "Akılsız varlıklara emir ile hitap edilmesi", "t": "temennî", "s": "41"}, {"k": 5, "d": "Muhatabın aczini göstermek için onun yapamayacağı bir işi istemek", "t": "ta'cîz", "s": "41"}, {"k": 5, "d": "Hoşnut olmama durumunda korkutmak için muhataptan emredileni yapmasını istemek", "t": "tehdîd", "s": "41"}, {"k": 6, "d": "Hükmederek ve zorlayarak bir şeyin yapılmamasını istemek; tek sîgası lâ-i nâhiyeli muzâridir", "t": "nehiy", "s": "44"}, {"k": 7, "d": "Daha önce bilinmeyen bir şey hakkında bilgi sahibi olmak istemek", "t": "istifhâm", "s": "47"}, {"k": 7, "d": "Yalnızca tasdik istemek için gelen, alternatif (muâdil) zikredilemeyen soru edatı", "t": "هَلْ", "s": "47"}, {"k": 7, "d": "Hem tasavvur hem tasdik için kullanılan soru edatı", "t": "hemze (أ)", "s": "47"}, {"k": 8, "d": "Arzu edilen fakat imkânsız ya da gerçekleşmesi uzak olduğu için ümit edilmeyen bir şeyi istemek", "t": "temennî", "s": "53"}, {"k": 8, "d": "Meydana gelmesi umulan sevimli bir şeyi istemek", "t": "teracci", "s": "53"}, {"k": 9, "d": "Muhatabı, nidâ harfiyle (أدعو yerine) adını veya sıfatını anarak kendine yöneltmek", "t": "nidâ", "s": "59"}, {"k": 9, "d": "Yakındakine hitap için kullanılan nidâ edatları", "t": "hemze ve أَيْ", "s": "59"}, {"k": 9, "d": "Nidâ cümlesinde müsnedün ileyh (özne) olan unsur", "t": "أدعو fiilinin gizli zamiri", "s": "56"}, {"k": 9, "d": "Nidâ cümlesinde müsned olan unsur", "t": "أدعو anlamını içeren nidâ harfi", "s": "56"}, {"k": 9, "d": "Uzaktakine hitap için kullanılan nidâ edatları", "t": "يا، أيا، آ، آيْ، هيا، وا", "s": "59"}, {"k": 9, "d": "Uzaktakinin yakın kabul edilip hemze veya أَيْ ile çağrılmasının amacı", "t": "gönle yakın ve gözden ırak olmadığını ifade etmek", "s": "59"}, {"k": 9, "d": "Yakındakinin uzak kabul edilip uzak edatıyla çağrılma sebepleri", "t": "yücelik, değersizlik veya gaflet", "s": "59"}, {"k": 9, "d": "Nidânın karînelerle asıl anlamından çıkarak ifade ettiği anlamlar", "t": "zecr, tahassür ve iğrâ", "s": "59"}, {"k": 10, "d": "Bir cümleyi başka bir cümleye atıf harfiyle bağlamadan peş peşe söylemek", "t": "fasl", "s": "64"}, {"k": 10, "d": "Bir cümleyi kendinden önceki cümleye vav harfiyle atfetmek", "t": "vasl", "s": "64"}, {"k": 10, "d": "İkinci cümlenin birincinin tekidi, beyânı veya bedeli olması sebebiyle iki cümle arasında bulunan tam bağlantı", "t": "kemâl-i ittisâl", "s": "70"}, {"k": 10, "d": "Cümlelerden biri haberî diğeri inşâî olduğu ya da aralarında hiçbir ilişki bulunmadığı için ortaya çıkan tam ayrılık", "t": "kemâl-i inkıta'", "s": "70"}, {"k": 10, "d": "İkinci cümlenin, birinciden anlaşılan bir sorunun cevabı olması (isti'nâf)", "t": "şibh-i kemâl-i ittisâl", "s": "70"}, {"k": 10, "d": "Atıf yapılırsa mana bozulacağı için atfın terk edilmesi (fasl-ı kat'î)", "t": "şibh-i kemâl-i inkıta'", "s": "70"}, {"k": 11, "d": "Konuşmada asıl olan: manayı gösteren her lafzın söylenmesi, karîneyle bilinen ve onsuz da anlaşılan lafzın ise atılması", "t": "zikir ve hazif", "s": "78"}, {"k": 11, "d": "Mef'ûl kastedilmediğinde geçişli fiilin geçişsiz gibi kullanılmasıyla yapılan hazif", "t": "müteaddînin lâzım yerine konması", "s": "78"}, {"k": 12, "d": "Müsnedün ileyhin öne alınma sebepleri", "t": "haberi merak ettirmek, sevindirmek veya üzmek, tahsis, hükmü güçlendirmek, ta'zîm veya tahkîr", "s": "86"}, {"k": 12, "d": "Müsnedin öne alınma sebepleri", "t": "müsnedün ileyhi müsnede tahsis, müsnedin sıfat değil haber olduğunu bildirmek, müsnedün ileyhi merak ettirmek", "s": "86"}, {"k": 13, "d": "Bir şey function mkBEL(D){
  const groupLabels={};D.S.forEach(s=>{(groupLabels[s.g]=groupLabels[s.g]||new Set()).add(s.a);});
  const tok=a=>a.split(/ ve |\(|\)|,/).map(x=>x.trim()).filter(x=>x.length>1);
  const clash=(a,b)=>{const A=tok(a),B=tok(b);return A.some(x=>B.includes(x));};
  const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  // 1) Cümleyi göster, türünü/amacını sor
  function tani(s,r){const pool=[...groupLabels[s.g]].filter(x=>x!==s.a&&!clash(x,s.a));
    return {kind:"tani",prompt:D.P[s.g],ar:s.ar,tr:s.tr,opts:shuf([s.a,...shuf(pool,r).slice(0,3)],r).map(t=>({t,ok:t===s.a,ar:/[؀-ۿ]/.test(t)&&!/[a-zçğıöşüâîû]/i.test(t)})),item:s};}
  // 2) Etiketi göster, hangi cümlede olduğunu sor (sınav kâğıdındaki biçim)
  function hangi(s,r){const others=shuf(D.S.filter(x=>x.g===s.g&&x.a!==s.a&&!clash(x.a,s.a)),r);const used=new Set([s.a]),pick=[];
    for(const o of others){if(pick.length>=3)break;if(!used.has(o.a)){used.add(o.a);pick.push(o);}}
    if(pick.length<1)return null;
    return {kind:"hangi",prompt:D.R[s.g].replace("{}",s.a),opts:shuf([s,...pick],r).map(x=>({t:x.ar,ar:true,ok:x===s,tr:x.tr})),item:s};}
  // 3) Tanımı göster, terimi sor
  function tanim(t,r){const same=D.T.filter(x=>x.t!==t.t&&x.k===t.k),rest=D.T.filter(x=>x.t!==t.t&&x.k!==t.k);
    const cat=t.c?shuf(D.T.filter(x=>x.t!==t.t&&x.c===t.c),r):[];
    const opts=[t.t];for(const x of [...cat,...shuf(same,r),...shuf(rest,r)]){if(opts.length>=4)break;if(!opts.includes(x.t))opts.push(x.t);}
    return {kind:"tanim",prompt:"Bu tanım hangi terime aittir?",def:t.d,defAr:/[؀-ۿ]/.test(t.d),opts:shuf(opts,r).map(x=>({t:x,ok:x===t.t,ar:/[؀-ۿ]/.test(x)&&!/[a-zçğıöşüâîû]/i.test(x)})),item:t};}
  return {D,tani,hangi,tanim,shuf};
}

es sâlimin i'râbı", "ar": "نَعْتَمِدُ عَلَى <b class=\"hd\">الأُمَّهاتِ</b>", "tr": "Annelere güveniriz.", "a": "kesra ile mecrûr", "s": "212"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "يَلْعَبُ الغِلْمانُ <b class=\"hd\">بِالكُراتِ</b>", "tr": "Çocuklar toplarla oynuyor.", "a": "kesra ile mecrûr", "s": "212"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "أَيْنَعَتِ <b class=\"hd\">الثَّمَراتُ</b>", "tr": "Meyveler olgunlaştı.", "a": "zamme ile merfû", "s": "212"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "نَحْتَرِمُ النِّساءَ <b class=\"hd\">الفُضْلَياتِ</b>", "tr": "Faziletli kadınlara saygı duyarız.", "a": "kesra ile mansûb", "s": "212"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "الخَيْلُ تَجُرُّ <b class=\"hd\">العَجَلاتِ</b>", "tr": "Atlar arabaları çeker.", "a": "kesra ile mansûb", "s": "212"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "كافَأْتُ <b class=\"hd\">الفائِزاتِ</b>", "tr": "Kazanan kızları ödüllendirdim.", "a": "kesra ile mansûb", "s": "213"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "إِنَّ <b class=\"hd\">الحَسَناتِ</b> يُذْهِبْنَ السَّيِّئاتِ", "tr": "İyilikler kötülükleri giderir. (Hûd 114)", "a": "kesra ile mansûb", "s": "213"}, {"k": 48, "g": "cemî müennes sâlimin i'râbı", "ar": "<b class=\"hd\">البَطّاتُ</b> سابِحاتٌ", "tr": "Ördekler yüzüyor.", "a": "zamme ile merfû", "s": "212"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "لَمَعَتْ <b class=\"hd\">عَيْنا</b> القِطِّ", "tr": "Kedinin iki gözü parladı.", "a": "müsennâ – elif ile merfû", "s": "215"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "غَسَلْتُ <b class=\"hd\">يَدَيِ</b> الطِّفْلِ", "tr": "Çocuğun iki elini yıkadım.", "a": "müsennâ – yâ ile mansûb", "s": "215"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "جَلَسْتُ في <b class=\"hd\">غُرْفَتَيِ</b> المُعَلِّمِينَ", "tr": "Öğretmenlerin iki odasında oturdum.", "a": "müsennâ – yâ ile mecrûr", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "أَسْرَعَ <b class=\"hd\">سائِقُو</b> الحافِلاتِ", "tr": "Otobüs şoförleri hızlandı.", "a": "cemî müzekker sâlim – vâv ile merfû", "s": "215"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "أَكْرِمْ <b class=\"hd\">مُعَلِّمِي</b> اللُّغَةِ", "tr": "Dil öğretmenlerine ikram et.", "a": "cemî müzekker sâlim – yâ ile mansûb", "s": "215"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "ثَرْوَةُ تُرْكِيا مِنْ <b class=\"hd\">زارِعِي</b> الأَرْضِ", "tr": "Türkiye'nin serveti toprağı ekenlerdendir.", "a": "cemî müzekker sâlim – yâ ile mecrûr", "s": "215"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "غَرَسْتُ <b class=\"hd\">شَجَرَتَيِ</b> الوَرْدِ", "tr": "İki gül ağacını diktim.", "a": "müsennâ – yâ ile mansûb", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "<b class=\"hd\">عَيْنا</b> البَقَرَةِ واسِعَتانِ", "tr": "İneğin iki gözü iridir.", "a": "müsennâ – elif ile merfû", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "<b class=\"hd\">بائِعُو</b> الكُتُبِ كَثِيرُونَ", "tr": "Kitap satıcıları çoktur.", "a": "cemî müzekker sâlim – vâv ile merfû", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "إِنّا <b class=\"hd\">مُرْسِلُو</b> النّاقَةِ فِتْنَةً لَهُمْ", "tr": "Biz o dişi deveyi onlara bir imtihan olarak göndereceğiz. (Kamer 27)", "a": "cemî müzekker sâlim – vâv ile merfû", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "قَبَضَ الشُّرْطِيُّ عَلَى <b class=\"hd\">سارِقِي</b> السَّيّاراتِ", "tr": "Polis araba hırsızlarını yakaladı.", "a": "cemî müzekker sâlim – yâ ile mecrûr", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "ذَهَبْتُ إِلَى <b class=\"hd\">وِزارَتَيِ</b> الدّاخِلِيَّةِ والخارِجِيَّةِ", "tr": "İçişleri ve Dışişleri bakanlıklarına gittim.", "a": "müsennâ – yâ ile mecrûr", "s": "216"}, {"k": 49, "g": "nûnu düşen muzâfın türü ve i'râbı", "ar": "يَشْكُرُ التّارِيخُ <b class=\"
