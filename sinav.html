212", "c": "alamet"}, {"k": 49, "d": "İzafette muzâf müsennâ veya cemî müzekker sâlim olursa düşürülen harf", "t": "nûn", "s": "215", "c": "harf"}, {"k": 50, "d": "Muzâf maksûr, menkûs, müsennâ veya cemî müzekker sâlim olduğunda mütekellim yâ'sının aldığı hareke", "t": "fetha", "s": "219", "c": "hareke"}, {"k": 50, "d": "Mütekellim yâ'sına muzâf olan sahîh müfred ismin son harfinin, yâ'ya uyum için aldığı hareke", "t": "kesra", "s": "219", "c": "hareke"}, {"k": 51, "d": "Tekilindeki harflerin sayısı veya harekeleri değişerek yapılan çoğul", "t": "cemî teksîr", "s": "226", "c": "cemi"}, {"k": 51, "d": "Üç ile dokuz arasındaki sayıyı ifade eden cemî teksîr", "t": "cem-i kıllet", "s": "223", "c": "cemi"}, {"k": 51, "d": "Üçten fazla varlığın çoğulunu ifade eden cemî teksîr", "t": "cem-i kesret", "s": "224", "c": "cemi"}, {"k": 51, "d": "Zâid eliften sonra iki veya üç harf bulunan, gayr-i munsarif çoğul sîgası", "t": "müntehe'l-cumû'", "s": "225", "c": "cemi"}, {"k": 52, "d": "Sonunda sabit (lâzım) elif bulunan mu'rab isim", "t": "ism-i maksûr", "s": "230", "c": "isimturu"}, {"k": 52, "d": "İsm-i maksûrun üç hâldeki i'râbı", "t": "takdîrî", "s": "230", "c": "irabturu"}, {"k": 53, "d": "Son kök harfi, öncesi kesralı bir yâ olan mu'rab isim", "t": "ism-i menkûs", "s": "233", "c": "isimturu"}, {"k": 53, "d": "İsm-i menkûsun açık fetha ile i'râb edildiği hâl", "t": "nasb hâli", "s": "233", "c": "hal"}, {"k": 53, "d": "İsm-i menkûsun i'râbının takdîrî olduğu hâller", "t": "raf' ve cer hâlleri", "s": "233", "c": "hal"}, {"k": 54, "d": "أَب، أَخ، حَم، ذُو، فُو kelimelerine verilen ad", "t": "esmâ-i hamse", "s": "237", "c": "isimturu"}, {"k": 54, "d": "Esmâ-i hamsenin raf' alâmeti", "t": "vâv", "s": "237", "c": "alamet"}, {"k": 54, "d": "Esmâ-i hamsenin nasb alâmeti", "t": "elif", "s": "237", "c": "alamet"}, {"k": 54, "d": "Esmâ-i hamsenin cer alâmeti", "t": "yâ", "s": "237", "c": "alamet"}, {"k": 54, "d": "Esmâ-i hamsenin harfle i'râb edilmesinin şartı", "t": "müfred olup mütekellim yâ'sı dışında bir kelimeye muzâf olmak", "s": "237", "c": "sart"}, {"k": 55, "d": "Hiçbir zaman tenvin almayan, muzâf veya ال takılı olmadıkça kesra yerine fetha ile mecrûr olan isim", "t": "gayr-i munsarif", "s": "242", "c": "isimturu"}, {"k": 55, "d": "Gayr-i munsarif ismin cer alâmeti", "t": "kesra yerine fetha", "s": "242", "c": "alamet"}, {"k": 55, "d": "Gayr-i munsarif ismin kesra ile mecrûr olabildiği durum", "t": "muzâf olması veya başına ال gelmesi", "s": "245", "c": "sart"}, {"k": 55, "d": "\"Sarf\" sözcüğünün gayr-i munsarif konusundaki anlamı", "t": "tenvin", "s": "240", "c": "terim"}, {"k": 56, "d": "Cümledeki fiille aynı kökten olup fiilin anlamını pekiştiren, türünü veya sayısını bildiren mansûb isim", "t": "mef'ûlü mutlak", "s": "249", "c": "mansub"}, {"k": 56, "d": "Mef'ûlü mutlakın geliş amaçları", "t": "te'kîd, nev' ve adet bildirme", "s": "248", "c": "amac"}, {"k": 57, "d": "Fiilin yapılış sebebini bildiren mansûb kalbî masdar", "t": "mef'ûlü lieclih", "s": "252", "c": "mansub"}, {"k": 57, "d": "Mef'ûlü lieclihin şartlarından biri eksikse başına gelmesi gereken", "t": "sebep bildiren bir harf-i cer (لِ، مِنْ، في، بِ)", "s": "252", "c": "sart"}, {"k": 57, "d": "Mef'ûlü lieclih olan masdarın, âmili olan fiille ortak olması gereken iki şey", "t": "zaman ve fâil", "s": "252", "c": "sart"}, {"k": 58, "d": "Fiilin gerçekleştiği zamanı veya yeri bildiren mansûb kelime", "t": "mef'ûlü fîh (zarf)", "s": "255", "c": "mansub"}, {"k": 58, "d": "Yeri sabit ve sınırları belli olan mekân isimlerinin (مَسْجِد، بَحْر gibi) zarf olarak kullanımı", "t": "في veya بِ harf-i ceri ile mecrûr olarak", "s": "254", "c": "sart"}, {"k": 59, "d": "Öncesi ile sonrasının aynı hükümde ortak olmadığını, yalnızca birlikteliği bildiren vâv", "t": "ma'iyye vâvı", "s": "", "c": "vav"}, {"k": 59, "d": "Öncesi ile sonrasının aynı hükmü taşıdığını bildiren, sonrası i'râbda öncesine uyan vâv", "t": "atıf vâvı", "s": "", "c": "vav"}, {"k": 59, "d": "Ma'iyye vâvından sonra gelen ve daima mansûb olan isim", "t": "mef'ûlü meah", "s": "", "c": "mansub"}, {"k": 59, "d": "İşteşlik bildiren fiillerden (تَخاصَمَ، اِشْتَرَكَ gibi) sonra gelen vâvın türü", "t": "atıf vâvı", "s": "", "c": "vav"}, {"k": 60, "d": "Kendisinden önceki isim veya cümledeki kapalılığı açıklayan müfred, nekra, mansûb isim", "t": "temyîz", "s": "", "c": "mansub"}, {"k": 60, "d": "Temyîzin açıkladığı, anlamı kapalı kelime", "t": "mümeyyez", "s": "", "c": "terim"}, {"k": 60, "d": "İsim temyîzinin kendisinden sonra geldiği kelimeler", "t": "ağırlık, hacim, alan ve uzunluk ölçüleri, كَمْ ve sayılar", "s": "", "c": "sart"}, {"k": 61, "d": "Fâilin, mef'ûlün veya başka bir öğenin, fiil gerçekleşirken içinde bulunduğu durumu bildiren mansûb isim", "t": "hâl", "s": "", "c": "mansub"}, {"k": 61, "d": "Hâlin, durumunu bildirdiği öğe", "t": "sâhibu'l-hâl", "s": "", "c": "terim"}, {"k": 61, "d": "Hâl cümle olarak geldiğinde hâl sahibiyle arasında bulunması gereken şey", "t": "bağlaç (vâv, zamir veya ikisi birden)", "s": "", "c": "sart"}, {"k": 62, "d": "Fâil, fiille arasına kelime girmemiş hakiki müennes açık isim olduğunda fiilin durumu", "t": "vücûben müennes", "s": "", "c": "hukum"}, {"k": 62, "d": "Fâil hakiki müennes olup fiille arasına başka bir kelime girdiğinde fiilin durumu", "t": "müzekker veya müennes olabilir", "s": "", "c": "hukum"}, {"k": 63, "d": "ما زالَ، ما بَرِحَ، ما فَتِئَ، ما انْفَكَّ fiillerinin ameli", "t": "كانَ gibi ismini raf', haberini nasb etmek", "s": "", "c": "amel"}, {"k": 63, "d": "Süreklilik (istimrâr) fiillerinin başında bulunması gereken", "t": "olumsuzluk edatı", "s": "", "c": "sart"}, {"k": 63, "d": "Kendinden önceki cümlenin sürecini bildiren nâkıs fiil", "t": "ما دامَ", "s": "", "c": "fiil"}, {"k": 63, "d": "دامَ fiilinin nâkıs olabilmesi için başında bulunması gereken", "t": "zaman bildiren ما", "s": "", "c": "sart"}, {"k": 64, "d": "Haberde bildirilen oluşun yakınlaştığını ifade eden كادَ، كَرَبَ، أَوْشَكَ fiilleri", "t": "mukârebe (yaklaşma) fiilleri", "s": "", "c": "fiilgrubu"}, {"k": 64, "d": "Haberinin başına genellikle أَنْ gelen yaklaşma fiili", "t": "أَوْشَكَ", "s": "", "c": "fiil"}, {"k": 64, "d": "Yaklaşma fiillerinin haberinde aranan şart", "t": "muzâri fiille başlayan fiil cümlesi olması", "s": "", "c": "sart"}, {"k": 65, "d": "Haberde bildirilen işin başladığını ifade eden شَرَعَ، أَنْشَأَ، طَفِقَ، أَخَذَ، عَلِقَ، جَعَلَ gibi fiiller", "t": "şurû' (başlama) fiilleri", "s": "", "c": "fiilgrubu"}, {"k": 66, "d": "Haberdeki işin gerçekleşmesinin umulduğunu bildiren عَسَى، حَرَى، اِخْلَوْلَقَ fiilleri", "t": "racâ (umut) fiilleri", "s": "", "c": "fiilgrubu"}, {"k": 66, "d": "Racâ fiilinden sonra isim gelmeden doğrudan أَنْ'li muzâri fiil geldiğinde fiilin türü", "t": "tâm fiil", "s": "", "c": "terim"}, {"k": 66, "d": "Yalnız mâzîsi çekilebilen câmid racâ fiili", "t": "عَسَى", "s": "", "c": "fiil"}, {"k": 67, "d": "Cinsi nefyeden lâ'nın ameli", "t": "إِنَّ gibi ismini nasb, haberini raf' etmek", "s": "", "c": "amel"}, {"k": 67, "d": "Cinsi nefyeden lâ'nın ismi muzâf veya şibh-i muzâf olmayan tek kelime ise i'râbı", "t": "nasb alâmeti üzere mebnî", "s": "", "c": "hukum"}, {"k": 67, "d": "Cinsi nefyeden lâ'nın ismi marife olduğunda veya ismiyle arasına kelime girdiğinde gereken şey", "t": "amel etmemesi ve لا'nın tekrar edilmesi", "s": "", "c": "hukum"}, {"k": 68, "d": "لَيْسَ'ye benzeyen ve onun gibi amel eden harfler", "t": "إِنْ، ما، لا، لاتَ", "s": "", "c": "harf"}, {"k": 68, "d": "لاتَ'nin amel edebilmesinin şartı", "t": "ismi ve haberinin zaman zarfı olması ve isminin hazfedilmesi", "s": "", "c": "sart"}, {"k": 68, "d": "ما'nın haberinin başına getirilebilen zâid harf-i cer", "t": "bâ (بِ)", "s": "", "c": "harf"}, {"k": 69, "d": "Câr-mecrûrun bağlandığı fiil, şibh-i fiil veya fiil anlamlı kelime", "t": "müteallak", "s": "", "c": "terim"}, {"k": 69, "d": "Mahzûf müteallakı كَوْن، حُصُول، وُجُود، ثُبُوت gibi genel anlamlı fiillerden olan câr-mecrûr", "t": "zarf-ı müstekar", "s": "", "c": "terim"}, {"k": 69, "d": "Müteallakı özel anlamlı fiillerden olan câr-mecrûr", "t": "zarf-ı lağv", "s": "", "c": "terim"}, {"k": 69, "d": "Müteallaka ihtiyaç duymayan harf-i cerler", "t": "رُبَّ، حاشا، خَلا، عَدا", "s": "", "c": "harf"}, {"k": 69, "d": "Zâid harf-i cerin cümleye kattığı anlam", "t": "pekiştirme (te'kîd)", "s": "", "c": "amac"}, {"k": 70, "d": "Fiilin gerçekleştiği zamanı bildirmek için zikredilen isim", "t": "zarf-ı zaman", "s": "", "c": "zarf"}, {"k": 70, "d": "Fiilin işlendiği yeri açıklamak için zikredilen isim", "t": "zarf-ı mekân", "s": "", "c": "zarf"}, {"k": 70, "d": "Merfû veya mecrûr olarak, zarf görevi dışında da kullanılabilen zarf", "t": "mutasarrıf zarf", "s": "", "c": "zarf"}, {"k": 70, "d": "Sürekli zarfiyet üzere mansûb olan veya yalnızca مِنْ ile mecrûr kullanılan zarf", "t": "gayr-i mutasarrıf zarf", "s": "", "c": "zarf"}, {"k": 70, "d": "Mahdûd (sınırı belli) mekân isimlerinin cümlede kullanımı", "t": "harf-i cerle mecrûr olarak", "s": "", "c": "hukum"}, {"k": 70, "d": "Bir zaman veya mekân isminin zarfiyet üzere mansûb olabilmesi için içermesi gereken anlam", "t": "في anlamı", "s": "", "c": "sart"}, {"k": 71, "d": "Yalnızca cümleye muzâf olan mebnî zarflar", "t": "حَيْثُ، إِذْ، إِذا، لَمّا", "s": "", "c": "zarf"}, {"k": 71, "d": "Hem cümleye hem tek kelimeye muzâf olabilen zarflar", "t": "mübhem zaman zarfları (حِين، وَقْت، زَمَن gibi)", "s": "", "c": "zarf"}, {"k": 71, "d": "Mübhem zaman zarfı cümleye muzâf olduğunda i'râb durumu", "t": "mu'rab da olabilir, fetha üzere mebnî de", "s": "", "c": "hukum"}, {"k": 72, "d": "إِنَّ ile isim ve haberi masdara çevrilemediğinde hemzenin harekesi", "t": "kesra", "s": "", "c": "hareke"}, {"k": 72, "d": "إِنَّ'nin hemzesinin kesralı okunması gereken yerler", "t": "cümle başı, قالَ'den sonrası ve sıla cümlesinin başı", "s": "", "c": "sart"}, {"k": 73, "d": "أَنَّ ile isim ve haberi masdarın yerini tuttuğunda hemzenin harekesi", "t": "fetha", "s": "", "c": "hareke"}, {"k": 73, "d": "أَنَّ ile isminden ve haberinden oluşan, masdar anlamı taşıyan yapı", "t": "muevvel masdar", "s": "", "c": "terim"}, {"k": 74, "d": "Masdar harfi أَنْ ile kendisinden sonraki fiilden oluşan ve masdar olarak yorumlanan yapı", "t": "muevvel masdar", "s": "", "c": "terim"}, {"k": 74, "d": "أَنْ ve fiilden oluşan muevvel masdarın cümlede alabileceği görevler", "t": "fâil, nâib-i fâil, mübtedâ, haber, mef'ûlün bih ve mecrûr", "s": "", "c": "sart"}, {"k": 75, "d": "إِنَّ ve kardeşlerine bitişerek onların amel etmesine engel olan harf", "t": "zâid ما (mâ-i kâffe)", "s": "", "c": "harf"}, {"k": 75, "d": "Zâid ما bitiştiğinde amel ettirilmesi de ettirilmemesi de câiz olan edat", "t": "لَيْتَ", "s": "", "c": "harf"}, {"k": 76, "d": "Amel etmeyen muhaffef إِنْ'i olumsuzluk bildiren إِنْ'den ayırmak için haberin başına getirilen lâm", "t": "lâm-ı fârika", "s": "", "c": "harf"}, {"k": 76, "d": "Tahfif edildiğinde vücûben amel etmeyen edat", "t": "لَكِنْ", "s": "", "c": "harf"}, {"k": 76, "d": "Tahfif edilen أَنْ ve كَأَنْ'in ismi", "t": "mahzûf şan zamiri", "s": "", "c": "terim"}, {"k": 77, "d": "Nidâ edatlarından birinden sonra gelen ve gösterdiği kişinin yönelmesini istemek için zikredilen isim", "t": "münâdâ", "s": "", "c": "terim"}, {"k": 77, "d": "Münâdânın mansûb olduğu durumlar", "t": "muzâf, şebîh bi'l-muzâf veya nekre-i gayr-i maksûde olması", "s": "", "c": "sart"}, {"k": 77, "d": "Münâdânın merfû olduğu alâmet üzere mebnî olduğu durumlar", "t": "nekre-i maksûde veya müfred alem olması", "s": "", "c": "sart"}, {"k": 78, "d": "Söyleme kolaylığı sağlamak için münâdânın sonundan bir veya daha çok harfin hazfedilmesi", "t": "terhîm", "s": "", "c": "terim"}, {"k": 79, "d": "Acı çeken veya acı çektiren kişiye sızlanma ünlemi", "t": "nüdbe", "s": "", "c": "terim"}, {"k": 79, "d": "Nüdbe edatıyla ünlenen isim", "t": "mendûb", "s": "", "c": "terim"}, {"k": 79, "d": "Nüdbe edatları", "t": "وا ve (nüdbe amacı açıksa) يا", "s": "", "c": "harf"}, {"k": 80, "d": "Bir sıkıntıyı giderebilecek birine yardım çağrısında bulunmak", "t": "istiğâse", "s": "", "c": "terim"}, {"k": 80, "d": "İstiğâsede kullanılan tek nidâ edatı", "t": "يا", "s": "", "c": "harf"}, {"k": 81, "d": "İstisnâ edatından sonra gelen ve öncesindeki hükmün dışında bırakılan isim", "t": "müstesnâ", "s": "", "c": "terim"}, {"k": 81, "d": "Kendisinden istisnâ yapılan isim", "t": "müstesnâ minh", "s": "", "c": "terim"}, {"k": 81, "d": "غَيْر ve سِوَى'dan sonra gelen ismin i'râbı", "t": "izafetle mecrûr", "s": "", "c": "hukum"}, {"k": 81, "d": "خَلا، عَدا، حاشا fiil kabul edildiğinde müstesnânın i'râbı", "t": "mef'ûl olarak mansûb", "s": "", "c": "hukum"}, {"k": 82, "d": "Kendisinden önceki kelimeye i'râbda uyan kelime", "t": "tâbi'", "s": "", "c": "terim"}, {"k": 82, "d": "Tâbi'lerin çeşitleri", "t": "sıfat, te'kîd, atıf, bedel ve atf-ı beyân", "s": "", "c": "sart"}, {"k": 83, "d": "Kendisinden önceki bir ismi niteleyen ve ona cinsiyet, sayı, marifelik ve i'râb yönünden uyan tâbi'", "t": "hakikî sıfat", "s": "", "c": "tabi"}, {"k": 83, "d": "Mevsûf ile bağlantılı bir ismin niteliğini gösteren sıfat", "t": "sebebî sıfat", "s": "", "c": "tabi"}, {"k": 83, "d": "Sebebî sıfatın mevsûfuna uyduğu yönler", "t": "i'râb ile marifelik-nekrelik", "s": "", "c": "sart"}, {"k": 83, "d": "Sıfatın cümle olarak gelebilmesi için mevsûfta aranan şart", "t": "nekre olması", "s": "", "c": "sart"}, {"k": 84, "d": "Muhatabın zihninde oluşabilecek tereddütleri gidermek için zikredilen tâbi'", "t": "te'kîd", "s": "", "c": "tabi"}, {"k": 84, "d": "Müekkedin (ismin, fiilin, harfin veya cümlenin) aynen tekrar edilmesiyle yapılan te'kîd", "t": "lafzî te'kîd", "s": "", "c": "tabi"}, {"k": 84, "d": "النَّفْس، العَيْن، كُلّ، جَمِيع، كِلا، كِلْتا kelimeleriyle yapılan te'kîd", "t": "ma'nevî te'kîd", "s": "", "c": "tabi"}, {"k": 84, "d": "Ma'nevî te'kîd kelimelerine bitişmesi şart olan şey", "t": "müekkede uygun bir zamir", "s": "", "c": "sart"}, {"k": 84, "d": "Muttasıl veya müstetir merfû zamirin نَفْس ya da عَيْن ile te'kîdinden önce yapıl function buildBel(s,r){const BEL=s.konu>=200?GRM:window.__BEL,BK=BEL.D.K;const k=s.konu-(s.konu>=200?200:100);const S=BEL.D.S.filter(x=>!k||x.k===k),T=BEL.D.T.filter(x=>!k||x.k===k);
  const cand=[];S.forEach(x=>{cand.push(["tani",x]);cand.push(["hangi",x]);});T.forEach(x=>cand.push(["tanim",x]));
  shuf(cand,r);const used=new Set(),out=[];
  const usedP=new Set();
  for(const [m,x] of cand){if(out.length>=s.n)break;if(used.has(x))continue;const q=m==="tani"?BEL.tani(x,r):m==="hangi"?BEL.hangi(x,r):BEL.tanim(x,r);if(!q)continue;if(m==="hangi"&&usedP.has(q.prompt))continue;usedP.add(q.prompt);used.add(x);out.push(q);}
  for(const [m,x] of cand){if(out.length>=s.n)break;if(out.some(o=>o.item===x&&o.kind===m))continue;const q=m==="tani"?BEL.tani(x,r):m==="hangi"?BEL.hangi(x,r):BEL.tanim(x,r);if(q)out.push(q);}
  return out.map((q,i)=>{const it=q.item;let head="",key="";
    if(q.kind==="tani"){head=`<div class="ayah sent2">${q.ar}</div><div class="ref">${esc(q.tr)}</div>`;key=`<div class="ayah sent2 kk">${it.ar}</div>`;}
    if(q.kind==="tanim"){head=`<div class="${q.defAr?"ayah sent2":"defn"}">${q.defAr?q.def:esc(q.def)}</div>`;key=`<div class="m">${esc(it.d)}</div>`;}
    if(q.kind==="hangi"){key=`<div class="ayah sent2 kk">${it.ar}</div>`;}
    return {id:i,kat:BK[it.k],prompt:esc(q.prompt),head,key,opts:q.opts.map(o=>({t:o.t,ok:o.ok,ar:!!o.ar,ln:q.kind==="hangi"}))};});}

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shuf=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const NEAR={"kesre (fetha yerine)":["fetha","yâ","elif"],"fetha (kesre yerine)":["kesre","yâ","damme"],"nûnun düşmesi":["nûnun sübûtu","sükûn","fetha"],"nûnun sübûtu":["nûnun düşmesi","damme","vâv"],"illet harfinin düşmesi":["sükûn","nûnun düşmesi","kesre"],
  "vâv":["damme","elif","yâ"],"elif":["fetha","vâv","yâ"],"yâ":["kesre","fetha","elif"],"damme":["vâv","fetha","kesre"],"fetha":["elif","kesre (fetha yerine)","damme"],"kesre":["yâ","fetha (kesre yerine)","fetha"],"sükûn":["illet harfinin düşmesi","nûnun düşmesi","fetha"]};
const sent=(q,blank)=>`<div class="ayah sent">${q.pre}<span class="tg">${blank?"……":q.tg}</span>${q.post}</div>`;

// Oturum için soru seti: herkes aynı soruları aynı şıklarla alır, sıra öğrenciye göre karışır
function buildExam(s,studentKey){
  const r=rng(hashStr(s.oturum));
  if(s.konu>=100)return shuf(buildBel(s,r),rng(hashStr(s.oturum+"|"+studentKey)));
  const pool=Q.filter(q=>!s.konu||q.k===s.konu);
  const types=["gorev","alamet","hareke"];
  const cand=[];pool.forEach((q,i)=>types.forEach(t=>cand.push([i,t])));
  shuf(cand,r);
  const used=new Set(),pick=[];
  for(const [i,t] of cand){if(pick.length>=s.n)break;if(used.has(i)&&pick.length<pool.length)continue;used.add(i);pick.push([i,t]);}
  for(const [i,t] of cand){if(pick.length>=s.n)break;if(!pick.some(p=>p[0]===i&&p[1]===t))pick.push([i,t]);}
  const items=pick.map(([i,t],x)=>{const q=pool[i];let opts,prompt,head;
    if(t==="gorev"){prompt="Renkli kelimenin cümledeki görevi nedir?";head=sent(q);
      if(VERB.includes(q.role))opts=shuf([...VERB,"mâzî fiil"],r);
      else{const bad=new Set([q.role,...(EXCL[q.role]||[])]);const same=shuf(BYCASE[q.cs].filter(z=>!bad.has(z)),r).slice(0,2);same.forEach(z=>bad.add(z));
        opts=shuf([q.role,...same,...shuf(ALL.filter(z=>!bad.has(z)),r).slice(0,3-same.length)],r);}
      opts=opts.map(o=>({t:o,ok:o===q.role}));}
    if(t==="alamet"){prompt=`Renkli kelime ${CS[q.cs]}dur. İ'râb alameti nedir?`;head=sent(q);
      opts=shuf([q.al,...(NEAR[q.al]||shuf(SIGNS.filter(z=>z!==q.al),r).slice(0,3))],r).map(o=>({t:o,ok:o===q.al}));}
    if(t==="hareke"){prompt="Boşluğa hangisi gelmelidir?";head=sent(q,true);
      opts=shuf(q.f.slice(),r).map(o=>({t:o,ok:o===q.tg,ar:true}));}
    return {id:x,kat:KN[q.k],prompt,head:head+`<div class="ref">${esc(q.tr)}</div>`,key:`<div class="ayah sent kk">${q.pre+q.tg+q.post}</div>`,opts};});
  return shuf(items,rng(hashStr(s.oturum+"|"+studentKey)));
}

async function waitOpen(ad,no){
  $("#app").innerHTML=`<section class="card"><p class="prompt">Hoş geldiniz, ${esc(ad)}.</p><div class="note" id="w">Sınav durumu kontrol ediliyor…</div></section>`;
  clearInterval(poll);

    if(S.acik){
      if(LS.get("sinav-bitti-"+S.oturum,null)){clearInterval(poll);return showDone(LS.get("sinav-bitti-"+S.oturum));}
      clearInterval(poll);beginExam(ad,no);}
    else $("#w").innerHTML=`<span class="pulse"></span> Öğretmeninizin sınavı başlatması bekleniyor. Bu sayfayı kapatmayın.`;};
  await check();poll=setInterval(check,3000);
}
function beginExam(ad,no){
  exam=buildExam(S,no);
  st=LS.get("sinav-durum-"+S.oturum,null)||{ans:{},cur:0,sekme:0,t0:now()};
  st.ad=ad;st.no=no;save();
  document.addEventListener("visibilitychange",onVis);
  $("#timer").hidden=false;
  clearInterval(tick);tick=setInterval(()=>{const left=S.bit-now();$("#timer").textContent="⏱ "+fmt(left);$("#timer").classList.toggle("low",left<60000);if(left<=0)finish(true);},250);
  // öğretmen erken kapatırsa
  clearInterval(poll);poll=setInterval(async()=>{try{const d=await get({a:"durum"});if(d.oturum===S.oturum&&!d.acik){S.bit=Math.min(S.bit,d.bit);if(now()>=S.bit)finish(true);}}catch(e){}},10000);
  renderQ();
}
const save=()=>LS.set("sinav-durum-"+S.oturum,st);
function onVis(){if(document.hidden&&exam){st.sekme++;save();}}
function renderQ(){
  const it=exam[st.cur],a=st.ans[it.id];
  $("#top").innerHTML=`${esc(st.ad)} · soru <b>${st.cur+1}</b>/${exam.length} · cevaplanan <b>${Object.keys(st.ans).length}</b>`;
  $("#app").innerHTML=`<section class="card"><div class="kind">${it.kat}</div><p class="prompt">${it.prompt}</p>${it.head}
    <div class="opts${it.opts.length===2?" two":""}${it.opts[0].ln?" col1":""}">${it.opts.map((o,i)=>`<button class="opt ${o.ln?"aropt":o.ar?"":"mean"}${a===i?" sel":""}" data-i="${i}">${o.ln?`<span dir="rtl">${o.t}</span>`:o.ar?`<span class="arw">${o.t}</span>`:esc(o.t)}</button>`).join("")}</div></section>
    <div class="dots">${exam.map((e,i)=>`<button class="dot${st.ans[e.id]!==undefined?" done":""}${i===st.cur?" cur":""}" data-j="${i}">${i+1}</button>`).join("")}</div>
    <div class="row2"><button class="btn" id="prev"${st.cur?"":" disabled"}>← Önceki</button><button class="btn" id="nxt">${st.cur<exam.length-1?"Sonraki →":"Başa dön"}</button></div>
    <button class="btn danger wide" id="fin">Sınavı bitir ve gönder</button>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ans[it.id]=+b.dataset.i;save();
    const nx=exam.findIndex((e,i)=>i>st.cur&&st.ans[e.id]===undefined);
    setTimeout(()=>{st.cur=nx>=0?nx:Math.min(st.cur+1,exam.length-1);save();renderQ();},180);
    b.classList.add("sel");});
  document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.j;save();renderQ();});
  $("#prev").onclick=()=>{st.cur--;save();renderQ();};
  $("#nxt").onclick=()=>{st.cur=st.cur<exam.length-1?st.cur+1:0;save();renderQ();};
  let armed=false;$("#fin").onclick=e=>{const bos=exam.length-Object.keys(st.ans).length;
    if(!armed){armed=true;e.target.textContent=bos?`${bos} boş soru var. Yine de göndermek için tekrar dokunun`:"Göndermek için tekrar dokunun";setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent="Sınavı bitir ve gönder";},4000);return;}
    finish(false);};
  window.scrollTo({top:0});
}
let finishing=false;
async function finish(auto){
  if(finishing)return;finishing=true;clearInterval(tick);clearInterval(poll);$("#timer").hidden=true;
  document.removeEventListener("visibilitychange",onVis);
  let d=0,y=0,b=0;const cev=[];
  exam.forEach(it=>{const a=st.ans[it.id];if(a===undefined){b++;cev[it.id]="-";}else if(it.opts[a].ok){d++;cev[it.id]="D";}else{y++;cev[it.id]="Y";}});
  const puan=Math.round(100*d/exam.length);
  const res={oturum:S.oturum,ad:st.ad,numara:st.no,puan,dogru:d,yanlis:y,bos:b,sn:Math.round((Math.min(now(),S.bit)-st.t0)/1000),sekme:st.sekme,cevaplar:cev.join("")};
  $("#app").innerHTML=`<section class="card"><p class="prompt">${auto?"Süre doldu.":"Sınav bitti."} Cevaplarınız gönderiliyor…</p></section>`;
  let ok=false;for(let k=0;k<4&&!ok;k++){try{const r=await post(Object.assign({a:"gonder"},res));ok=!!r.ok;}catch(e){await new Promise(z=>setTimeout(z,1500*(k+1)));}}
  const done=Object.assign(res,{gonderildi:ok,detay:exam.map(it=>({s:it.key,soru:it.prompt,dogru:it.opts.find(o=>o.ok).t,ar:!!it.opts[0].ar,ver:st.ans[it.id]===undefined?null:it.opts[st.ans[it.id]].t,ok:st.ans[it.id]!==undefined&&it.opts[st.ans[it.id]].ok}))});
  LS.set("sinav-bitti-"+S.oturum,done);LS.del("sinav-durum-"+S.oturum);
  showDone(done);
}
const fmt1=n=>String(Math.round(10*n)/10).replace(".",",");
function statBox(x,title){return `<h3 class="sh">${title}</h3><div class="kpis k4"><div class="kpi"><b>${x.katilimci}</b><span>katılımcı</span></div><div class="kpi"><b>${fmt1(x.ortalama)}</b><span>ortalama</span></div><div class="kpi"><b>${x.enYuksek}</b><span>en yüksek</span></div><div class="kpi"><b>${x.enDusuk}</b><span>en düşük</span></div></div>`;}
function showDone(r){
  $("#timer").hidden=true;

  if(S&&S.acik&&S.oturum===r.oturum&&now()<S.bit){clearInterval(poll);poll=setInterval(async()=>{try{const d=await get({a:"durum"});if(d.oturum!==r.oturum||!d.acik){S=d;clearInterval(poll);showDone(r);}}catch(e){}},5000);}
  if(!(S&&S.acik&&S.oturum===r.oturum&&now()<S.bit)){
    $("#sinif").innerHTML='<div class="note">Sınıfın sonuçları hesaplanıyor…</div>';

  const t=$("#tekrar");if(t)t.onclick=async()=>{t.disabled=true;try{const q=await post(Object.assign({a:"gonder"},r,{detay:undefined}));if(q.ok){r.gonderildi=true;LS.set("sinav-bitti-"+r.oturum,r);showDone(r);}else t.disabled=false;}catch(e){t.disabled=false;}};
}

      <div class="fl">Ders<div class="row2" style="margin:0" id="dersSec"><button class="btn${(lastKonu.konu||0)<100?" on":""}" data-d="0">İ'râb</button><button class="btn${(lastKonu.konu||0)>=100&&lastKonu.konu<200?" on":""}" data-d="100">Belâgat</button><button class="btn${(lastKonu.konu||0)>=200?" on":""}" data-d="200">Dil Bilgisi</button></div></div>
      <label class="fl">Konu<select id="konu"></select></label>
      <div class="row2"><label class="fl">Soru sayısı<select id="n">${[10,15,20,25,30].map(x=>`<option${x==lastKonu.n?" selected":""}>${x}</option>`).join("")}</select></label>
      <label class="fl">Süre (dk)<select id="sure">${[3,5,7,10,15,20,30].map(x=>`<option${x==lastKonu.sure?" selected":""}>${x}</option>`).join("")}</select></label></div>
      <button class="next" id="bas">Sınavı başlat</button><div class="note" id="secim" style="text-align:center;font-weight:600"></div><div class="note">Öğrenciler giriş yapıp bekleme ekranında olmalı. Başlatınca hepsinde aynı anda açılır, süre bitince kapanır.</div>`;
      const fillKonu=(d,sel)=>{const opts=d>=200?[[200,`Bütün konular (${GRM.D.S.length+GRM.D.T.length} soru)`],...Object.keys(GK).map(k=>[200+ +k,`${k}. ${GK[k]} (${GRM.D.S.filter(x=>x.k==k).length+GRM.D.T.filter(x=>x.k==k).length} soru)`])]:d>=100?["Bütün konular",...Object.values(BK)].map((k,i)=>[100+i,`${i?i+". ":""}${k} (${BEL.D.S.filter(x=>!i||x.k===i).length+BEL.D.T.filter(x=>!i||x.k===i).length} soru)`]):["Bütün konular",...Object.values(KN)].map((k,i)=>[i,`${i?i+". ":""}${k} (${Q.filter(q=>!i||q.k===i).length} cümle)`]);
        $("#konu").innerHTML=opts.map(([v,t])=>`<option value="${v}"${v==sel?" selected":""}>${t}</option>`).join("");if(!opts.some(o=>o[0]==sel))$("#konu").value=String(opts[0][0]);showSel();};
      const showSel=()=>{$("#secim").textContent="Seçilen: "+konuAdi(+$("#konu").value)+" · "+$("#n").value+" soru · "+$("#sure").value+" dk";};
      document.querySelectorAll("#dersSec button").forEach(bt=>bt.onclick=()=>{document.querySelectorAll("#dersSec button").forEach(x=>x.classList.toggle("on",x===bt));fillKonu(+bt.dataset.d,-1);});
      fillKonu((lastKonu.konu||0)>=200?200:(lastKonu.konu||0)>=100?100:0,lastKonu.konu||0);["#konu","#n","#sure"].forEach(s=>$(s).onchange=showSel);
      $("#bas").onclick=async e=>{e.target.disabled=true;const a={konu:+$("#konu").value,n:+$("#n").value,sure:+$("#sure").value};LS.set("sinav-ayar-2",a);
        const x=await post(Object.assign({a:"baslat",pin:PIN},a));if(x.hata){alert("Başlatılamadı");e.target.disabled=false;return;}r=Object.assign(x,{sonuclar:[]});ctl();res();};}
  };
  const res=()=>{const L=(r.sonuclar||[]).slice().sort((a,b)=>b.puan-a.puan||a.sn-b.sn);
    const P=L.filter(x=>x.durum!=="tekrar").map(x=>Number(x.puan)||0);
    const ist=P.length?{katilimci:P.length,ortalama:P.reduce((a,b)=>a+b,0)/P.length,enYuksek:Math.max(...P),enDusuk:Math.min(...P)}:null;
    $("#rh").innerHTML=r.oturum?(ist?statBox(ist,`Sonuçlar · ${esc(konuAdi(r.konu))} · oturum ${esc(r.oturum)}${r.acik?" · sınav sürüyor":""}`):`<h3 class="sh">Sonuçlar · oturum ${esc(r.oturum)}</h3>`):`<h3 class="sh">Henüz sınav yapılmadı</h3>`;
    $("#res").innerHTML=L.length?`<table class="tbl"><thead><tr><th>#</th><th>Ad Soyad</th><th>No</th><th>Puan</th><th>D/Y/B</th><th>Süre</th><th>Not</th><th></th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.ad)}</td><td>${esc(x.no)}</td><td><b>${x.puan}</b></td><td>${x.dogru}/${x.yanlis}/${x.bos}</td><td>${fmt(x.sn*1000)}</td><td>${x.durum!=="zamanında"?esc(x.durum):""}${x.sekme?` sekme:${x.sekme}`:""}</td><td><button class="del" data-k="s|${esc(x.no)}">${armed==="s|"+x.no?"emin misiniz?":"sil"}</button></td></tr>`).join("")}</tbody></table><button class="del" data-k="s*">${armed==="s*"?"Emin misiniz? Silmek için tekrar dokunun":"Bu oturumun bütün sonuçlarını sil"}</button>`:`<div class="note">${r.acik?"Gönderen öğrenci olunca burada görünecek.":""}</div>`;
    renderAnaliz(r,L);
    $("#csv").onclick=()=>{const rows=[...(ist?[["Katılımcı",ist.katilimci,"Ortalama",fmt1(ist.ortalama),"En yüksek",ist.enYuksek,"En düşük",ist.enDusuk],[]]:[]),["Sıra","Ad Soyad","Numara","Puan","Doğru","Yanlış","Boş","Süre (sn)","Sekme değiştirme","Durum"],...L.map((x,i)=>[i+1,x.ad,x.no,x.puan,x.dogru,x.yanlis,x.bos,x.sn,x.sekme,x.durum])];
      const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`irab-sinavi-${r.oturum||"sonuc"}.csv`;a.click();};};
  ctl();res();
  clearInterval(rpoll);rpoll=setInterval(async()=>{
    if(r.acik){const k=$("#kalan");if(k)k.textContent=fmt(r.bit-now());if(r.bit-now()<=0){r.acik=false;ctl();}}
  },500);
  let busy=false;setInterval(async()=>{if(busy||location.hash!=="#ogretmen")return;busy=true;try{const x=await get({a:"sonuclar",pin:PIN});if(!x.hata){const was=r.acik;r=x;if(was!==r.acik)ctl();res();}}catch(e){}busy=false;},5000);
}

function route(){if(location.hash==="#ogretmen")teacher();else{clearInterval(rpoll);studentStart();}}
window.addEventListener("hashchange",()=>location.reload());
if(API.startsWith("__")){$("#app").innerHTML='<div class="note">Sınav bağlantısı henüz kurulmadı.</div>';}else route();
</script>
</body></html>
